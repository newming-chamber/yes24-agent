<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__BRAND_TITLE__</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --border: #e5e5e8;
      --text: #1a1a1e;
      --muted: #8a8a92;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --assistant-bg: #f0f0f3;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --web: #ea580c;
      --error-bg: #fee2e2;
      --error-text: #b91c1c;
      --error-border: #fecaca;
      --chip-bg: #ffffff;
      --card-bg: #ffffff;
      /* 랜딩(빈 대화) 상태 — 중앙 컴포저 배치 상수 */
      --landing-gap: 20px;              /* 인사 ↔ 컴포저 ↔ 예시 칩 사이 여백 */
      --composer-radius-landing: 26px;  /* 랜딩의 넓은 라운드형 입력창 */
      --landing-shift-ms: 240ms;        /* 중앙 → 하단 전환 시간 */
      --composer-max-h: 140px;          /* 컴포저 textarea 최대 높이(자동 성장 상한, JS와 공유) */
      /* 사고과정(thinking) 컴포넌트 — 스텝·내레이션·오류 박스 배치 상수 */
      --proc-dot: 6px;                  /* 내레이션 파란 점 불릿 지름 */
      --proc-gap: 8px;                  /* 점·아이콘 ↔ 텍스트 간격(스텝 들여쓰기 = 점 + 이 값) */
      --proc-icon: 14px;                /* 스텝·헤더 선형 아이콘 크기 */
      --err-icon: 16px;                 /* 오류 박스 원형 ! 아이콘 크기 */
      --err-mark: #ffffff;              /* 오류 아이콘의 !(채움색 위 대비, 양 테마 공통) */
      --turn-pin-offset: 22px;          /* 전송 직후 질문 고정선 = conversation padding + 이 값(JS가 읽는다) */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171a;
        --panel: #202024;
        --border: #313136;
        --text: #ececf0;
        --muted: #9a9aa2;
        --user-bg: #2563eb;
        --user-text: #ffffff;
        --assistant-bg: #26262b;
        --accent: #60a5fa;
        --accent-soft: #1e3a5f;
        --web: #fb923c;
        --error-bg: #3b1a1a;
        --error-text: #fca5a5;
        --error-border: #7f1d1d;
        --chip-bg: #26262b;
        --card-bg: #26262b;
      }
    }
    * { box-sizing: border-box; }
    /* 스프라이트 컨테이너는 자리를 차지하지 않는다(display:none은 일부 브라우저에서 <use> 참조를 끊는다). */
    .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    /* 페이지 자체는 절대 스크롤하지 않는다 — 모든 스크롤은 #conversation 등 내부 컨테이너 몫.
       body 스크롤을 막아 1~2px 넘침으로 생기는 유령 페이지 스크롤바를 원천 차단한다. */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Noto Sans KR", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      /* 모바일 브라우저의 접히는 주소창까지 세는 100vh는 컴포저를 접힘선 아래로 밀어 페이지
         스크롤을 만든다 — 실제 보이는 높이(dvh)를 쓴다(dvh 미지원 구형은 100vh로 폴백). */
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      position: relative; /* 페르소나 팝오버(absolute) 앵커 */
    }
    header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      flex: 0 0 auto;
    }
    header .logo { font-size: 18px; }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    header .spacer { flex: 1; }
    header button {
      font-size: 12px; color: var(--muted); background: transparent;
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
      cursor: pointer;
    }
    header button:hover { color: var(--text); }
    /* /matrix(16유형 비교) 진입 링크 — 헤더 버튼과 동일 톤의 앵커. 배포 숨김 토글이
       없어 persona-badge와 동일하게 무조건 노출한다(가법). */
    header a.navlink {
      font-size: 12px; color: var(--muted); background: transparent;
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    header a.navlink:hover { color: var(--text); border-color: var(--accent); }
    /* 모델 선택기 — navlink와 같은 톤의 얇은 드롭다운. 기본은 pro, localStorage 지속. */
    .model-select {
      font-size: 12px; color: var(--muted); background: transparent;
      border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px;
      cursor: pointer; max-width: 150px;
    }
    .model-select:hover { color: var(--text); border-color: var(--accent); }
    /* 도구 토글 — 모델 선택기와 같은 톤. 목록·잠금은 /toolsets(레지스트리)가 단일 진실이라
       프론트에 toolset 키를 박지 않는다. <details>라 열고 닫는 JS·백드롭이 필요 없다. */
    .tools-menu { position: relative; }
    .tools-menu > summary {
      font-size: 12px; color: var(--muted); background: transparent;
      border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
      cursor: pointer; list-style: none; user-select: none;
    }
    .tools-menu > summary::-webkit-details-marker { display: none; }
    .tools-menu > summary:hover,
    .tools-menu[open] > summary { color: var(--text); border-color: var(--accent); }
    .tools-pop {
      position: absolute; z-index: 50; top: calc(100% + 6px); right: 0; min-width: 170px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px; display: flex; flex-direction: column; gap: 2px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }
    .tools-pop label {
      display: flex; align-items: center; gap: 7px; font-size: 12.5px;
      color: var(--text); padding: 4px 6px; border-radius: 7px; cursor: pointer;
    }
    .tools-pop label:hover { background: var(--accent-soft); }
    .tools-pop input:disabled { cursor: default; }
    .tools-pop input:disabled + span { color: var(--muted); }

    #conversation {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .intro { margin: 0 0 var(--landing-gap); text-align: center; color: var(--muted); }
    .intro .big {
      font-size: clamp(20px, 5vw, 26px); color: var(--text); font-weight: 600;
      margin-bottom: 4px; line-height: 1.35;
    }
    .intro p { font-size: 13px; margin: 4px 0 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip {
      background: var(--chip-bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer;
      transition: border-color 0.12s ease, transform 0.12s ease;
    }
    .chip:hover { border-color: var(--accent); transform: translateY(-1px); }

    /* 새 메시지 등장 — 은은한 페이드업(자연스러운 나타남, 절제). */
    .msg { display: flex; flex-direction: column; gap: 6px; animation: msgIn 0.28s ease both; }
    .msg.user { align-items: flex-end; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .bubble {
      max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 14.5px;
      line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
    .msg.assistant .bubble { background: var(--assistant-bg); color: var(--text); border-bottom-left-radius: 4px; }
    .bubble.empty { color: var(--muted); }
    /* 점 3개 스켈레톤 — 오버뷰 패널 전용(채팅의 첫 반응은 사고과정 헤더의 경과 초가 맡는다). */
    .typing { display: inline-flex; gap: 4px; align-items: center; height: 1.25em; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: typing 1.2s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
    @keyframes fadein { from { opacity: 0.35; } to { opacity: 1; } }

    /* 진행 흐름 = 턴당 하나의 카드. 맨 앞의 사고과정 접힘(내레이션·도구 스텝) 뒤로 최종 답이
       도착 순서 그대로 쌓인다. 어시스턴트 말풍선 배경은 개별 블록이 아니라 카드가 담당한다. */
    .flow { display: flex; flex-direction: column; gap: 6px; }
    .msg.assistant .flow:not(:empty) {
      background: var(--assistant-bg); border-radius: 14px;
      border-bottom-left-radius: 4px; padding: 12px 16px;
    }
    /* 카드 안의 본문 블록은 투명 섹션 — 이중 박스 금지. 빈 응답 안내만 자기 여백 유지. */
    .msg.assistant .flow .bubble { background: transparent; padding: 2px 0; max-width: 100%; }
    .msg.assistant .flow .bubble.empty { padding: 8px 12px; }
    .md-hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* ── 사고과정 컴포넌트(피그마 2차) ──
       턴 시작 시 열린 <details>가 flow 맨 앞에 서고, 스텝·사고 한 줄은 그 안에 쌓인다. 본문
       블록은 최종 답일 수 있어 판정 전엔 흐름에 일반 스타일로 흐르고, 뒤에 과정이 이어지면
       내레이션으로 확정돼 접힘 안으로 흡수된다(미확정 본문이 내레이션 스타일로 튀지 않는다).
       최종 답이 시작되면 닫히고 헤더가 "{N}초 · 출처 {M}개 검토"로 바뀐다. 생성 중(.live)엔 화살표가 없고
       펼친 채 고정된다(접을 선택이 없다). 오류(.err)는 헤더 자체가 없다 — 과정을 펼친 채 두고
       "오류로 중단됨"은 흐름 끝 .meta가 맡는다(피그마 12-A). */
    .process-fold > summary {
      cursor: pointer; list-style: none; font-size: 12.5px; color: var(--muted); padding: 2px 0;
      display: flex; align-items: center; gap: 4px; user-select: none;
    }
    .process-fold > summary::-webkit-details-marker { display: none; }
    .process-fold > summary:hover { color: var(--text); }
    .process-fold .chev {
      flex: 0 0 auto; width: var(--proc-icon); height: var(--proc-icon); transition: transform 0.15s ease;
    }
    .process-fold[open] .chev { transform: rotate(90deg); }
    .process-fold.live > summary { pointer-events: none; }
    .process-fold.live .chev { display: none; }
    .process-fold.err > summary { display: none; }
    .process-fold.live > summary { animation: pulse 1.6s ease-in-out infinite; }
    .process-fold > :not(summary) { margin-top: 4px; }
    /* 내레이션 블록 = 파란 점 불릿 + 본문(마크다운 렌더는 그대로, 블록 하나에 점 하나).
       생성 중(.live)엔 활자를 낮추지 않는다 — 흐름에 흐르던 본문이 접힘에 흡수되는 순간
       쪼그라들어 보이기 때문이다. 낮추기는 .live가 걷히는 시점(최종 답 시작 = 접히는 순간)에
       하므로 축소가 화면에 보이지 않고, 나중에 펼쳐 보면 과정임이 활자로 드러난다. */
    .msg.assistant .process-fold .bubble {
      position: relative; padding: 0 0 0 calc(var(--proc-dot) + var(--proc-gap));
    }
    .msg.assistant .process-fold:not(.live) .bubble { color: var(--muted); font-size: 13px; }
    .msg.assistant .process-fold .bubble::before {
      content: ""; position: absolute; left: 0; top: calc(0.8em - var(--proc-dot) / 2);
      width: var(--proc-dot); height: var(--proc-dot); border-radius: 50%; background: var(--accent);
    }
    /* 툴 호출·결과 스텝 — 내레이션 텍스트 시작선에 맞춰 들여쓰고 선형 아이콘 + 문구.
       긴 멀티쿼리 검색어는 가로 스크롤이 아니라 줄바꿈으로 흡수한다(스크롤 계약). */
    .step {
      font-size: 12.5px; color: var(--muted); display: flex; align-items: flex-start; gap: var(--proc-gap);
      line-height: 1.5; animation: fadein 0.3s ease; padding-left: calc(var(--proc-dot) + var(--proc-gap));
    }
    .step .ico { flex: 0 0 auto; width: var(--proc-icon); height: var(--proc-icon); margin-top: 0.2em; }
    .step .step-label { min-width: 0; overflow-wrap: anywhere; }
    .step.active .ico { animation: pulse 1.2s ease-in-out infinite; }
    /* persona 스텝(피그마 10) — RBTI 축 칩과 코드 없음 보조 한 줄. */
    .step .axis {
      display: inline-block; margin-left: var(--proc-gap); padding: 0 7px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600;
    }
    .step .axis + .axis { margin-left: 4px; }
    /* found 스텝의 찾은 출처 제목 칩 — 줄바꿈으로 감싸고 긴 제목은 한 줄 말줄임(가로 스크롤 금지). */
    .step .step-srcs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
    .step .step-src {
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 0 7px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--accent-soft); color: var(--muted); font-size: 11px; text-decoration: none;
    }
    .step a.step-src:hover { color: var(--accent); }
    .step .sub { font-size: 12px; }
    /* 오류 인라인 박스(피그마 12) — 원형 ! 아이콘 + 문구. 본문 0글자 턴엔 오른쪽 "다시 시도". */
    .err-box {
      display: flex; align-items: flex-start; gap: var(--proc-gap);
      background: var(--error-bg); border: 1px solid var(--error-border); border-radius: 8px;
      padding: 10px 12px; font-size: 13.5px; line-height: 1.5; color: var(--error-text);
    }
    .err-box .ico { flex: 0 0 auto; width: var(--err-icon); height: var(--err-icon); margin-top: 0.15em; }
    .err-box .err-text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .err-box .err-retry {
      flex: 0 0 auto; background: transparent; border: none; padding: 0; font: inherit;
      font-size: 12.5px; color: var(--muted); cursor: pointer;
    }
    .err-box .err-retry:hover { color: var(--accent); }
    /* 턴 마감 메타 — 과정이 없는 즉답 턴의 "응답 N초" 한 줄(과정이 있으면 헤더가 시간을 담당),
       과정이 있는 오류 턴의 "오류로 중단됨". */
    .meta { font-size: 12px; color: var(--muted); padding: 0 6px; }
    .meta:empty { display: none; }
    /* 줄바꿈 배치 — 가로 스크롤이면 칩 5개+에서 뒤 카드가 화면 밖으로 잘려 존재 자체가
       안 보인다(도그푸딩 2026-07-28 실측: 7·6개 턴에서 마지막 칩 유실 체감). */
    .sources { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 4px; }
    .sources:empty { display: none; }
    /* meta 이벤트의 추천 이유 — 해당 출처 카드 **안**에 몇 줄로 얹는다(상시 노출 —
       2026-08-21 사용자 확정). .info의 한 줄 말줄임을 풀고 3줄 클램프, 전체 문장은 툴팁. */
    .card.rec { max-width: 250px; }
    .card .info.reason {
      color: var(--muted); white-space: normal; display: -webkit-box;
      -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    /* 인용 마커 [n] 호버 프리뷰(퍼플렉시티식, 2026-08-21 사용자 요청) — 마커가 가리키는
       출처의 요지(제목·저자·가격·추천 이유)를 작은 팝오버로 띄운다. 데이터는 같은 메시지의
       카드 DOM에서 읽으므로 별도 상태가 없다(단일 진실 = 렌더된 카드). */
    .marker-pop {
      position: fixed; z-index: 60; max-width: 300px;
      background: var(--card-bg); border: 1px solid var(--accent); border-radius: 8px;
      padding: 9px 12px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      font-size: 12px; line-height: 1.5; pointer-events: none;
    }
    .marker-pop b { display: block; font-size: 12.5px; margin-bottom: 2px; }
    .marker-pop .pop-sub { color: var(--muted); }
    .marker-pop .pop-reason { color: var(--muted); margin-top: 4px; }
    .card {
      flex: 0 0 auto; max-width: 210px; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: row; gap: 8px;
    }
    /* 본문 열(제목·저자·가격). 표지가 있으면 그 오른쪽, 없으면 카드 전체를 채운다. */
    .card .card-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 auto; }
    /* 좌측 표지 썸네일(검색결과 image_url). 실패 시 JS가 제거해 본문만 남는다. */
    .card .cover {
      flex: 0 0 auto; width: 38px; height: 54px; object-fit: cover; border-radius: 4px;
      background: var(--border);
    }
    .card:hover { border-color: var(--accent); }
    /* 최종 인용 출처 카드를 강조한다. */
    .card.cited { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .card.web.cited { border-color: var(--web); box-shadow: 0 0 0 1px var(--web); }
    .card.flash { animation: flash 1s ease; }
    @keyframes flash {
      0% { background: var(--accent-soft); border-color: var(--accent); }
      100% { background: var(--card-bg); }
    }

    #ov-body .md-list { margin: 6px 0; padding-left: 1.5em; }
    #ov-body .md-list li { margin: 2px 0; }
    #ov-body .md-table-wrap, #ov-body pre.md-pre { overflow-x: auto; }
    #ov-foot { font-size: 11.5px; color: var(--muted); }
    #ov-foot:empty { display: none; }
    /* 이어가기 버튼 — 뮤트 톤의 보조 버튼(기존 토큰만, 신규 색·변수 없음). */
    #ov-continue {
      align-self: flex-start; font-size: 12px; color: var(--muted); background: transparent;
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px;
      cursor: pointer; font-family: inherit;
    }
    #ov-continue:hover { color: var(--text); border-color: var(--accent); }
    /* 데모 전용 빈 상태(패널 밖) — 뮤트 톤 유지, 맨 텍스트 한 줄 대신 가벼운 컨테이너로
       (D3, 도그푸딩 07·14 — 기존 토큰만: 점선 테두리 + 여백 + 중앙 정렬, 과장 금지). */
    #ov-empty {
      font-size: 13px; color: var(--muted); text-align: center;
      border: 1px dashed var(--border); border-radius: 12px;
      padding: 22px 16px; background: var(--panel);
    }
    #ov-empty .ov-empty-ico { display: block; font-size: 20px; margin-bottom: 6px; }
    /* 검색결과 목록 흉내 — 실전 임베드의 li[data-goods-no] 스크롤·하이라이트 계약 재현용. */
    /* ── 접지원 비교 하네스(테스트 전용 — config.overview_compare_enabled) ──
       같은 질의를 웹 / Yes24 / 둘 다 세 접지원으로 **병렬** 생성해 나란히 세운다. 기본은 위의
       단일 패널이고(프로덕션 UX 불변) 이 영역은 토글이 켜졌을 때만 뜬다. 넓은 폭은 3단, 좁은
       폭은 세로 스택. 세로 스크롤러는 여전히 #overview-view 하나다 — 패널마다 스크롤러를 두면
       이중 스크롤바가 되므로 패널은 내용만큼 자라고 페이지가 아니라 뷰가 스크롤한다. */
    #ov-cmp-toggle {
      display: flex; align-items: center; gap: 5px; white-space: nowrap;
      font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    }
    #ov-cmp-toggle[hidden] { display: none; }
    /* 토글이 붙은 폼만 줄바꿈을 허용한다 — 좁은 폭에서 입력+버튼+토글이 한 줄에 안 들어가
       #ov-form이 뷰 폭을 넘겨(390px 뷰포트에서 414px 실측) #overview-view에 의도치 않은
       가로 스크롤을 만들었다. :has로 조건을 걸어 하네스가 꺼진 화면의 폼 규칙은 무수정이다. */
    #ov-form:has(#ov-cmp-toggle:not([hidden])) { flex-wrap: wrap; }
    #ov-compare { display: grid; gap: 12px; grid-template-columns: 1fr; align-items: start; }
    #ov-compare[hidden] { display: none; }
    @media (min-width: 900px) { #ov-compare { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .ov-cmp-arm {
      min-width: 0; min-height: var(--ov-panel-min-h);
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
    }
    /* 접힌 팔(degraded·실패)도 자리를 지운다 — 3열 비교에서 자리가 사라지면 나머지 둘이
       재배치돼 눈으로 견주기가 깨진다(단일 패널의 G1 조용한 접힘과는 목적이 다르다). */
    .ov-cmp-arm.ov-cmp-off { border-style: dashed; }
    .ov-cmp-head {
      display: flex; align-items: baseline; gap: 6px;
      font-size: 12.5px; font-weight: 700; color: var(--accent);
    }
    .ov-cmp-time {
      margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .ov-cmp-body { font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .ov-cmp-body .md-list { margin: 6px 0; padding-left: 1.4em; }
    .ov-cmp-body .md-list li { margin: 2px 0; }
    .ov-cmp-body .md-table-wrap, .ov-cmp-body pre.md-pre { overflow-x: auto; }
    .ov-cmp-meta { font-size: 11.5px; color: var(--muted); }
    .ov-cmp-meta:empty { display: none; }
    /* 출처는 좁은 열이라 한 줄에 한 장 — .sources의 flex-wrap을 여기서만 grid로 덮는다. */
    .ov-cmp-src { display: grid; grid-template-columns: 1fr; gap: 6px; overflow: visible; }
    .ov-cmp-src .card { max-width: none; min-width: 0; }
    /* 비교 모드에서만 3열이 설 폭을 준다 — 단일 패널은 채팅과 같은 폭(.app 760px)이다. */
    .app.overview-mode.ov-compare-mode { max-width: 1560px; }
    #ov-results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    #ov-results li {
      display: flex; gap: 10px; align-items: flex-start; background: var(--panel);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    }
    #ov-results .cover {
      flex: 0 0 auto; width: 44px; height: 62px; object-fit: cover; border-radius: 4px;
      background: var(--border);
    }
    /* 인용 번호 배지 — 출처 카드 열을 지운 뒤 [n]↔상품 연결을 명시하는 유일한 표식.
       .card .num과 같은 시각 토큰이지만 채팅 규칙은 무수정이라 오버뷰 스코프에 따로 둔다. */
    #ov-results .ov-r-num {
      flex: 0 0 auto; margin-top: 1px;
      font-size: 11px; font-weight: 700; color: #fff; background: var(--accent);
      border-radius: 5px; min-width: 18px; height: 18px; display: inline-flex;
      align-items: center; justify-content: center; padding: 0 4px;
    }
    #ov-results li.web .ov-r-num { background: var(--web); }
    #ov-results li[role="button"] { cursor: pointer; }
    #ov-results li[role="button"]:hover { border-color: var(--accent); }
    #ov-results .ov-r-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    #ov-results .ov-r-title { font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.4; }
    #ov-results .ov-r-sub { font-size: 12px; color: var(--muted); }
    #ov-results .ov-r-price { font-size: 12.5px; color: var(--accent); font-weight: 600; }
    /* 인용 칩 클릭 → 결과 행 accent 링 하이라이트 — 기존 .card.flash와 같은 1회 애니메이션
       패턴(클래스 재부여 + 리플로우 재시작). prefers-reduced-motion 전역 무력화가 자동 커버. */
    #ov-results li.ov-hit { animation: ovHit 2s ease; }
    @keyframes ovHit {
      0% { box-shadow: 0 0 0 2px var(--accent); background: var(--accent-soft); }
      100% { box-shadow: none; background: var(--panel); }
    }
    /* D2(도그푸딩 12): 좁은 뷰포트에서 헤더 필 버튼이 짜부라져 글자가 세로로 낙하하고
       타이틀이 다줄 붕괴 — 내비를 한 줄 가로 스크롤로 전환(가장 비침습: 채팅 헤더 공용이라
       기존 규칙 무수정, 이 미디어쿼리 **추가**만). */
    @media (max-width: 520px) {
      header { overflow-x: auto; }
      header > * { flex-shrink: 0; }
      header .spacer { flex-shrink: 1; }
      header h1, header a.navlink { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <!-- 아이콘 스프라이트(인라인 SVG, 외부 리소스 없음) — 스텝·접힘 헤더·오류 박스가

  <div class="app landing" id="app">

      <!-- AI 오버뷰 데모 진입(추가 블록) — POST /overview 라우트가 살아 있을 때만(HEAD ≠ 404) 노출. -->
      <a id="ov-navlink" class="navlink" href="#" role="button" title="검색결과 AI 오버뷰 데모" hidden>✨ AI 오버뷰</a>

         패널 비표시로 수렴한다(G1 조용한 접힘 — 에러 배너·"미제공" 문구 금지). -->

      </form>
      <div id="ov-panel" hidden>

           으로 만든다. 팔 이름·순서를 여기에 적지 않는 이유는 그 목록의 소유자가 서버이기
           때문이다(같은 목록의 이중 소유 금지). -->
      <div id="ov-compare" hidden></div>
      <!-- 검색결과 목록 흉내: 실전 임베드의 li[data-goods-no] 하이라이트 계약(selectors.py 정본) 재현.
           오버뷰의 출처는 이 목록 그 자체다 — 별도 출처 카드 열을 두지 않고(중복) 행의 번호 배지가
           인용 [n]과의 연결을 명시한다. done.overview.sources는 인용된 출처만 담는다(공개 집합 한정). -->
      <div class="ov-res-head" id="ov-res-head" hidden><span>인용된 검색결과</span><span id="ov-res-count"></span></div>
      <ul id="ov-results"></ul>
    </section>
  </div>

  <script type="module">
    // 공용 모듈(단일 사본) — 마크다운·인용 렌더, SSE, RBTI 축 정의, 출처 유틸.
    // ?v=1은 **일회성** 캐시 탈출구다: no-cache 헤더가 붙기 전 구버전을 heuristic-freshness로

    // 이후 모듈이 바뀌어도 이 숫자를 올릴 필요 없다 — 서버 no-cache가 매번 재검증하니까(자라지 않음).
    import { renderBody as renderMarkdown, canSplitAfter, redistributeCanonical } from "/static/lib/md.js?v=1";
    import { readEventStream } from "/static/lib/sse.js?v=1";
    import {
      AXES as RBTI_AXES, parseCode as parseRbtiCode, deriveCode, deriveAxisLabel,
      RBTI_STORAGE_KEY, MATRIX_HANDOFF_KEY,
    } from "/static/lib/rbti.js?v=1";
    import { WEB_TYPES, coverUrl, isSafeUrl, safeOpen, formatPrice, makeCoverImg, relayTypingFocus, overviewIsRenderable } from "/static/lib/sources.js?v=1";

    // 16유형 비교(/matrix) 네비 링크는 서버 배포 게이팅(matrix_enabled)을 따라간다.

    (function revealMatrixLinkIfEnabled() {

        .then((res) => { if (res.ok) link.hidden = false; })

    // 랜딩(빈 대화) 인사·예시 칩 — 서버가 마커를 persona 문안(JSON)으로 치환해 주입한다.
    // 파일을 직접 열면(마커 미치환) null — 사용처는 전부 null 가드라 JS 무에러(폴백 사본 금지).
    const BRANDING = /*__BRANDING__*/null;
    // 로그인 역할 배지 — GET /me {"role":"admin"|"demo"|null}. null·조회 실패면 비표시.
    // 서버 API가 단일 계약(외부 프론트 동일 경로)이고, 실제 세팅 강제는 서버 몫이라 표시용이다.
    (async () => {
      const accessBadge = document.getElementById("access-badge");
      try {
        const { role } = await (await fetch("/me")).json();
        if (!role) return;
        accessBadge.textContent = (role === "admin" ? "세팅" : "데모") + " · 로그아웃";
        accessBadge.hidden = false;
      } catch (e) { /* 조회 실패 시 배지 숨김 유지 */ }
    })();
    // 스텝 아이콘 = 문서 상단 인라인 SVG 스프라이트의 심볼 id. 라벨은 모델 인자(검색어·제목)뿐이라
    // "무엇을 했는지"의 동사 의미는 아이콘이 담당한다(완료 시 ✓로 바꾸지 않는 이유).
    const STATUS_ICON = {

    const STEP_SOURCE_PREVIEW = 5;

    function makeIcon(name, cls) {

    const app = document.getElementById("app");

    // ── 모델 선택기: /models 화이트리스트로 채우고 선택을 localStorage에 지속 ──
    // selectedModel이 빈 문자열이면 payload에서 생략(서버 기본 pro). 목록·기본은 서버가
    // 단일 진실(config.selectable_models)이라 프론트에 모델ID를 박지 않는다.
    const modelSelect = document.getElementById("model-select");
    const MODEL_STORAGE_KEY = "yes24_chat_model";
    let selectedModel = "";
    (async () => {
      try {
        const r = await fetch("/models");

        const saved = localStorage.getItem(MODEL_STORAGE_KEY);
        const ids = Object.values(models);
        selectedModel = ids.includes(saved) && saved !== def ? saved : "";
        for (const [label, id] of Object.entries(models)) {
          const opt = document.createElement("option");
          opt.value = id === def ? "" : id;   // 기본은 빈 값(생략)으로

          modelSelect.appendChild(opt);

      } catch (e) { modelSelect.hidden = true; }  // /models 실패 시 선택기 숨김(기본 동작 유지)
    })();
    modelSelect.addEventListener("change", () => {
      selectedModel = modelSelect.value;
      try {
        if (selectedModel) localStorage.setItem(MODEL_STORAGE_KEY, selectedModel);
        else localStorage.removeItem(MODEL_STORAGE_KEY);

    // ── 도구 토글: /toolsets(레지스트리 파생)로 채우고 선택을 localStorage에 지속 ──
    // 서버 기본 구성과 같으면 payload에서 생략한다(요청 = 기본). 잠금 항목은 없다 —
    // 비어있지만 않으면 모든 조합이 유효하고, 정체성은 켜진 toolset에서 파생된다.
    const toolsMenu = document.getElementById("tools-menu");
    const toolsPop = document.getElementById("tools-pop");
    const TOOLS_STORAGE_KEY = "yes24_chat_toolsets";
    let enabledToolsets = null;   // null이면 서버 기본 구성
    const sameSet = (a, b) => a.length === b.length && a.every((k) => b.includes(k));
    (async () => {
      try {
        const r = await fetch("/toolsets");
        const { toolsets, active } = await r.json();
        const keys = toolsets.map((t) => t.key);
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(TOOLS_STORAGE_KEY)); } catch (e) {}
        const valid = Array.isArray(saved) && saved.length
          && saved.every((k) => keys.includes(k));
        const chosen = valid ? saved : active;
        let lastPicked = null;   // 전부 해제 시 되돌릴 마지막 체크 항목
        const sync = () => {
          const picked = [...toolsPop.querySelectorAll("input:checked")].map((b) => b.value);
          // 전부 해제는 무효 조합이라 마지막 하나는 되돌린다(서버도 400으로 거절한다).
          if (!picked.length) { lastPicked.checked = true; picked.push(lastPicked.value); }
          enabledToolsets = sameSet(picked, active) ? null : picked;
          try {
            if (enabledToolsets) localStorage.setItem(TOOLS_STORAGE_KEY, JSON.stringify(picked));
            else localStorage.removeItem(TOOLS_STORAGE_KEY);
          } catch (e) {}
        };
        for (const t of toolsets) {
          const label = document.createElement("label");
          const box = document.createElement("input");
          box.type = "checkbox";
          box.value = t.key;
          box.checked = chosen.includes(t.key);
          const span = document.createElement("span");
          span.textContent = t.key;
          span.title = t.tools.join(", ");
          label.append(box, span);
          box.addEventListener("change", () => { if (box.checked) lastPicked = box; sync(); });
          if (box.checked) lastPicked = box;
          toolsPop.appendChild(label);
        }
        sync();
      } catch (e) { toolsMenu.hidden = true; }  // /toolsets 실패 시 숨김(기본 구성 유지)
    })();

    // 채팅↔매트릭스 왕복(전체 페이지 네비게이션)에도 세션이 이어지도록 sessionId를
    // sessionStorage에 영속한다(페이지별 키 분리 — 매트릭스는 별도 키). 서버가 세션 히스토리를
    // DB에 갖고 있어 같은 sessionId로 이어 물으면 맥락이 유지된다. 과거 버블 복원은 스코프 밖.
    const CHAT_SESSION_KEY = "yes24_chat_session_id";
    let sessionId = null;
    try { sessionId = sessionStorage.getItem(CHAT_SESSION_KEY) || null; } catch (e) {}
    let controller = null;
    let sending = false;

    // ── 독서 성향(RBTI) 페르소나 ── 축 정의·코드 파싱은 공용 모듈(rbti.js)이 단일 출처.
    // (백엔드 계약 "축 순서 = 코드 자릿수"를 두 페이지가 각자 들고 있던 이원화를 제거)

    const personaBadge = document.getElementById("persona-badge");
    const personaLabel = document.getElementById("persona-label");
    const personaPop = document.getElementById("persona-pop");
    const personaBackdrop = document.getElementById("persona-backdrop");
    const ppAxes = document.getElementById("pp-axes");
    const ppCode = document.getElementById("pp-code");
    const ppCodeLabel = document.getElementById("pp-code-label");
    const personaActive = document.getElementById("persona-active");
    const paCode = document.getElementById("pa-code");
    const paLabel = document.getElementById("pa-label");
    const paClear = document.getElementById("pa-clear");
    const ppApply = document.getElementById("pp-apply");
    const ppClear = document.getElementById("pp-clear");

    let rbtiCode = null;              // 적용된 코드(요청 body에 실림) 또는 null
    let pendingSel = {};              // 팝오버 진행 중 축별 선택 { pattern:"C", ... }

    // 헤더 배지 + 컴포저 위 알림줄을 함께 갱신한다(적용 상태의 단일 갱신 지점).
    // 알림줄은 코드와 한글 축 라벨을 같이 보여 4글자가 뭘 뜻하는지 바로 읽히게 한다.
    function updateBadge() {
      if (rbtiCode) {
        personaLabel.textContent = rbtiCode;
        personaBadge.classList.add("active");
        paCode.textContent = rbtiCode;
        paLabel.textContent = deriveAxisLabel(rbtiCode) + " 성향으로 답해요";
        personaActive.hidden = false;
      } else {
        personaLabel.textContent = "독서 성향";
        personaBadge.classList.remove("active");
        personaActive.hidden = true;
      }
    }

    // 팝오버 내부(축 버튼·코드 프리뷰·적용 버튼 상태)를 pendingSel 기준으로 다시 그린다.
    function renderPopover() {
      ppAxes.textContent = "";
      RBTI_AXES.forEach((axis, i) => {
        const wrap = document.createElement("div");
        wrap.className = "pp-axis";
        const label = document.createElement("div");
        label.className = "pp-axis-label";
        label.textContent = (i + 1) + ". " + axis.label;
        const opts = document.createElement("div");
        opts.className = "pp-opts";
        for (const opt of axis.options) {
          const btn = document.createElement("button");
          btn.className = "pp-opt" + (pendingSel[axis.key] === opt.code ? " sel" : "");
          const ot = document.createElement("span");
          ot.className = "ot";
          // 버튼의 대표 단어는 정본 라벨(short = persona.py AXIS_VALUE_LABELS_KO와 같은 단어)을
          // 쓴다 — 에이전트는 "선택"이라 부르는데 UI만 "발췌·탐색"이라 어긋났던 지적 반영.
          ot.textContent = opt.code + " · " + opt.short;
          const od = document.createElement("span");
          od.className = "od";
          od.textContent = opt.title + " — " + opt.desc;
          btn.append(ot, od);
          btn.addEventListener("click", () => {
            pendingSel[axis.key] = opt.code;
            renderPopover();
          });
          opts.append(btn);
        }
        wrap.append(label, opts);
        ppAxes.appendChild(wrap);
      });
      const code = deriveCode(pendingSel);
      if (code) {
        ppCode.textContent = code.split("").join(" ");
        ppCode.classList.remove("partial");
        ppCodeLabel.textContent = deriveAxisLabel(code); // 예: 선택-공감-넓이-재미
      } else {
        // 선택된 축은 글자, 미선택 축은 · 로 표시.
        ppCode.textContent = RBTI_AXES.map((a) => pendingSel[a.key] || "·").join(" ");
        ppCode.classList.add("partial");
        ppCodeLabel.textContent = "";
      }
      ppApply.disabled = !code;
    }

    function openPopover() {
      pendingSel = parseRbtiCode(rbtiCode) || {};
      renderPopover();
      personaPop.hidden = false;
      personaBackdrop.hidden = false;
      personaBadge.setAttribute("aria-expanded", "true");

    function closePopover() {
      personaPop.hidden = true;
      personaBackdrop.hidden = true;
      personaBadge.setAttribute("aria-expanded", "false");

    function applyPersona() {
      const code = deriveCode(pendingSel);
      if (!code) return;
      rbtiCode = code;
      try { localStorage.setItem(RBTI_STORAGE_KEY, code); } catch (e) {}
      updateBadge();
      closePopover();
    }

    function clearPersona() {
      rbtiCode = null;
      pendingSel = {};
      try { localStorage.removeItem(RBTI_STORAGE_KEY); } catch (e) {}
      updateBadge();
      closePopover();
    }

    personaBadge.addEventListener("click", () => {
      if (personaPop.hidden) openPopover(); else closePopover();
    });
    personaBackdrop.addEventListener("click", closePopover);
    ppApply.addEventListener("click", applyPersona);
    ppClear.addEventListener("click", clearPersona);
    paClear.addEventListener("click", clearPersona); // 알림줄에서 바로 해제
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !personaPop.hidden) closePopover();
    });

    // 새로고침·새 대화에도 유지: localStorage에서 복원.
    try {
      const saved = localStorage.getItem(RBTI_STORAGE_KEY);
      if (parseRbtiCode(saved)) rbtiCode = saved;
    } catch (e) {}
    updateBadge();

    function renderChipsInto(target) {
      target.textContent = "";
      for (const ex of BRANDING?.examples ?? []) {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.textContent = ex;
