    // ── 랜딩 ↔ 대화 전환 ──
    // 랜딩 여부는 파생 상태다: "대화에 메시지가 있는가" 하나로만 판정하고 별도 플래그를 두지
    // 않는다. 덕분에 첫 전송이든, 세션 히스토리 복원이든, "새 대화"든 메시지를 넣고/비우고
    // syncLandingMode()만 부르면 레이아웃이 따라온다(경로별 분기 없음).
    function hasMessages() {
      return !!conversation.querySelector(".msg");
    }

    function ensureIntro() {
      if (document.getElementById("intro")) return;
      const intro = document.createElement("div");
      intro.className = "intro";
      intro.id = "intro";
      const big = document.createElement("div");
      big.className = "big";
      big.textContent = BRANDING?.greeting ?? "";
      const sub = document.createElement("p");
      sub.textContent = BRANDING?.subtitle ?? "";
      intro.append(big, sub);
      conversation.appendChild(intro);
    }

    function removeIntro() {
      const intro = document.getElementById("intro");
      if (intro) intro.remove();
    }

    // 전환 애니메이션의 기준점 — 레이아웃이 바뀌기 *전*의 컴포저 위치. 랜딩이 아니거나
    // 모션 민감 설정이면 null(= 애니메이션 없이 즉시 전환).
    function captureComposerTop() {
      if (!app.classList.contains("landing")) return null;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return null;
      return composer.getBoundingClientRect().top;
    }

    // fromTop이 있으면 클래스 교체로 생긴 위치 차만큼 컴포저를 역보정했다가 0으로 되돌려
    // 중앙 → 하단으로 미끄러지게 한다(FLIP). 레이아웃 애니메이션이라 transform만 쓴다.
    function syncLandingMode(fromTop) {
      const landing = !hasMessages();
      const changed = landing !== app.classList.contains("landing");
      app.classList.toggle("landing", landing);
      if (landing) ensureIntro(); else removeIntro();
      if (!changed) return;
      composer.style.transition = "none";
      if (fromTop == null) {
        // 애니메이션 없는 전환(복원·새 대화·시딩): 컴포저의 여백 전이도 함께 끈다 — 전이 중
        // 컴포저 높이가 변하면 #conversation 가시 높이가 뒤늦게 바뀌어 직후의 스크롤이 어긋난다.
        void composer.offsetWidth;
        composer.style.transition = "";
        return;
      }
      const delta = fromTop - composer.getBoundingClientRect().top;
      composer.style.transform = `translateY(${delta}px)`;
      void composer.offsetWidth; // 리플로우 강제 → 시작 상태 확정
      composer.style.transition = "";
      composer.style.transform = "";
    }

    // CSS 변수(px) 읽기 — 배치 상수의 단일 출처는 :root(두 곳에 숫자를 적어 두면 한쪽만 바뀐다).
    function cssPx(name) {
      return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0;
    }

    // 스크롤 UX(피그마 13): 전송 직후 방금 보낸 질문을 상단 고정선(padding + --turn-pin-offset)
    // 으로 **한 번** 올린다. 스트리밍 중 자동 추적은 없다 — 답변 .msg에 "가시 높이 − 질문 높이 −
    // 간격"만큼 min-height를 예약해 질문 아래를 비워 두면 본문이 길어져도 질문은 제자리이고,
    // 사용자가 직접 내려 읽는다. 직전 턴의 예약은 새 턴이 시작될 때 거둔다(실제 높이로 굳는다).
    function pinTurnTop(userEl, asstEl) {
      for (const m of conversation.querySelectorAll(".msg.assistant")) {
        if (m !== asstEl) m.style.minHeight = "";
      }
      const cs = getComputedStyle(conversation);
      const pinLine = parseFloat(cs.paddingTop) + cssPx("--turn-pin-offset");
      const reserve = conversation.clientHeight - pinLine - userEl.offsetHeight
        - parseFloat(cs.rowGap) - parseFloat(cs.paddingBottom);
      asstEl.style.minHeight = Math.max(0, reserve) + "px";
      // offsetTop은 레이아웃 좌표(등장 애니메이션의 transform·현재 스크롤과 무관).
      conversation.scrollTop = userEl.offsetTop - conversation.offsetTop - pinLine;
    }

    function addUserMessage(text) {
      const msg = document.createElement("div");
      msg.className = "msg user";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      msg.appendChild(bubble);
      conversation.appendChild(msg);
      return msg;
    }

    // 어시스턴트 메시지 컨테이너를 만들고, 조작용 핸들 객체를 반환한다.
    // 기동 시점 문서 제목(브랜딩) — meta의 세션 제목이 접두로 붙고, 새 대화에서 복원된다.
    const baseDocTitle = document.title;

    // userText = 이 턴의 질문(오류 박스 "다시 시도"가 그대로 재전송한다). 복원·시딩도 넘긴다.
    function createAssistantMessage(userText) {
      const msg = document.createElement("div");
      msg.className = "msg assistant";

      // 진행 흐름: 사고과정 접힘(맨 앞)과 본문 블록이 **도착 순서대로** 이 한 열에 쌓인다.
      const flow = document.createElement("div");
      flow.className = "flow";
      // aria-live는 .flow에 걸지 않는다. 이 컨테이너는 진행 단계와 **본문 블록**을 함께
      // 담으므로, 여기 걸면 토큰이 붙을 때마다 본문 전체가 반복 낭독된다(낭독 폭주).
      // 대신 진행 단계 행 각각에 건다 — 짧고 한 번만 바뀌는 텍스트라 안전하다.

      // 사고과정 접힘(피그마 01·11): 턴 시작부터 열린 <details>가 경과 초로 첫 반응을
      // 맡고, 스텝은 처음부터 이 안에 append된다(사고 요약은 헤더가 싣는다). 본문 블록만은
      // 최종 답일 수 있어 흐름에서 시작했다가 과정이 이어지면 procParent가 흡수한다 — 그때
      // 활자가 튀지 않도록 축소는 .live가 걷힐 때 한다. 최종 답이 시작되면 닫히고 헤더가 요약으로 바뀐다.
      const fold = document.createElement("details");
      fold.className = "process-fold live";
      fold.open = true;
      const head = document.createElement("summary");
      head.className = "process-head";
      const headText = document.createElement("span");
      head.append(headText, makeIcon("chevron", "chev"));
      fold.appendChild(head);
      flow.appendChild(fold);
      let inProcess = true;   // 과정 단계(스텝·사고 줄은 fold 안으로) — 최종 답 시작 시 false
      // 과정 요소가 하나라도 있는가(summary 외 자식). 없으면 헤더도 없다(피그마 04).
      const hasProcess = () => fold.isConnected && fold.children.length > 1;
      // 과정 요소(스텝·사고 줄)가 붙을 부모. 과정 단계면 접힘 안 — 그때 흐름에 흘러온 본문
      // 블록은 뒤에 과정이 이어졌으므로 내레이션으로 확정돼 접힘 안으로 흡수된다. 본문 블록을
      // 처음부터 접힘 안에 두면 최종 답의 첫 문단이 판정 전까지 내레이션 스타일(muted·점)로
      // 흐르다 튄다 — 판정 전 블록은 흐름에 일반 스타일로 둔다.
      const procParent = () => {
        if (!inProcess) return flow;
        for (const b of blocks) if (b.el.parentNode === flow) fold.appendChild(b.el);
        return fold;
      };

      const sources = document.createElement("div");
      sources.className = "sources";
      const meta = document.createElement("div");
      meta.className = "meta";

      // 출처 카드 줄과 메타는 흐름 **끝**에 온다(실제 도착 시점 = 검증 후와 일치).
      msg.append(flow, sources, meta);
      conversation.appendChild(msg);

      const cardMap = new Map();
      // 스트리밍 중 마커를 렌더하기 위한 최소 정보(id → url). status.refs로 도구 응답
      // 시점에 미리 온다. **카드가 아니다** — cardMap·sources DOM엔 절대 손대지 않는다.
      // 이 분리가 원칙 4(공개 source·done.sources는 최종 인용분만)를 지키는 구조다.
      const hintMap = new Map();
      // 본문 텍스트 블록들. 각 블록이 자기 rawText를 소유하고 독립 재렌더한다.
      // 턴의 rawText = 블록 텍스트의 연결이다(원칙 4b: delta 합계 == done.text).
      const blocks = [];
      let pendingSplit = false; // 마지막 델타 이후 진행 단계가 끼어들었는가
      let finalized = false;   // finalize 이후엔 정본을 그대로 그린다(꼬리 홀드 해제)
      // 이 턴이 본 출처의 원본 페이로드(id → src). 대화 스냅샷 저장·복원의 재료다.
      const srcById = new Map();
      let citedList = [];      // finalize에서 확정된 인용 id(스냅샷용)
      let metaSaved = null;    // meta 이벤트 페이로드(추천 이유·세션 제목 — 스냅샷용)
      let elapsedSaved = 0;    // 응답 소요(초) — 스냅샷 복원 시 요약에 재사용
      let modelSaved = "";      // 최종 public model — 스냅샷 복원 시 같은 메타를 표시
      let processSaved = null; // done.process 그대로 — 접힘 헤더의 M·복원 재료(스냅샷용)
      let errorText = "";      // 오류로 끝난 턴의 안내 문구(스냅샷용)
      let firstDelta = false;
      // reset 이후 재전송 중인 정본(대기 아니면 null). 백엔드 reset은 "정본이 곧 다시 온다"는
      // 뜻이라 그 자리에서 화면을 비울 이유가 없다 — 비우면 접힘 안으로 옮겨진 내레이션
      // 블록까지 사라진다(resetBody 주석).
      let restating = null;
      let errored = false;
      let activeStep = null;   // 현재 진행 중(스핀) 단계 요소
      let lastStepKey = null;  // 직전 단계 키(연속 중복 방지)

      // 진행 헤더는 "{N}초 · {최신 사고 요약}" — 서버가 준 모델 산출물만 싣는다.
      // 고정 문구를 두지 않는 이유는 status.detail과 같다(sse.py: "문장은 서버가 만들지 않는다") —
      // 사고 요약이 아직 없는 첫 몇 초는 경과 초만 뜬다(빈 서술보다 정직하다).
      let liveThought = "";   // 최신 사고 요약(없으면 빈 문자열)
      let headTick = null;    // 경과 초 갱신 타이머(마감·실패·중지에서 정지)
      const turnStart = performance.now();
      let processSecs = 0;    // 조사 구간(최종 답 스트리밍 시작 전까지) — 접힘 헤더의 N초

      function renderLiveHead() {
        const secs = Math.max(1, Math.round((performance.now() - turnStart) / 1000));
        headText.textContent = `${secs}초` + (liveThought ? ` · ${liveThought}` : "");
      }
      // 턴 시작부터 마감까지 매초 갱신. 헤더가 살아있음은 .live의 pulse가 이미 말하므로
      // "생각하고 있어요" 류의 서술을 서버 없이 지어내지 않는다.
      renderLiveHead();
      headTick = setInterval(renderLiveHead, 1000);

      function setThinkLive(text) {
        liveThought = text;
        if (headTick) renderLiveHead();  // 마감 뒤 늦게 온 사고는 요약 헤더를 덮지 않는다
      }

      // 진행 헤더 정지 — 이후 헤더는 settleFold의 요약(또는 실패·중지 문구)이 소유한다.
      function clearThinkLive() {
        if (headTick) { clearInterval(headTick); headTick = null; }
        liveThought = "";
      }

      // 최종 답 시작 = 과정 종료(2026-07-29 계약: "think들 나열되다가 final_text 스트리밍이
      // 시작될 때 병합, 최종 답은 처음부터 쭉"). 조사 시간을 여기서 끊는다(최종 답 작성 시간은
      // 포함하지 않는다 — 전체 소요를 찍으면 "생각만 29초"처럼 길어 보인다). 판정 전 블록은
      // 이미 흐름에 있고, 접힘 안으로 흡수된 블록이 마지막이면(뒤에 본문 없이 마감·중단) 그것을
      // 최종 답으로 꺼낸다. 과정이 비었으면 헤더째 사라진다(즉답 턴, 피그마 04).
      function leaveProcess(block) {
        if (!inProcess) return;
        inProcess = false;
        if (!processSecs) processSecs = (performance.now() - turnStart) / 1000;
        if (block && block.el.parentNode === fold) flow.appendChild(block.el);
      }
      // "최종 답" 판정은 구조 신호 — 내레이션은 계약상 한 문단이라, 현재 블록이 닫힌 문단 뒤에도
      // 이어지거나 내레이션 규모를 넘으면 최종 답이다(문구·키워드 없음). 오판(장문 내레이션)은
      // finalize가 마지막 블록을 같은 규칙으로 꺼내 보정한다.
      const NARRATION_MAX_CHARS = 200;  // 내레이션 한 문단의 시각 상한(표시 판정 전용)
      function maybeLeaveAtFinalText(block) {
        if (!inProcess) return;
        const t = block.text;
        const contentAt = t.length - t.replace(/^\n+/, "").length;
        const cut = t.indexOf("\n\n", contentAt);
        const closedParaThenMore = cut >= 0 && t.slice(cut + 2).trim().length > 0;
        if (closedParaThenMore || t.length > NARRATION_MAX_CHARS) {
          leaveProcess(block);
          settleFold(0);
        }
      }
      // 접힘 헤더를 마감 문구로(피그마 01·11) — 과정이 없으면 헤더 자체를 지우고 false.
      // label 생략 = 완료: "출처 M개 검토"(M = 서버의 done.process.sources_reviewed = 이번 턴
      // 관측 출처, 인용 카드보다 클 수 있다 — "검토"의 뜻; done 전 미리보기·중지 턴은 refs 힌트
      // 수), 출처 0이면 "탐색 k단계", 스텝도 없으면 "생각함".
      // 생성 중(.live)에서 처음 마감될 때만 접는다 — 사용자가 다시 펼친 것을 finalize가 도로
      // 닫지 않는다.
      function settleFold(elapsedSec, label) {
        clearThinkLive();  // 요약 헤더를 경과 초 틱이 덮어쓰지 않게 먼저 멈춘다
        if (!hasProcess()) { fold.remove(); return false; }
        if (fold.classList.contains("live")) {
          fold.classList.remove("live");
          fold.open = false;
        }
        const secs = Math.max(1, Math.round(processSecs || elapsedSec || 0));
        if (!label) {
          const reviewed = processSaved?.sources_reviewed ?? hintMap.size;
          const steps = flow.querySelectorAll(".step:not(.persona)").length;
          label = reviewed ? `출처 ${reviewed}개 검토` : steps ? `탐색 ${steps}단계` : "생각함";
        }
        headText.textContent = `${secs}초 · ${label}`;
        return true;
      }
      // 오류 인라인 박스(피그마 12). 본문을 한 글자도 못 받은 턴엔 "다시 시도" — 직전 질문을
      // 그대로 다시 전송한다(새 말풍선이 붙는 정직한 재전송, 전송 중이면 무시).
      function appendErrorBox(message) {
        const box = document.createElement("div");
        box.className = "err-box";
        const text = document.createElement("span");
        text.className = "err-text";
        text.textContent = message;
        box.append(makeIcon("alert", "ico"), text);
        if (!bodyText() && userText) {
          const retry = document.createElement("button");
          retry.className = "err-retry";
          retry.type = "button";
          retry.textContent = "다시 시도";
          retry.addEventListener("click", () => { if (!sending) submit(userText); });
          box.appendChild(retry);
        }
        flow.appendChild(box);
      }

      // 직전 단계를 완료 처리 — pulse 정지(.done)뿐, 아이콘 의미는 STATUS_ICON 주석 참조.
      function completeActiveStep() {
        if (!activeStep) return;
        activeStep.classList.remove("active");
        activeStep.classList.add("done");
        activeStep = null;
      }

      function highlightSource(id) {
        const card = cardMap.get(String(id));
        if (!card) return;
        card.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
        card.classList.remove("flash");
        void card.offsetWidth; // 리플로우 강제 → 애니메이션 재시작
        card.classList.add("flash");
      }

      // 마커 승격 조건 = "이번 턴에 실재하는 출처 id". 검증 후 카드(cardMap)뿐 아니라
      // 도구 응답 시점의 힌트(hintMap)도 인정한다 — 이게 스트리밍 중 [1]이 생 대괄호로
      // 남아 있다가 done 이후에야 칩이 되던 어색함의 해소다. 검증에서 탈락한 마커는
      // 백엔드가 done.text에서 지우므로 링크째 사라진다(잘못된 링크가 남지 않는다).
      const markerOpts = {
        isCitation: (sid) => cardMap.has(String(sid)) || hintMap.has(String(sid)),
        onMarker: highlightSource,
        // 위험 스킴 차단은 공용 모듈(isSafeUrl)이 소유한다 — md.js는 검증된 url만 받는다.
        // 최종 카드가 있으면 그 url이 정본(힌트 url은 후속 라운드에 갱신될 수 있다).
        citationUrl: (sid) => {
          const key = String(sid);
          const src = srcById.get(key);
          const url = (src && src.url) || hintMap.get(key) || "";
          return isSafeUrl(url) ? url : "";
        },
      };

      // 이 턴의 본문 = 블록 텍스트의 연결. 스냅샷·중지·finalize 대조가 모두 이 한 값을
      // 쓴다(판정을 여러 벌 두면 한 벌만 고치는 실수가 반복된다 — 백엔드 _emit_final_body와
      // 같은 규율). 정상 턴에서 이 값은 delta 합계와 같고, 곧 done.text와 같다(원칙 4b).
      function bodyText() {
        return blocks.map((b) => b.text).join("");
      }

      // 스트리밍 중 마지막 줄이 내용 없는 리스트 마커("    *"·"3.")뿐이면 다음 델타가
      // 완성할 때까지 **화면에서만** 잡아둔다 — 청크 경계에서 생 마커가 순간 노출되던
      // 문제(도그푸딩 2026-07-28 실측). block.text는 그대로라 4b 대조(bodyText)에 영향이
      // 없고, finalize가 정본 전체를 다시 그리므로 유실 경로도 없다.
      const BARE_LIST_TAIL_RE = /(^|\n)[^\S\n]*(?:[-*•]|\d+[.)])[ \t]*$/;
      function withHeldTail(text) {
        const m = text.match(BARE_LIST_TAIL_RE);
        return m ? text.slice(0, m.index + m[1].length) : text;
      }

      // 연속 동일 번호 마커의 **표시** 병합(2026-08-21 사용자 방향 — ChatGPT식 밀도 완화
      // 실물 대조 후): 한 블록에서 연속 구간의 **마지막만** 남긴다(다음 마커가 같은 번호면
      // 숨김) — 구간 끝 인용이 "여기까지가 이 출처"로 읽히는 관례(GPT·논문식)와 일치하고,
      // 첫 개만 남기면 뒤 문장들이 무근거처럼 보인다(같은 날 사용자 교정). 다른 번호가
      // 사이에 오면 다시 표시. 정본 done.text·인용 검증은 불변 — 렌더 후처리라 재렌더에도
      // 일관된다(스트리밍 중엔 구간이 자라며 마커가 꼬리를 따라간다).
      function collapseRepeatMarkers(el) {
        const markers = [...el.querySelectorAll(".marker")];
        markers.forEach((m, i) => {
          m.classList.toggle(
            "marker-dup",
            i + 1 < markers.length && markers[i + 1].textContent === m.textContent
          );
        });
      }

      // 본문 렌더 = 공용 모듈(md.js). 블록 하나를 자기 텍스트로 다시 그린다.
      function renderBlock(block) {
        renderMarkdown(block.el, finalized ? block.text : withHeldTail(block.text), markerOpts);
        collapseRepeatMarkers(block.el);
      }
      function renderAll() {
        blocks.forEach(renderBlock);
      }

      // 새 본문 블록 — 흐름 끝. 뒤에 과정이 이어지면 procParent가 접힘 안으로 흡수한다
      // (layoutProcess만 라운드 내레이션 블록을 접힘 안에 직접 놓는다).
      function pushBlock(parent = flow) {
        const el = document.createElement("div");
        el.className = "bubble";
        parent.appendChild(el);
        const block = { el, text: "" };
        blocks.push(block);
        return block;
      }

      // 델타를 받을 블록을 고른다. 분할 신호는 **도구 스텝 도착**(pendingSplit)이다 —
      // 백엔드가 라운드 경계에 문단 구분자를 넣긴 하지만(runner _ROUND_SEPARATOR) 그 표기는
      // 모델이 스스로 쓴 문단 경계와 구별되지 않으므로, 라운드 경계는 이벤트 순서로만 안다.
      // 마크다운 구조가 열려 있으면 분할을 보류한다 — 표·코드펜스가 블록 경계에 걸리면
      // md.js의 라인 스캐너가 양쪽에서 깨진다(닫히지 않은 펜스는 앞 블록 <pre>가 뒤를 못
      // 삼키고 뒤 코드가 산문이 된다). 렌더러와 **같은 눈**으로 구조가 열려 있는지
      // 묻는다(md.js canSplitAfter — 판정을 여기에 복제하지 않는다).
      function blockForDelta() {
        const cur = blocks[blocks.length - 1];
        if (!cur) return pushBlock();
        // 도구 경계(pendingSplit)의 직전 텍스트는 그 라운드가 완결한 본문이라 문단 경계
        // 요구 없이 나눠도 안전하다 — 단 열린 표·코드펜스 안이면 나누지 않는다(canSplitAfter,
        // 열린 구조를 블록 경계로 끊으면 양쪽 렌더가 깨진다). 확정된 라운드는 꼬리 홀드
        // 없이 정본으로 한 번 다시 그린다(빈 라운드는 요소만 정리 — blocks엔 남아 4b 유지).
        const safe = !cur.text || canSplitAfter(cur.text);
        if (pendingSplit && safe) {
          if (!cur.text.trim()) cur.el.remove();
          else {
            renderMarkdown(cur.el, cur.text, markerOpts);
            collapseRepeatMarkers(cur.el);
          }
          return pushBlock();
        }
        return cur;
      }

      function makeCard(src) {
        const isWeb = WEB_TYPES.has(src.type);
        const card = document.createElement("div");
        card.className = isWeb ? "card web" : "card";

        // 좌측 표지 썸네일(있을 때만, 규약은 공용 모듈). 없으면 현행 그대로(표지 없음).
        const url = coverUrl(src);
        if (url) card.appendChild(makeCoverImg(url, "cover"));

        const main = document.createElement("div");
        main.className = "card-main";
        const top = document.createElement("div");
        top.className = "top";
        const num = document.createElement("span");
        num.className = "num";
        num.textContent = src.id;
        const type = document.createElement("span");
        type.className = "type";
        // 미지 타입(새 toolset)은 "검색결과"로 거짓 라벨을 붙이지 않고 타입명을 그대로 쓴다.
        type.textContent = TYPE_LABEL[src.type] || src.type || "출처";
        top.append(num, type);
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = src.title || "(제목 없음)";
        main.append(top, title);
        // 상품 카드(비웹)엔 저자·판매가를 노출한다(가격 키·표기는 공용 formatPrice가 소유). meta.*
        // 가지는 발화 불가라 삭제 — sse_source가 meta를 방출한 적이 없고 스냅샷에도 없다.
        if (!isWeb) {
          const author = src.author || src.snippet;
          const price = formatPrice(src);
          if (author) {
            const au = document.createElement("div");
            au.className = "info author";
            au.textContent = author;
            main.append(au);
          }
          if (price) {
            const pr = document.createElement("div");
            pr.className = "info price";
            pr.textContent = price;
            main.append(pr);
          }
        }
        card.appendChild(main);
        // 위험 스킴(javascript:) 차단은 공용 모듈(isSafeUrl/safeOpen)이 소유한다.
        if (isSafeUrl(src.url)) {
          const open = () => safeOpen(src.url);
          // 클릭 가능한 것은 키보드로도 갈 수 있어야 한다(matrix 셀과 동일 계약).
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.addEventListener("click", open);
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
          });
        }
        return card;
      }

      // 복원 스냅샷은 **형태로 거른다** — 이름 목록을 두면 새 toolset의 카드 필드가 목록에
      // 없다는 이유로 새로고침 후 조용히 사라진다(목록 유지가 곧 드리프트다). 서버 공개 DTO는
      // 이미 스칼라만 싣는 계약(project_public_source)이라 그 형태를 그대로 신뢰한다.
      function sourceSnapshot(src) {
        return Object.fromEntries(
          Object.entries(src).filter(
            ([, value]) => value === null || typeof value !== "object"
          )
        );
      }

      // 정본(done.text·reset 재전송분)으로 본문을 갈아끼운다. reset과 finalize가 **같은
      // 코드**를 쓴다.
      //
      // 블록을 새로 만들지 않고 **기존 블록에 정본 조각을 다시 배분**한다(md.js
      // redistributeCanonical — 접힘이 블록 위치에서 파생되는 표현이라, 통짜로 다시 그리면
      // 이미 접힌 조사 서술이 최종 답 머리로 되살아난다).
      function replaceBody(text) {
        pendingSplit = false;
        const { kept, segments } = redistributeCanonical(text, blocks.map((b) => b.text));
        // 본문 블록만 지운다 — 도구 스텝 줄은 blocks 밖(flow 직속)이라 조사 기록이
        // reset 턴에서도 살아남는다(인라인 타임라인의 부수 이득).
        blocks.slice(kept).forEach((b) => b.el.remove());
        blocks.length = kept;
        segments.forEach((seg, k) => {
          const block = k < kept ? blocks[k] : pushBlock();
          block.text = seg;
          renderBlock(block);
        });
        if (!blocks.length) firstDelta = false;
      }

      // 과정 배치의 정본 = done.process.round_starts(라운드 r 텍스트 = text[starts[r]:starts[r+1]],
      // 마지막 조각이 최종 답, r번 스텝은 그 라운드 텍스트 뒤). 라이브 휴리스틱(maybeLeaveAtFinalText)
      // 은 미리보기라, 접힘 안 블록 텍스트 합이 답 오프셋과 다르면 블록·스텝을 그 순서로 다시
      // 놓는다 — 스텝은 화면의 것(data-round)을 쓰고, 화면에 없으면(복원 경로) process.steps로
      // 같은 makeStep이 새로 만든다. 오프셋이 본문 끝이면(마지막 라운드 무텍스트) 접힘 뒤에
      // 본문을 숨기지 않는 현행 규칙(finalize의 leaveProcess)에 맡긴다.
      function layoutProcess(text, proc) {
        const starts = Array.isArray(proc.round_starts) && proc.round_starts.length
          ? proc.round_starts : [0, proc.answer_start || 0];
        const answerStart = starts[starts.length - 1];
        if (answerStart >= text.length) return;
        const liveSteps = [...flow.querySelectorAll(".step")];
        const saved = Array.isArray(proc.steps) ? proc.steps : [];
        const restoring = !liveSteps.length && saved.length > 0;
        const inFold = blocks
          .filter((b) => fold.contains(b.el))
          .reduce((n, b) => n + b.text.length, 0);
        if (!restoring && inFold === answerStart) return;
        inProcess = false;  // 분할이 확정됐다 — 조사 시간은 finalize가 이미 확정한 processSecs
        blocks.forEach((b) => b.el.remove());
        blocks.length = 0;
        liveSteps.forEach((s) => s.remove());
        const stepsOf = restoring
          ? (r) => saved.filter((s) => s.round === r).map((s) => makeStep(s.stage, s.detail, undefined, s.sources, r))
          : (r) => liveSteps.filter((s) => Number(s.dataset.round) === r);
        for (let r = 0; r < starts.length; r++) {
          const seg = text.slice(starts[r], starts[r + 1]);
          if (seg) {
            const block = pushBlock(r === starts.length - 1 ? flow : fold);
            block.text = seg;
            renderBlock(block);
          }
          for (const step of stepsOf(r)) fold.appendChild(step);
        }
      }

      // 스텝 한 줄 — 라이브(setStatus)와 복원(layoutProcess)이 같은 요소를 만든다.
      // persona는 도구 스텝이 아니다 — 헤더 "탐색 k단계"의 k(서버 steps와 같은 뜻)에서 뺀다.
      function makeStep(stage, detail, code, stepSources, round) {
        const persona = stage === "persona";
        const step = document.createElement("div");
        step.className = persona ? "step persona" : "step";
        if (Number.isInteger(round)) step.dataset.round = round;
        const label = document.createElement("span");
        label.className = "step-label";
        // 진행 단계만 조용히 낭독한다. 짧고 한 번 쓰이면 바뀌지 않아 안전하다
        // (본문 블록에 걸면 토큰마다 전체가 다시 읽힌다).
        label.setAttribute("aria-live", "polite");
        if (persona) fillPersonaLabel(label, detail || "", code);
        else label.textContent = detail;
        // found 스텝의 찾은 출처(url·title뿐) — 제목 칩 STEP_SOURCE_PREVIEW개 + "+N". 과정 표면이라
        // 카드·hintMap과 무관하다.
        if (stage === "found" && Array.isArray(stepSources) && stepSources.length) {
          const row = document.createElement("span");
          row.className = "step-srcs";
          for (const s of stepSources.slice(0, STEP_SOURCE_PREVIEW)) {
            if (!s) continue;
            const safe = isSafeUrl(s.url);
            const chip = document.createElement(safe ? "a" : "span");
            chip.className = "step-src";
            chip.textContent = s.title || s.url || "";
            chip.title = chip.textContent;
            if (safe) { chip.href = s.url; chip.target = "_blank"; chip.rel = "noopener"; }
            row.appendChild(chip);
          }
          const rest = stepSources.length - STEP_SOURCE_PREVIEW;
          if (rest > 0) {
            const more = document.createElement("span");
            more.className = "step-src";
            more.textContent = `+${rest}`;
            row.appendChild(more);
          }
          label.appendChild(row);
        }
        step.append(makeIcon(STATUS_ICON[stage] || "dot", "ico"), label);
        return step;
      }

      // persona 스텝(피그마 10) — 문장은 프론트 몫(서버는 코드·축 라벨만 준다). 코드가 있으면
      // 축 라벨을 `-`로 나눈 칩, 없으면 보조 한 줄.
      function fillPersonaLabel(label, axes, code) {
        if (code) {
          label.append("회원님의 독서 성향을 반영해 찾고 있어요");
          for (const axis of axes.split("-").filter(Boolean)) {
            const chip = document.createElement("span");
            chip.className = "axis";
            chip.textContent = axis;
            label.appendChild(chip);
          }
          return;
        }
        label.append("인기 도서를 기준으로 찾고 있어요");
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = "독서 이력이 쌓이면 추천이 더 정확해져요";
        label.appendChild(sub);
      }

      return {
        setStatus(stage, detail, refs, code, stepSources, round) {
          // 마커 렌더용 힌트를 먼저 흡수한다. 나중 관측이 정본이다(같은 id의 url이 후속
          // 라운드에 갱신될 수 있다). **카드는 만들지 않는다** — 검증 전 노출 금지선.
          if (Array.isArray(refs)) {
            for (const ref of refs) {
              if (ref && ref.id != null) hintMap.set(String(ref.id), ref.url || "");
            }
            // 이미 흘러간 [n]들을 즉시 칩·링크로 승격시킨다. 힌트 도착 후 델타가 더 오지
            // 않는 경우가 있어 재렌더를 델타에 미룰 수 없다(1회성이라 비용도 여기서 끝난다).
            if (blocks.length) renderAll();
          }
          // 문구가 없으면 보여 줄 단계가 없다(refs만 실은 프레임). 백엔드가 "설명할 진행이
          // 없으면 말하지 않는다"를 기본값으로 두는 것과 같은 규칙의 렌더 쪽 절반이다.
          // persona는 예외 — 코드 없음이 detail ""로 오지만 그 자체가 보여 줄 한 줄이다
          // (done.process.steps엔 persona가 없어 복원엔 없다).
          const persona = stage === "persona";
          if (!detail && !persona) return;
          // 연속 동일 표시는 중복 추가하지 않는다(같은 도구가 상태만 반복 전송하는 경우).
          // 스텝 출처가 실리면 그 url들도 키다 — 병렬 검색 두 각도가 같은 건수("10건 찾았어요")를
          // 돌려주면 문구는 같아도 내용이 다르므로 버리면 두 번째 각도의 출처가 화면에서 유실된다.
          const key = stage + "|" + detail + "|"
            + (Array.isArray(stepSources) ? stepSources.map((s) => s && s.url).join(",") : "");
          if (key === lastStepKey) return;
          lastStepKey = key;
          if (stage === "thinking") {
            // 사고는 흐름 끝의 살아있는 한 줄로만 — 최신 사고로 제자리 갱신되고,
            // 실텍스트(본문·스텝)가 오면 물러난다(Claude Code의 사고 표시와 같은 결).
            setThinkLive(detail);
            return;
          }
          // 도구 스텝은 과정(접힘 안)에 도착 순서대로 영구히 남는다 — 내레이션과 시간순으로
          // 교차하며 이동하지 않는다. 최종 답 이후의 라운드(다라운드 턴)는 흐름에 인라인.
          completeActiveStep();
          const step = makeStep(stage, detail, code, stepSources, round);
          step.classList.add("active");
          const parent = procParent();
          parent.appendChild(step);
          activeStep = step;
          // 도구 단계가 끼어들었다 = 직전 라운드의 본문은 완결됐다. 다음 delta는 새
          // 블록으로 연다(문단 분리 — done.text는 블록 연결과 무관해 4b 무영향).
          pendingSplit = true;
        },
        addSource(src) {
          srcById.set(String(src.id), src);
          if (cardMap.has(String(src.id))) return;
          const card = makeCard(src);
          cardMap.set(String(src.id), card);
          sources.appendChild(card);
        },
        appendDelta(chunk) {
          // reset 이후의 재전송분은 **정본 전량**이다. 새 블록을 열지 않고 기존 블록 구조에
          // 다시 배분한다(replaceBody). 여러 조각으로 와도 누적본으로 매번 다시 배분하면
          // 되므로 프레임 분할에 의존하지 않는다.
          if (restating !== null) {
            restating += chunk;
            replaceBody(restating);
            if (blocks.length) maybeLeaveAtFinalText(blocks[blocks.length - 1]);
            return;
          }
          if (!firstDelta) {
            firstDelta = true;
            // 답변 스트리밍 시작 → 진행 중 단계를 완료 처리한다. 접힘은 아직 닫지 않는다 —
            // 내레이션일 수 있고, 최종 답 판정(maybeLeaveAtFinalText)·마감(finalize)이 닫는다.
            completeActiveStep();
          }
          const block = blockForDelta();
          pendingSplit = false;
          block.text += chunk;
          maybeLeaveAtFinalText(block);  // 최종 답이 시작되면 그 블록만 접힘 밖으로
          renderBlock(block);
        },
        // 백엔드 reset: 인용 검증이 본문을 바꿨으니 정본을 다시 받는다. **여기서 화면을
        // 비우지 않는다** — 비우면 접힘 안의 내레이션 블록까지 DOM에서 사라지고 뒤이어 온
        // 정본이 통짜 블록으로 붙어 조사 서술이 최종 답 머리에 노출된다. 정본 대기 상태로만
        // 들어가고, 교체는 정본이 도착한 뒤 replaceBody가 기존 블록 위에서 한다.
        // 힌트(hintMap)는 **보존한다** — 비우면 재렌더된 본문의 마커가 다시 생 대괄호가 된다.
        resetBody() {
          restating = "";
        },
        finalize(payload, elapsedSec) {
          restating = null;  // 정본 대기는 done으로 끝난다(아래 교체가 최종 판정)
          // error로 끝난 턴이면(백엔드가 error 뒤 done을 함께 보냄) 빨간 안내 말풍선을
          // 그대로 두고 "응답 X초" meta를 붙이지 않는다.
          if (errored) return;
          finalized = true; // 이후 렌더는 정본 그대로(스트리밍 꼬리 홀드 해제)
          // done.text(검증본)로 본문을 교체한다. 이미 같은 텍스트면 다시 그리지 않는다 —
          // 무조건 재렌더는 DOM을 통째로 갈아 스크롤·애니메이션이 튀게 만든다(정상 턴은
          // delta 합계 == done.text라 이 가드가 대부분의 턴에서 재렌더를 없앤다).
          if (typeof payload.text === "string" && payload.text.length
              && payload.text !== bodyText()) {
            replaceBody(payload.text);
          } else if (blocks.length) {
            // 텍스트가 같아 교체를 생략해도, 마지막 스트리밍 렌더가 꼬리를 홀드한 채라면
            // 그 블록만 정본 그대로 다시 그린다(홀드가 화면에 영구 잔류하는 구멍 봉합).
            const last = blocks[blocks.length - 1];
            if (withHeldTail(last.text) !== last.text) renderBlock(last);
          }
          // done.process(항상 존재; 스냅샷 복원은 저장해 둔 그 dict를 그대로 넘긴다)로 과정 배치와
          // 헤더 M을 확정한다.
          const proc = payload.process;
          if (proc) {
            processSaved = proc;
            // 헤더 N초의 정본은 서버의 answer_at_ms(턴 시작→최종 답 첫 텍스트) — 라이브 휴리스틱이
            // 미리보기로 끊은 processSecs를 덮는다(없으면 휴리스틱 값, 그것도 없으면 전체 소요).
            if (Number.isFinite(proc.answer_at_ms)) processSecs = proc.answer_at_ms / 1000;
            layoutProcess(payload.text || "", proc);
          }
          // 출처칩은 최종 답에서 실제로 인용된 출처만 받는다.
          const citedIds = new Set(
            (Array.isArray(payload.cited_ids) ? payload.cited_ids : []).map(String)
          );
          // done.sources로 누락 카드를 보강한다.
          const finalSources = Array.isArray(payload.sources) ? payload.sources : [];
          let gainedId = false;
          for (const src of finalSources) {
            const key = String(src.id);
            if (!cardMap.has(key)) {
              const card = makeCard(src);
              cardMap.set(key, card);
              sources.appendChild(card);
            }
            // 힌트로 못 봤던 id라면 그 마커는 아직 평문이다 — 본문을 한 번 더 그린다.
            if (!hintMap.has(key)) gainedId = true;
            srcById.set(key, src);
            citedIds.add(key);
          }
          if (gainedId) renderAll();
          citedList = [...citedIds];   // 스냅샷 저장용(복원 시 강조 재현)
          elapsedSaved = elapsedSec;
          modelSaved = typeof payload.model === "string" ? payload.model : "";
          // 인용 카드를 강조한다.
          for (const [id, card] of cardMap) {
            card.classList.toggle("cited", citedIds.has(id));
          }
          completeActiveStep();
          clearThinkLive();
          // 마지막 블록이 아직 접힘 안이면(짧은 즉답·장문 내레이션 오판) 그것이 최종 답이다.
          leaveProcess(blocks[blocks.length - 1]);
          // 시간은 한 곳에만 — 과정이 있으면 접힘 헤더가 조사 시간·검토 출처를 담당하고,
          // 과정이 없는 즉답 턴만 meta에 "응답 N초"(피그마 04). 모델명은 툴팁으로만.
          const modelTip = modelSaved ? `모델 ${modelSaved}` : "";
          if (settleFold(elapsedSec)) head.title = modelTip;
          else { meta.textContent = `응답 ${elapsedSec.toFixed(1)}초`; meta.title = modelTip; }
        },
        // meta 이벤트(done 뒤 가법 채널): 추천 이유를 **해당 출처 카드 안에** 몇 줄로 얹고,
        // 세션 제목을 브라우저 탭 제목으로 표시한다(내장 UI엔 대화 목록이 없어 탭이 유일한
        // 노출면). 항목의 id는 done.sources와 같은 공개 번호 공간이라 cardMap이 바로 잡힌다.
        // 카드가 이미 화면에 있으므로 재호출(복원 경로)에도 안전하게 기존 이유를 교체한다.
        showMeta(data) {
          if (!data) return;
          metaSaved = data;
          if (data.session_title) {
            document.title = `${data.session_title} · ${baseDocTitle}`;
          }
          for (const r of Array.isArray(data.recommendations) ? data.recommendations : []) {
            const card = cardMap.get(String(r.id));
            const reason = (r.reason || "").trim();
            if (!card || !reason) continue;
            card.classList.add("rec");
            card.title = reason; // 3줄 클램프 밖 전체 문장은 tooltip으로
            const main = card.querySelector(".card-main") || card;
            let el = main.querySelector(".info.reason");
            if (!el) {
              el = document.createElement("div");
              el.className = "info reason";
              main.appendChild(el);
            }
            el.textContent = reason;
          }
        },
        // 오류(피그마 12-A): 생성 중이던 과정은 헤더 없이 펼친 채 고정(어디서 실패했는지 보이게)
        // 하고 "오류로 중단됨"은 박스 뒤 맨 아래 meta에 적는다. 과정이 없으면 박스만(12-B, 라벨
        // 없음). 최종 답이 흐르다 마감된 접힘은 건드리지 않는다 — 다시 펼치면 읽던 본문이 아래로
        // 밀린다. 박스는 흐름 끝, 본문 0글자면 "다시 시도" 동반.
        showError(message) {
          errored = true;
          errorText = message || "오류가 발생했어요.";
          completeActiveStep();
          clearThinkLive();  // 실패 턴이 계속 일하는 것처럼 보이지 않게
          if (!hasProcess()) fold.remove();
          else {
            if (fold.classList.replace("live", "err")) headText.textContent = "";
            meta.textContent = "오류로 중단됨";
          }
          appendErrorBox(errorText);
        },
        markStopped() {
          // 중지는 파괴가 아니다 — 이미 스트리밍된 본문은 사용자가 읽고 있던 답이라 지우지
          // 않는다. 헤더 "{N}초 · 중단됨"(과정이 있을 때), 한 글자도 못 받았으면 안내 박스.
          completeActiveStep();
          clearThinkLive();  // 중지 턴도 사고 줄을 정지한다
          leaveProcess(blocks[blocks.length - 1]);  // finalize와 같은 규칙 — 접힘 뒤에 본문을 숨기지 않는다
          const folded = settleFold((performance.now() - turnStart) / 1000, "중단됨");
          if (!bodyText()) {
            errored = true;
            errorText = "응답을 중지했어요.";
            appendErrorBox(errorText);
          } else if (!folded) meta.textContent = "중지됨";
        },
        markEmptyIfUntouched() {
          // 에러 박스는 그대로 둔다(안내 문구를 덮어쓰지 않는다).
          if (!bodyText() && !errored) {
            clearThinkLive();  // 무응답 마감도 사고 줄을 정지한다
            settleFold((performance.now() - turnStart) / 1000);
            const box = document.createElement("div");
            box.className = "bubble empty";
            box.textContent = "(응답이 없었어요)";
            flow.appendChild(box);
          }
        },
        // 이 턴을 스냅샷 한 조각으로 — 복원은 addSource + finalize를 그대로 다시 태운다
        // (라이브와 복원이 같은 렌더 경로). 본문도 오류도 없으면 저장할 게 없다(null).
        // process = done.process 그대로(라운드 오프셋·스텝·검토 출처 수·조사 시간) — 복원의
        // finalize가 같은 배치·같은 M·같은 N초를 그린다. done 없이 끝난 턴(중지)엔 없다.
        toSnapshot() {
          if (errored) return { role: "assistant", error: errorText };
          const text = bodyText();
          if (!text) return null;
          return {
            role: "assistant",
            text,
            sources: [...srcById.values()].map(sourceSnapshot),
            cited_ids: citedList,
            elapsed: elapsedSaved,
            model: modelSaved,
            ...(processSaved ? { process: processSaved } : {}),
            ...(metaSaved ? { meta: metaSaved } : {}),
          };
        },
        el: msg,
      };
    }

    // ── 대화 스냅샷(재방문 복원) ──
    // 불변식: **서버 세션이 살아 있으면 그 대화가 화면에도 있다.** 이전엔 새로고침·매트릭스
    // 왕복 시 session_id만 남고 대화 DOM은 비어, 화면은 새 대화인데 서버는 옛 맥락을 기억하는
    // 불일치가 났다(핸드오프 경로만 세션을 리셋한 건 한 경로짜리 사례 패치였다). 이제 두 축을
    // 함께 유지한다: 턴이 끝날 때마다 스냅샷을 저장하고, 부팅 시 세션이 있으면 복원한다.
    // 반대편도 닫는다 — 세션 없이 남은 기록은 이어질 대화가 없으므로 버린다.
    // 매트릭스(yes24_matrix_snapshot)와 같은 저장소·같은 방식.
    const CHAT_TRANSCRIPT_KEY = "yes24_chat_transcript";
    let transcript = [];

    function saveTranscript() {
      try {
        if (transcript.length) sessionStorage.setItem(CHAT_TRANSCRIPT_KEY, JSON.stringify(transcript));
        else sessionStorage.removeItem(CHAT_TRANSCRIPT_KEY);
      } catch (e) { /* 저장 실패(용량 등)는 복원만 포기 — 진행 중 대화엔 영향 없음 */ }
    }
    function clearTranscript() {
      transcript = [];
      try { sessionStorage.removeItem(CHAT_TRANSCRIPT_KEY); } catch (e) {}
    }
    function restoreTranscript() {
      let saved = null;
      try { saved = JSON.parse(sessionStorage.getItem(CHAT_TRANSCRIPT_KEY) || "null"); } catch (e) {}
      if (!Array.isArray(saved) || !saved.length) return;
      if (!sessionId) { clearTranscript(); return; } // 이어질 세션이 없는 기록은 폐기
      transcript = saved;
      let lastUserText = "";
      for (const turn of transcript) {
        if (turn.role === "user") {
          lastUserText = turn.text || "";
          addUserMessage(lastUserText);
          continue;
        }
        const asst = createAssistantMessage(lastUserText);
        if (turn.error) {
          asst.showError(turn.error);
        } else {
          (Array.isArray(turn.sources) ? turn.sources : []).forEach((s) => asst.addSource(s));
          // 저장해 둔 done.process를 그대로 넘겨 접힘(라운드 내레이션·스텝·헤더)을 재현한다.
          asst.finalize(
            {
              text: turn.text || "",
              cited_ids: turn.cited_ids || [],
              model: turn.model || "",
              process: turn.process,
            },
            turn.elapsed || 0
          );
          if (turn.meta) asst.showMeta(turn.meta); // 라이브와 같은 경로로 부가 줄 복원
        }
      }
    }

    // 전송 버튼 상태: 전송 중이거나 입력이 비면 비활성(보낼 게 없을 때 활성처럼 보이지 않게).
    function updateSendState() {
      sendBtn.disabled = sending || input.value.trim() === "";
    }

    function setSending(on) {
      sending = on;
      stopBtn.disabled = !on;
      input.disabled = on;
      updateSendState();
      if (!on) input.focus();
    }

    // 인용 마커 [n] 호버 프리뷰 — 마커가 가리키는 출처 요지를 마커 위 팝오버로 띄운다.
    // 같은 메시지의 카드 DOM에서 제목·저자·가격·이유를 읽는다(카드가 아직 없으면 — 스트리밍
    // 중 refs 단계 — 조용히 생략). 팝오버는 전역 1개, 화면 상단이 좁으면 마커 아래로 연다.
    const markerPop = document.createElement("div");
    markerPop.className = "marker-pop";
    markerPop.hidden = true;
    document.body.appendChild(markerPop);
    conversation.addEventListener("mouseover", (e) => {
      const m = e.target.closest(".marker");
      if (!m) return;
      const num = (m.textContent.match(/\d+/) || [])[0];
      const msg = m.closest(".msg");
      if (!num || !msg) return;
      const card = [...msg.querySelectorAll(".card")].find(
        (c) => c.querySelector(".num")?.textContent === num
      );
      if (!card) return;
      markerPop.textContent = "";
      const t = document.createElement("b");
      t.textContent = card.querySelector(".title")?.textContent || "";
      markerPop.appendChild(t);
      const subText = [
        card.querySelector(".info.author")?.textContent,
        card.querySelector(".info.price")?.textContent,
      ].filter(Boolean).join(" · ");
      if (subText) {
        const sub = document.createElement("div");
        sub.className = "pop-sub";
        sub.textContent = subText;
        markerPop.appendChild(sub);
      }
      const reason = card.querySelector(".info.reason")?.textContent;
      if (reason) {
        const rr = document.createElement("div");
        rr.className = "pop-reason";
        rr.textContent = "💡 " + reason;
        markerPop.appendChild(rr);
      }
      markerPop.hidden = false;
      const mr = m.getBoundingClientRect();
      const pr = markerPop.getBoundingClientRect();
      const x = Math.max(8, Math.min(mr.left, window.innerWidth - pr.width - 12));
      const y = mr.top - pr.height - 8;
      markerPop.style.left = x + "px";
      markerPop.style.top = (y < 8 ? mr.bottom + 8 : y) + "px";
    });
    conversation.addEventListener("mouseout", (e) => {
      if (e.target.closest(".marker")) markerPop.hidden = true;
    });
    // 스크롤·새 대화 전환 시 남은 팝오버 정리(fixed라 스크롤을 따라가지 않는다).
    document.addEventListener("scroll", () => { markerPop.hidden = true; }, true);

    async function submit(text) {
      const message = (text !== undefined ? text : input.value).trim();
      if (!message || sending) return;

      // 첫 메시지가 붙는 순간 랜딩 조건(메시지 0)이 깨진다 — 컴포저는 중앙에서 하단으로.
      const composerTop = captureComposerTop();
      const userEl = addUserMessage(message);
      transcript.push({ role: "user", text: message });
      syncLandingMode(composerTop);
      input.value = "";
      input.style.height = "auto";

      // 제출 직후의 즉시 반응은 사고과정 헤더(경과 초)가 담당한다.
      const asst = createAssistantMessage(message);
      pinTurnTop(userEl, asst.el); // 질문을 상단 고정선으로 — 이 턴의 유일한 프로그램 스크롤
      setSending(true);

      controller = new AbortController();
      const started = performance.now();

      try {
        // 페르소나 미선택(rbtiCode=null) 시 rbti 필드를 아예 싣지 않아 기존 UX 100% 무변.
        const payload = { message, session_id: sessionId };
        // 코드와 함께 use_rbti도 보낸다 — 서버 기본이 false(미적용)라 코드만 실으면 무시된다.
        if (rbtiCode) { payload.rbti = rbtiCode; payload.use_rbti = true; }
        // 모델 미선택·기본이면 필드 생략(서버 기본 pro). 화이트리스트 밖은 서버가 폴백.
        if (selectedModel) payload.model = selectedModel;
        // 기본 구성과 같으면 생략. 무효 조합은 서버가 400으로 끊는다(조용한 폴백 없음).
        if (enabledToolsets) payload.enabled_toolsets = enabledToolsets;
        const resp = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal,
        });
        await readEventStream(resp, (event, data) => {
          if (event === "status") {
            asst.setStatus(data.stage, data.detail, data.refs, data.code, data.sources, data.round);
          } else if (event === "source") {
            asst.addSource(data);
          } else if (event === "delta") {
            asst.appendDelta(data.text || "");
          } else if (event === "reset") {
            asst.resetBody();
          } else if (event === "done") {
            if (data.session_id) {
              sessionId = data.session_id;
              try { sessionStorage.setItem(CHAT_SESSION_KEY, sessionId); } catch (e) {}
            }
            asst.finalize(data, (performance.now() - started) / 1000);
          } else if (event === "meta") {
            asst.showMeta(data); // done 뒤 가법 채널(추천 이유·세션 제목)
          } else if (event === "error") {
            asst.showError(data.message);
          }
        });
        asst.markEmptyIfUntouched();
      } catch (err) {
        if (err && err.name === "AbortError") {
          asst.markStopped(); // 스트리밍된 본문은 보존(중지는 파괴가 아니다)
        } else {
          asst.showError("연결에 문제가 있었어요. 잠시 후 다시 시도해 주세요.");
        }
      } finally {
        controller = null;
        setSending(false);
        // 턴이 끝날 때마다 화면=세션 불변식을 스토리지에 반영한다(성공·중지·오류 모두).
        const turn = asst.toSnapshot();
        if (turn) transcript.push(turn);
        saveTranscript();
      }
    }

    sendBtn.addEventListener("click", () => submit());
    stopBtn.addEventListener("click", () => { if (controller) controller.abort(); });
    newChatBtn.addEventListener("click", () => {
      if (sending && controller) controller.abort();
      sessionId = null;
      document.title = baseDocTitle; // 이전 세션 제목이 새 대화 탭에 남지 않게
      try { sessionStorage.removeItem(CHAT_SESSION_KEY); } catch (e) {}
      clearTranscript(); // 세션과 기록은 함께 산다·함께 죽는다(화면=세션 불변식)
      conversation.textContent = "";
      syncLandingMode(null); // 메시지 0 → 랜딩 복귀(인사 + 중앙 컴포저). 애니메이션 없음.
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submit();
      }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      // 자동 성장 상한의 단일 출처 = CSS 변수(--composer-max-h).
      input.style.height = Math.min(input.scrollHeight, cssPx("--composer-max-h")) + "px";
      updateSendState();
    });

    // 컴포저 밖 타이핑 → 컴포저로 포커스 이동(계약은 공용 모듈). 페르소나 팝오버가 열려 있으면
    // 팝오버 키 조작이 우선이라 넘겨준다.
    relayTypingFocus(input, () => !personaPop.hidden);

    // 매트릭스 "이 성향으로 채팅하기" 핸드오프: 채택한 셀의 {질문, 답변 요지(대표책)}를
    // 컴포저에 *보이는* 프리필로 얹는다 — 숨은 컨텍스트 주입 금지(사용자가 보는 것 = 모델이
    // 받는 것). 1회성: 읽는 즉시 제거해 새로고침 시 반복 프리필을 막는다.
    // 프리필은 진술문이 아니라 '요청문'으로 — 그대로 전송해도 에이전트가 되묻지 않고 한 턴에
    // 완결되게(진술형 "…추천을 받았어요."는 되물어 한 턴 낭비 실측). 사용자가 보고 수정 가능.
    // 저장 키는 공용 모듈(rbti.js)이 단일 출처 — 매트릭스와 계약.
    (function applyMatrixHandoff() {
      let handoff = null;
      try {
        const raw = localStorage.getItem(MATRIX_HANDOFF_KEY);
        if (raw) { handoff = JSON.parse(raw); localStorage.removeItem(MATRIX_HANDOFF_KEY); }
      } catch (e) {}
      if (!handoff || !handoff.question) return;
      // 핸드오프 = 이 성향으로 '새 대화' 시작. UI는 빈 대화인데 sessionStorage에 직전 채팅
      // session_id가 남아 있으면 백엔드가 이전 대화를 기억해 새 질문에 옛 맥락이 누출된다
      // (UI는 빈 화면인데 세션은 옛것 — 상태 불일치). 진입 시 세션을 리셋해 다음 전송에서 서버가
      // 새 session_id를 발급하도록 한다('새 대화' 버튼과 동일 의미). 성향 배지·프리필은 유지.
      sessionId = null;
      try { sessionStorage.removeItem(CHAT_SESSION_KEY); } catch (e) {}
      const persona = handoff.code ? handoff.code + " 성향" : "이 성향";
      input.value = handoff.pick
        ? "방금 \"" + handoff.question + "\" 질문에 " + persona + "으로 『" + handoff.pick +
          "』을 추천받았어요. 이 취향에 맞는 책을 더 추천해줘."
        : "\"" + handoff.question + "\"에 대해 " + persona + " 관점으로 이어서 답해줘.";
      input.setSelectionRange(input.value.length, input.value.length); // 이어서 바로 타이핑/수정
      input.dispatchEvent(new Event("input")); // 높이·전송버튼 상태 갱신
    })();

    renderChipsInto(chipsEl);
    // 재방문 복원: 세션이 살아 있으면 그 대화를 화면에 되살린다. 핸드오프(위)는 세션을 비우므로
    // 여기서 옛 기록이 폐기돼 "새 대화 + 프리필"이 된다 — 경로별 분기 없이 불변식이 처리한다.
    restoreTranscript();
    // 초기 레이아웃 확정: 메시지가 없으면 랜딩(인사 + 중앙 컴포저), 위에서 복원된 메시지가
    // 있으면 랜딩을 건너뛰고 하단 컴포저 대화 상태로 그대로 간다.
    syncLandingMode(null);
    conversation.scrollTop = conversation.scrollHeight; // 복원 직후 마지막 턴이 보이게 — 한 번
    input.focus();
    updateSendState(); // 초기: 입력이 비어 있으니 전송 비활성

    // ── 시딩 턴 메타줄 정직화(순수 추가 — 위 기존 라인 무수정) ──
    // 오버뷰에서 이어온 턴은 이 화면에서 잰 소요 시간이 없다(기존 finalize 재사용의 대가로
    // elapsed 0 → "0.0초" 허위 표기). 시간 대신 정직한 유래 라벨로 메타줄을 다시 쓴다.
    function markSeededMeta(msgEl, turn) {
      const meta = msgEl && msgEl.querySelector(".meta");
      if (!meta) return;
      const n = Array.isArray(turn.sources) ? turn.sources.length : 0;
      const parts = [];
      if (n) parts.push(`출처 ${n}개`);
      parts.push("오버뷰에서 이어옴");
      if (turn.model) parts.push(`모델 ${turn.model}`);
      meta.textContent = (n ? "🔍 " : "") + parts.join(" · ");
    }
    // 복원 경로 커버: 방금 restoreTranscript()가 그린 DOM에서 시딩 턴(snapshot의 seeded
    // 플래그)만 골라 메타줄을 재작성한다. transcript 항목과 .msg 요소는 1:1 순서 대응
    // (addUserMessage·createAssistantMessage 모두 msg 하나를 append)이라 인덱스로 짝짓는다.
    {
      const seededMsgs = conversation.querySelectorAll(".msg");
      transcript.forEach((turn, i) => {
        if (turn && turn.seeded && seededMsgs[i]) markSeededMeta(seededMsgs[i], turn);
      });
    }

    // ── 오버뷰 "채팅으로 이어가기" 시딩 진입점(순수 추가 — 위 기존 라인 무수정) ──
    // 오버뷰 모듈이 POST /overview/continue로 서버 세션을 시딩한 뒤 이 함수로 화면을 맞춘다.
    // 렌더·저장은 전부 기존 복원 경로 재사용(addUserMessage·createAssistantMessage의
    // addSource/finalize·toSnapshot·saveTranscript) — 별도 마크업·저장 형식 없음.
    // 세션 교체와 transcript 교체를 이 함수 하나가 함께 해 화면=세션 불변식을 지킨다.
    const SEED_ABORT_MAX_FRAMES = 120; // 진행 중 턴 중단 마감(finally) 대기 상한
    window.yes24SeedChatFromOverview = async function (newSessionId, userText, turn) {
      // 진행 중 전송이 있으면 중단하고, 그 턴의 마감(finally: 스냅샷 push·저장)이 끝난 뒤에
      // 교체한다 — 끊긴 턴의 스냅샷이 시딩된 새 transcript에 섞여 영속되는 레이스 차단.
      if (sending && controller) controller.abort();
      for (let i = 0; i < SEED_ABORT_MAX_FRAMES && sending; i++) {
        await new Promise((r) => requestAnimationFrame(r));
      }
      sessionId = newSessionId;
      try { sessionStorage.setItem(CHAT_SESSION_KEY, sessionId); } catch (e) {}
      document.title = baseDocTitle; // 이전 세션 제목이 이어가기 대화에 남지 않게
      transcript = [];
      conversation.textContent = "";
      addUserMessage(userText);
      transcript.push({ role: "user", text: userText });
      const asst = createAssistantMessage(userText);
      (Array.isArray(turn.sources) ? turn.sources : []).forEach((s) => asst.addSource(s));
      asst.finalize(
        { text: turn.text || "", cited_ids: turn.cited_ids || [], model: turn.model || "" },
        0
      );
      const snap = asst.toSnapshot();
      if (snap) transcript.push(snap);
      // 시딩 턴 표시: 메타줄의 "0.0초"(재사용 elapsed)를 유래 라벨로 교체하고, 스냅샷에
      // seeded 플래그를 남겨 새로고침 복원 때도 같은 재작성이 적용되게 한다(위 복원 커버).
      if (snap) {
        snap.seeded = true;
        markSeededMeta(conversation.lastElementChild, snap);
      }
      saveTranscript();
      syncLandingMode(null); // 메시지가 놓였으니 대화 상태(하단 컴포저)로.
      conversation.scrollTop = conversation.scrollHeight; // 시딩된 턴이 보이게 — 한 번
      input.focus();         // 자동 전송 없음 — 후속 질문은 사용자가 바로 타이핑.
    };
  </script>

  <script type="module">
    // ── 검색결과 AI 오버뷰 데모(추가 모듈, docs/overview-impl-spec §4) ──
    // 기존 채팅 스크립트 블록은 무수정 — 모듈 스코프가 분리돼 전역 충돌이 없고, 공용 lib
    // import는 브라우저가 캐시를 공유한다. 온디맨드 계약: 아래 submit 핸들러가 POST /overview의
    // **유일한** 호출 지점이다(자동 호출 경로 0 — 사용자 확정 요구 1).
    import { renderBody as ovRenderBody } from "/static/lib/md.js?v=1";
    import { readEventStream as ovReadEventStream } from "/static/lib/sse.js?v=1";
    import { WEB_TYPES, coverUrl, isSafeUrl, safeOpen, formatPrice, makeCoverImg, overviewIsRenderable } from "/static/lib/sources.js?v=1";

    const ovApp = document.getElementById("app");
    const ovNav = document.getElementById("ov-navlink");
    const ovView = document.getElementById("overview-view");
    const ovForm = document.getElementById("ov-form");
    const ovQuery = document.getElementById("ov-query");
    const ovRun = document.getElementById("ov-run");
    const ovPanel = document.getElementById("ov-panel");
    const ovSkeleton = document.getElementById("ov-skeleton");
    const ovBody = document.getElementById("ov-body");
    const ovResHead = document.getElementById("ov-res-head");
    const ovResCount = document.getElementById("ov-res-count");
    const ovFoot = document.getElementById("ov-foot");
    const ovEmpty = document.getElementById("ov-empty");
    const ovResults = document.getElementById("ov-results");
    const ovContinue = document.getElementById("ov-continue");

    // 마지막 성공 렌더의 질의·done payload — 이어가기 씨앗의 단일 진실. 클릭 시점의 입력창
    // 값이 아니라 렌더된 오버뷰가 실제 서버에 보낸 질의·받은 정본을 잇는다(렌더 후 수정 무관).
    let ovLastQuery = "";
    let ovLastDone = null;

    // G1 조용한 접힘 + 데모 전용 빈 상태 — 패널(위젯 계약)은 조용히 접고, 데모 페이지에서만
    // 화면이 통째로 비지 않게 패널 밖 뮤트 한 줄을 켠다. 검색결과 행(#ov-results)은 손대지
    // 않는다(있으면 그대로 보인다).
    function ovCollapsePanel() {
      ovPanel.hidden = true;
      ovEmpty.hidden = false;
    }

    // 노출 게이팅 — revealMatrixLinkIfEnabled와 같은 fail-closed 방식. HEAD 프로브 계약(§1.1):
    // 라우트 등록 시 Starlette가 405를 주므로 "404가 아니면" 기능 활성으로 판정한다.
    (function revealOverviewLinkIfEnabled() {
      if (!ovNav) return;
      fetch("/overview", { method: "HEAD" })
        .then((res) => { if (res.status !== 404) ovNav.hidden = false; })
        .catch(() => { /* 실패 시 숨김 유지(fail-closed) */ });
    })();

    // 뷰 전환 — 채팅 DOM은 CSS(.overview-mode)로만 숨긴다(상태 보존: 돌아오면 대화 그대로).
    const OV_LINK_LABEL = "✨ AI 오버뷰";
    const OV_BACK_LABEL = "💬 채팅으로";
    ovNav.addEventListener("click", (e) => {
      e.preventDefault();
      const on = !ovApp.classList.contains("overview-mode");
      ovApp.classList.toggle("overview-mode", on);
      ovView.hidden = !on;
      ovNav.textContent = on ? OV_BACK_LABEL : OV_LINK_LABEL;
      if (on) ovQuery.focus();
    });

    // 접힘·더보기 삭제 — 본문 상시 전체 노출 (2026-08-26 사용자 결정)

    // 출처 칩 — 채팅 makeCard와 동일 DOM 구조·클래스(.card/.num/.title/.info)를 조립한다
    // (함수 자체는 채팅 모듈 내부라 import 불가 — 구조·클래스만 동일하게, 스펙 §4.4).
    // 타입 뱃지는 생략 — 오버뷰 출처는 전부 search_result(스펙 §1.3)라 정보량 0.
    // 단일 패널은 이 카드를 쓰지 않는다(출처 = 아래 검색결과 그 자체 — 중복 삭제). 결과 목록이
    // 없는 3접지원 비교 하네스만 남은 사용처다.
    function makeOvCard(src) {
      const isWeb = WEB_TYPES.has(src.type);
      const card = document.createElement("div");
      card.className = isWeb ? "card web" : "card";
      const cover = coverUrl(src);
      if (cover) card.appendChild(makeCoverImg(cover, "cover"));
      const main = document.createElement("div");
      main.className = "card-main";
      const top = document.createElement("div");
      top.className = "top";
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = src.id;
      top.append(num);
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = src.title || "(제목 없음)";
      main.append(top, title);
      if (!isWeb) {
        if (src.author) {
          const au = document.createElement("div");
          au.className = "info author";
          au.textContent = src.author;
          main.append(au);
        }
        const price = formatPrice(src);
        if (price) {
          const pr = document.createElement("div");
          pr.className = "info price";
          pr.textContent = price;
          main.append(pr);
        }
      }
      card.appendChild(main);
      if (isSafeUrl(src.url)) {
        const open = () => safeOpen(src.url);
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.addEventListener("click", open);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
        });
      }
      return card;
    }

    // 검색결과 행 흉내 — goods_no가 있는 항목만 data 속성을 얹는다(하이라이트 앵커).
    function makeOvRow(src) {
      const li = document.createElement("li");
      if (src.goods_no != null && src.goods_no !== "") li.dataset.goodsNo = src.goods_no;
      if (WEB_TYPES.has(src.type)) li.className = "web";
      // 인용 번호 배지 — 칩 [n]과 이 행이 같은 출처임을 잇는 표식(출처 카드 열의 대체).
      const num = document.createElement("span");
      num.className = "ov-r-num";
      num.textContent = src.id;
      li.appendChild(num);
      const cover = coverUrl(src);
      if (cover) li.appendChild(makeCoverImg(cover, "cover"));
      const main = document.createElement("div");
      main.className = "ov-r-main";
      const title = document.createElement("div");
      title.className = "ov-r-title";
      title.textContent = src.title || "(제목 없음)";
      main.appendChild(title);
      const subText = [src.author, src.rating ? "★ " + src.rating : null]
        .filter(Boolean).join(" · ");
      if (subText) {
        const sub = document.createElement("div");
        sub.className = "ov-r-sub";
        sub.textContent = subText;
        main.appendChild(sub);
      }
      const price = formatPrice(src);
      if (price) {
        const pr = document.createElement("div");
        pr.className = "ov-r-price";
        pr.textContent = price;
        main.appendChild(pr);
      }
      li.appendChild(main);
      // 상품 열기 — 삭제한 출처 카드가 갖던 어포던스를 행이 그대로 물려받는다(같은 유틸).
      if (isSafeUrl(src.url)) {
        const open = () => safeOpen(src.url);
        li.tabIndex = 0;
        li.setAttribute("role", "button");
        li.addEventListener("click", open);
        li.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
        });
      }
      return li;
    }

    // 연속 동일 번호 마커의 표시 병합 — 채팅 collapseRepeatMarkers와 같은 규칙·같은
    // .marker-dup 클래스(함수는 채팅 클로저 내부라 import 불가 — 표시 전용 후처리).
    function ovCollapseRepeatMarkers(el) {
      const markers = [...el.querySelectorAll(".marker")];
      markers.forEach((m, i) => {
        m.classList.toggle(
          "marker-dup",
          i + 1 < markers.length && markers[i + 1].textContent === m.textContent
        );
      });
    }

    // 이번 렌더의 출처(id → src). 마커 클릭 → goods_no로 결과 행을 찾아 하이라이트한다
    // (외부 이동 대신 클릭을 페이지 내 결과로 되돌리는 우리 강점 — 스펙 §4.4).
    let ovSrcById = new Map();
    function ovHighlightRow(sid) {
      const src = ovSrcById.get(String(sid));
      if (!src || src.goods_no == null) return;
      const row = ovResults.querySelector(
        'li[data-goods-no="' + CSS.escape(String(src.goods_no)) + '"]'
      );
      if (!row) return;
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      row.classList.remove("ov-hit");
      void row.offsetWidth; // 리플로우 강제 → 애니메이션 재시작(.card.flash 패턴)
      row.classList.add("ov-hit");
    }

    function renderOverview(overview) {
      ovSrcById = new Map();
      const sources = Array.isArray(overview.sources) ? overview.sources : [];
      sources.forEach((src) => {
        ovSrcById.set(String(src.id), src);
        ovResults.appendChild(makeOvRow(src));
      });
      // 본문 렌더 = 공용 md.js 단일 콜(신규 정규식 금지). citationUrl은 빈 문자열 — 마커를
      // 외부 링크가 아닌 <sup role=button> 칩으로 만들어 클릭을 결과 행으로 되돌린다.
      ovRenderBody(ovBody, overview.text || "", {
        isCitation: (sid) => ovSrcById.has(String(sid)),
        citationUrl: () => "",
        onMarker: ovHighlightRow,
      });
      ovCollapseRepeatMarkers(ovBody);
      // 결과 머리줄은 실제 출처가 있을 때만(무출처면 목록 자체가 비어 라벨이 거짓말이 된다).
      ovResCount.textContent = sources.length ? String(sources.length) : "";
      ovResHead.hidden = sources.length === 0;
      // 면책 1줄 + 관측 시점 — 표기이지 신선도 방어의 대체물이 아니다(TTL은 백엔드 몫).
      // **가장 오래된** 출처가 전체를 대표한다(2026-08-31 적대 감사): 종전엔 sources[0]을 썼는데
      // 행 캐시(600s)에서 온 출처와 상세 보강으로 갓 관측된 출처가 섞이면 첫 번째가 어느 쪽이냐에
      // 따라 **더 신선한 시각으로 전체를 대표**할 수 있었다. 신선도 표기가 정직성의 한계인 이상
      // (config 응답 TTL 주석) 대표값은 낙관이 아니라 보수여야 한다.
      const checked = sources
        .map((src) => src && src.checked_at)
        .filter(Boolean)
        .sort()[0];
      ovFoot.textContent = "AI가 만든 요약으로 오류가 있을 수 있어요"
        + (checked ? " · " + checked + " 확인" : "");
    }

    let ovBusy = false;
    ovForm.addEventListener("submit", async (e) => {
      e.preventDefault(); // 온디맨드 트리거 — 이 핸들러가 POST /overview의 유일한 호출 지점
      const query = ovQuery.value.trim();
      if (!query || ovBusy) return;
      // 비교 모드 조기 분기 — 아래 단일 패널 경로는 한 줄도 바뀌지 않는다(테스트 하네스가
      // 프로덕션 경로에 얹히지 않게 하는 유일한 접점).
      if (ovCmpEnabled && ovCmpOn.checked) {
        ovBusy = true;
        ovRun.disabled = true;
        try { await ovRunCompare(query); }
        finally { ovBusy = false; ovRun.disabled = false; }
        return;
      }
      ovBusy = true;
      ovRun.disabled = true;
      // 이전 결과 정리 + 스켈레톤 표시. 패널 min-height(CSS 예약)로 레이아웃 시프트를 막는다.
      ovBody.textContent = "";
      ovResCount.textContent = "";
      ovResHead.hidden = true;
      ovFoot.textContent = "";
      ovResults.textContent = "";
      ovContinue.hidden = true;
      ovEmpty.hidden = true;
      ovPanel.hidden = false;
      ovSkeleton.hidden = false;
      try {
        // 챗 fetch 관례 동일: 커스텀 헤더 없음, 동일 오리진이라 로그인월 쿠키 자동 동반.
        // section은 데모에서 생략(서버 빈 문자열 기본).
        const res = await fetch("/overview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query }),
        });
        // SSE 소비 — 챗과 같은 공용 파서(lib/sse.js, 비2xx는 여기서 throw → catch의 G1 접힘).
        // delta는 수신 즉시 누적 렌더(스켈레톤은 첫 delta에 제거), reset이면 버퍼를 비우고
        // 재누적, done이 정본이다(최종 렌더는 아래 renderOverview 경로).
        let ovStreamText = "";
        let ovDone = null;
        await ovReadEventStream(res, (event, data) => {
          if (event === "delta") {
            ovSkeleton.hidden = true;
            ovStreamText += data.text || "";
            ovBody.textContent = ovStreamText;
          } else if (event === "reset") {
            ovStreamText = "";
            ovBody.textContent = "";
          } else if (event === "done") {
            ovDone = data;
          }
        });
        const ok = overviewIsRenderable(ovDone);
        if (ok) {
          renderOverview(ovDone.overview); // renderBody가 스트림 평문을 정본으로 교체
          ovLastQuery = query;   // 성공 렌더에서만 세팅(세팅 지점 1곳) — 이어가기 씨앗
          ovLastDone = ovDone;   // 이어가기 화면 주입용 정본(표시 번호 payload)
          ovContinue.hidden = false;
        }
        // G1 조용한 접힘 — degraded 3종·error 프레임·overview null·done 미도착 전부 패널
        // 비표시(배너 금지). 중간 delta가 보였더라도 done 시점 판정이 정본이다.
        else ovCollapsePanel();
      } catch (err) {
        ovCollapsePanel(); // 네트워크 예외·4xx/5xx·스트림 절단도 같은 접힘(G1)
      } finally {
        ovSkeleton.hidden = true;
        ovBusy = false;
        ovRun.disabled = false;
      }
    });

    // 자동 노출 UX는 임베드 스니펫 단계 몫 — 데모는 버튼만 (2026-08-26 사용자 결정)

    // ── 접지원 비교 하네스(테스트 전용 — 서버 config.overview_compare_enabled) ──
    // 같은 질의를 세 접지원(웹 / Yes24 / 둘 다)으로 **병렬** 요청해 나란히 렌더한다. 목적은
    // "웹을 오버뷰에 넣는 게 나은가"를 논쟁이 아니라 화면에서 판단하는 것이라, 팔마다 본문·
    // 출처·타이밍(첫 delta·완료)·인용 수·출처 타입 분포를 같은 자리에 붙여 둔다.
    // 렌더 조립은 단일 패널과 **같은 부품**을 쓴다(makeOvCard·ovRenderBody·
    // ovCollapseRepeatMarkers) — renderOverview는 고정 id에 묶여 있어 3회 호출이 불가하므로
    // 부품 재사용이 중복을 피하는 최대치다(마커 클릭 → 결과 행 하이라이트는 비교 뷰에
    // 결과 목록이 없어 제외).
    const ovCompare = document.getElementById("ov-compare");
    const ovCmpToggle = document.getElementById("ov-cmp-toggle");
    const ovCmpOn = document.getElementById("ov-cmp-on");
    // 팔 표시 라벨(표시 문구는 프론트 몫 — 팔 목록·순서의 소유자는 서버다).
    const OV_ARM_LABELS = { web: "🌐 웹", yes24: "📚 Yes24", both: "🔀 둘 다" };
    let ovCmpEnabled = false;
    let ovCmpArms = [];
    // 심사관용 원시 기록 — 마지막 비교 실행의 팔별 본문·출처·타이밍(compare_raw.json).
    // 테스트 하네스 전용 전역이라 프로덕션 경로는 이 값을 읽지 않는다.
    window.__ovCompareRaw = null;

    (function revealCompareToggleIfEnabled() {
      fetch("/overview/compare")
        .then((res) => (res.ok ? res.json() : null))
        .then((data) => {
          if (!data || !Array.isArray(data.arms) || !data.arms.length) return;
          ovCmpEnabled = true;
          ovCmpArms = data.arms;
          ovCmpToggle.hidden = false;
        })
        .catch(() => { /* 실패 시 숨김 유지(fail-closed — 기존 HEAD 프로브와 같은 관례) */ });
    })();

    // 토글 자체는 화면 폭만 바꾼다 — 실행은 제출 시점에만 일어난다(온디맨드 계약 불변).
    ovCmpOn.addEventListener("change", () => {
      ovApp.classList.toggle("ov-compare-mode", ovCmpOn.checked);
      if (!ovCmpOn.checked) ovCompare.hidden = true;
    });

    // 팔 패널 1개 조립 — 반환 객체가 이 패널의 렌더 접점 전부다(고정 id 없음 → 3회 호출 가능).
    function ovBuildArmPanel(arm) {
      const box = document.createElement("section");
      box.className = "ov-cmp-arm";
      const head = document.createElement("div");
      head.className = "ov-cmp-head";
      const label = document.createElement("span");
      label.textContent = OV_ARM_LABELS[arm] || arm;
      const time = document.createElement("span");
      time.className = "ov-cmp-time";
      const skeleton = document.createElement("span");
      skeleton.className = "typing";
      skeleton.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
      head.append(label, time);
      const body = document.createElement("div");
      body.className = "ov-cmp-body";
      const meta = document.createElement("div");
      meta.className = "ov-cmp-meta";
      const sources = document.createElement("div");
      sources.className = "sources ov-cmp-src";
      box.append(head, skeleton, body, meta, sources);
      return { arm, box, time, skeleton, body, meta, sources };
    }

    // done payload를 패널에 렌더한다 — 단일 패널 renderOverview와 같은 부품·같은 순서.
    function ovRenderArm(panel, done, timing) {
      panel.skeleton.remove();
      const overview = done && done.overview;
      const sources = (overview && Array.isArray(overview.sources)) ? overview.sources : [];
      const ids = new Set(sources.map((src) => String(src.id)));
      panel.time.textContent = (timing.first != null ? "첫 " + timing.first + "ms · " : "")
        + "완료 " + timing.done + "ms";
      if (!overviewIsRenderable(done) || !ids.size) {
        // 팔이 접혔다 — 자리는 남기고 사유만 적는다(3열 비교에서 자리가 사라지면 나란히
        // 견주기가 깨진다). degraded 값은 서버가 만든 기존 구분 그대로다.
        panel.box.classList.add("ov-cmp-off");
        panel.body.textContent = "";
        panel.meta.textContent = "접힘 · " + ((done && done.degraded) || "결과 없음");
        return;
      }
      panel.body.textContent = "";
      ovRenderBody(panel.body, overview.text || "", {
        isCitation: (sid) => ids.has(String(sid)),
        citationUrl: () => "",
        onMarker: () => {},
      });
      ovCollapseRepeatMarkers(panel.body);
      for (const src of sources) panel.sources.appendChild(makeOvCard(src));
      // 관전 포인트를 숫자로 — 인용 수 + 출처 타입 분포(웹 출처가 상품 사실을 주장하는지는
      // 본문과 이 분포를 함께 보면 드러난다).
      const byType = {};
      for (const src of sources) byType[src.type] = (byType[src.type] || 0) + 1;
      panel.meta.textContent = "인용 " + (overview.cited_ids || []).length + "개 · 출처 "
        + Object.keys(byType).map((t) => t + " " + byType[t]).join(" / ");
    }

    // 팔 1개 실행 — 단일 패널과 같은 SSE 소비 계약(delta 누적 / reset 비움 / done 정본).
    async function ovRunArm(query, panel) {
      const started = performance.now();
      const timing = { first: null, done: 0 };
      let streamText = "";
      let done = null;
      try {
        const res = await fetch("/overview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, sources: panel.arm }),
        });
        await ovReadEventStream(res, (event, data) => {
          if (event === "delta") {
            if (timing.first == null) {
              timing.first = Math.round(performance.now() - started);
              panel.skeleton.remove();
            }
            streamText += data.text || "";
            panel.body.textContent = streamText;
          } else if (event === "reset") {
            streamText = "";
            panel.body.textContent = "";
          } else if (event === "done") {
            done = data;
          }
        });
      } catch (err) {
        done = { overview: null, degraded: "request_failed" };
      }
      timing.done = Math.round(performance.now() - started);
      ovRenderArm(panel, done, timing);
      // 심사관이 나중에 채점할 수 있게 원시 산출을 그대로 남긴다(총점 판정은 여기서 하지 않는다).
      return {
        arm: panel.arm,
        text: (done && done.overview && done.overview.text) || "",
        cited_ids: (done && done.overview && done.overview.cited_ids) || [],
        sources: (done && done.overview && done.overview.sources) || [],
        degraded: (done && done.degraded) || null,
        first_delta_ms: timing.first,
        done_ms: timing.done,
        stream_matches_done: streamText === ((done && done.overview && done.overview.text) || ""),
      };
    }

    // 3팔 병렬 실행 — 팔마다 독립 SSE 스트림이라 계약도 팔마다 독립으로 성립한다.
    async function ovRunCompare(query) {
      ovPanel.hidden = true;
      ovEmpty.hidden = true;
      ovResHead.hidden = true;
      ovResults.textContent = "";
      ovCompare.textContent = "";
      ovCompare.hidden = false;
      ovApp.classList.add("ov-compare-mode");
      const panels = ovCmpArms.map(ovBuildArmPanel);
      for (const panel of panels) ovCompare.appendChild(panel.box);
      const arms = await Promise.all(panels.map((panel) => ovRunArm(query, panel)));
      window.__ovCompareRaw = { query, at: new Date().toISOString(), arms };
    }

    // ── W1 검색 프리워밍 ──
    // 타이핑 정지(디바운스) 시 검색 HTTP만 서버 TextCache(90s)에 미리 데운다 — LLM 콜 0라
    // 버튼 온디맨드/자동 노출 어느 계약과도 무관하고, 제출 시 흐름은 무변경(검색 구간이
    // 캐시 히트로 자연 소멸해 콜드 완료가 짧아진다). 우리 데모는 검색창이 우리 것이라
    // 성립하는 구조다 — 실전 임베드에서 Yes24 검색창 입력과의 워밍 연동은 향후 협의 항목.
    // 실패는 무시한다(본 요청이 어차피 재검색).
    const OV_WARM_DEBOUNCE_MS = 500;
    const OV_WARM_MIN_CHARS = 2;
    let ovWarmTimer = null;
    let ovLastWarmed = "";
    ovQuery.addEventListener("input", () => {
      if (ovWarmTimer) clearTimeout(ovWarmTimer);
      ovWarmTimer = setTimeout(() => {
        const q = ovQuery.value.trim();
        if (q.length < OV_WARM_MIN_CHARS || q === ovLastWarmed) return;
        ovLastWarmed = q;
        fetch("/overview/warm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q }),
        }).catch(() => {});
      }, OV_WARM_DEBOUNCE_MS);
    });

    // ── 채팅으로 이어가기(2026-08-25 사용자 결정: 오버뷰 교환을 그대로 들고 가서 이어간다) ──
    // 주 경로: POST /overview/continue가 오버뷰 교환을 챗 세션 첫 턴으로 **서버에 시딩**하고
    // (재생성·재조사 없음), 채팅 모듈이 순수 추가로 노출한 시딩 진입점(yes24SeedChatFromOverview)
    // 이 그 세션·턴을 채팅 화면·transcript에 같은 형식으로 놓는다 — 2층(서버 세션=화면) 동기화.
    // 폴백(캐시 미스 404·시딩 실패): 종전 계약 — 새 대화 + 같은 질의 자동 전송(재조사).
    // 폴백 접촉 표면은 DOM id(#input·#send·#new-chat)와 합성 이벤트뿐.
    // 프레임 상한 — sending 해제(abort → submit finally의 setSending(false))가 비동기라 유한 대기.
    const OV_HANDOFF_MAX_FRAMES = 120;
    const ovNextFrame = () => new Promise((r) => requestAnimationFrame(r));

    ovContinue.addEventListener("click", async () => {
      const q = ovLastQuery;
      if (!q) return;
      // 주 경로: 서버 시딩 먼저(뷰 전환 전 — 실패 판정을 안 뒤에 폴백 경로를 태운다).
      let seeded = null;
      try {
        const res = await fetch("/overview/continue", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q }),
        });
        if (res.ok) seeded = await res.json();
      } catch (err) { /* 네트워크 예외 → 폴백 */ }
      // 채팅 뷰 복귀 — 토글 핸들러 재사용: overview-mode일 때의 클릭 = 해제.
      if (ovApp.classList.contains("overview-mode")) ovNav.click();
      const ov = ovLastDone && ovLastDone.overview;
      if (seeded && seeded.session_id && ov && window.yes24SeedChatFromOverview) {
        // 화면 주입은 표시 번호 정본(done payload) 그대로 — 채팅 복원과 같은 렌더 경로.
        // 입력창 포커스는 시딩 진입점이 한다(자동 전송 없음 — 후속 질문은 사용자 몫).
        await window.yes24SeedChatFromOverview(seeded.session_id, q, {
          text: ov.text,
          sources: ov.sources,
          cited_ids: ov.cited_ids,
          model: ovLastDone.model || "",
        });
        return;
      }
      // ── 폴백: 새 대화 + 같은 질의 자동 전송(재조사) — 종전 경로 그대로 ──
      // 1) 새 대화 — abort + 세션·기록·화면 초기화 원자 경로 재사용(옛 맥락 누출 방지).
      document.getElementById("new-chat").click();
      // 2) 전송 가능 대기 — input.disabled가 sending의 정확한 미러.
      const input = document.getElementById("input");
      for (let i = 0; i < OV_HANDOFF_MAX_FRAMES && input.disabled; i++) await ovNextFrame();
      // 3) 보이는 프리필(매트릭스 핸드오프 선례 — 사용자가 보는 것 = 모델이 받는 것).
      //    원 질의 그대로, 래핑 문장·오버뷰 텍스트 첨부 없음(숨은 컨텍스트 주입 금지).
      input.value = q;
      input.setSelectionRange(input.value.length, input.value.length);
      input.dispatchEvent(new Event("input")); // 높이 자동성장 + 전송버튼 활성
      // 4) 자동 전송 — 상한 내 해제 실패 시 프리필만 남긴다(전송 큐잉·재시도 금지).
      const send = document.getElementById("send");
      if (!send.disabled) send.click();
      else input.focus();
    });

    // 마커 호버 미니카드 — 기존 .marker-pop CSS 재사용, #overview-view 스코프 리스너.
    // 데이터는 이번 렌더의 출처 맵(ovSrcById)에서 읽는다 — 출처 카드 열을 지운 뒤로 카드 DOM은
    // 없고, 이 맵이 렌더된 결과 행·마커와 같은 단일 진실이다(별도 상태 추가 아님).
    const ovPop = document.createElement("div");
    ovPop.className = "marker-pop";
    ovPop.hidden = true;
    document.body.appendChild(ovPop);
    ovView.addEventListener("mouseover", (e) => {
      const m = e.target.closest(".marker");
      if (!m) return;
      const num = (m.textContent.match(/\d+/) || [])[0];
      const src = num ? ovSrcById.get(num) : null;
      if (!src) return;
      ovPop.textContent = "";
      const t = document.createElement("b");
      t.textContent = src.title || "";
      ovPop.appendChild(t);
      const subText = [src.author, formatPrice(src)].filter(Boolean).join(" · ");
      if (subText) {
        const sub = document.createElement("div");
        sub.className = "pop-sub";
        sub.textContent = subText;
        ovPop.appendChild(sub);
      }
      ovPop.hidden = false;
      const mr = m.getBoundingClientRect();
      const pr = ovPop.getBoundingClientRect();
      const x = Math.max(8, Math.min(mr.left, window.innerWidth - pr.width - 12));
      const y = mr.top - pr.height - 8;
      ovPop.style.left = x + "px";
      ovPop.style.top = (y < 8 ? mr.bottom + 8 : y) + "px";
    });
    ovView.addEventListener("mouseout", (e) => {
      if (e.target.closest(".marker")) ovPop.hidden = true;
    });
    // 스크롤 시 남은 팝오버 정리(fixed라 스크롤을 따라가지 않는다 — 채팅 팝오버와 동일).
    document.addEventListener("scroll", () => { ovPop.hidden = true; }, true);
  </script>
</body>
</html>
