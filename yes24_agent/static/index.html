<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yes24 AI 어시스턴트</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --border: #e5e5e8;
      --text: #1a1a1e;
      --muted: #8a8a92;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --assistant-bg: #f0f0f3;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --web: #ea580c;
      --web-soft: #ffedd5;
      --error-bg: #fee2e2;
      --error-text: #b91c1c;
      --chip-bg: #ffffff;
      --card-bg: #ffffff;
      /* 랜딩(빈 대화) 상태 — 중앙 컴포저 배치 상수 */
      --landing-gap: 20px;              /* 인사 ↔ 컴포저 ↔ 예시 칩 사이 여백 */
      --composer-radius-landing: 26px;  /* 랜딩의 넓은 라운드형 입력창 */
      --landing-shift-ms: 240ms;        /* 중앙 → 하단 전환 시간 */
      --composer-max-h: 140px;          /* 컴포저 textarea 최대 높이(자동 성장 상한, JS와 공유) */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171a;
        --panel: #202024;
        --border: #313136;
        --text: #ececf0;
        --muted: #9a9aa2;
        --user-bg: #2563eb;
        --user-text: #ffffff;
        --assistant-bg: #26262b;
        --accent: #60a5fa;
        --accent-soft: #1e3a5f;
        --web: #fb923c;
        --web-soft: #3a2412;
        --error-bg: #3b1a1a;
        --error-text: #fca5a5;
        --chip-bg: #26262b;
        --card-bg: #26262b;
      }
    }
    * { box-sizing: border-box; }
    /* 페이지 자체는 절대 스크롤하지 않는다 — 모든 스크롤은 #conversation 등 내부 컨테이너 몫.
       body 스크롤을 막아 1~2px 넘침으로 생기는 유령 페이지 스크롤바를 원천 차단한다. */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Noto Sans KR", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      /* 모바일 브라우저의 접히는 주소창까지 세는 100vh는 컴포저를 접힘선 아래로 밀어 페이지
         스크롤을 만든다 — 실제 보이는 높이(dvh)를 쓴다(dvh 미지원 구형은 100vh로 폴백). */
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      position: relative; /* 페르소나 팝오버(absolute) 앵커 */
    }
    header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      flex: 0 0 auto;
    }
    header .logo { font-size: 18px; }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    header .spacer { flex: 1; }
    header button {
      font-size: 12px; color: var(--muted); background: transparent;
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
      cursor: pointer;
    }
    header button:hover { color: var(--text); }
    /* /matrix(16유형 비교) 진입 링크 — 헤더 버튼과 동일 톤의 앵커. 배포 숨김 토글이
       없어 persona-badge와 동일하게 무조건 노출한다(가법). */
    header a.navlink {
      font-size: 12px; color: var(--muted); background: transparent;
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    header a.navlink:hover { color: var(--text); border-color: var(--accent); }

    #conversation {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .intro { margin: 0 0 var(--landing-gap); text-align: center; color: var(--muted); }
    .intro .big {
      font-size: clamp(20px, 5vw, 26px); color: var(--text); font-weight: 600;
      margin-bottom: 4px; line-height: 1.35;
    }
    .intro p { font-size: 13px; margin: 4px 0 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip {
      background: var(--chip-bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer;
      transition: border-color 0.12s ease, transform 0.12s ease;
    }
    .chip:hover { border-color: var(--accent); transform: translateY(-1px); }

    /* 새 메시지 등장 — 은은한 페이드업(자연스러운 나타남, 절제). */
    .msg { display: flex; flex-direction: column; gap: 6px; animation: msgIn 0.28s ease both; }
    .msg.user { align-items: flex-end; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .bubble {
      max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 14.5px;
      line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
    .msg.assistant .bubble { background: var(--assistant-bg); color: var(--text); border-bottom-left-radius: 4px; }
    .bubble.error { background: var(--error-bg); color: var(--error-text); }
    .bubble.empty { color: var(--muted); }
    /* 첫 델타 전 대기 = 정적 "…" 대신 부드러운 타이핑 인디케이터(살아있는 느낌). */
    .typing { display: inline-flex; gap: 4px; align-items: center; height: 1.25em; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: typing 1.2s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
    @keyframes fadein { from { opacity: 0.35; } to { opacity: 1; } }

    /* 진행 흐름 — 진행 단계와 본문 조각을 **도착 순서대로 한 열에** 쌓는다.
       접히는 별도 타임라인 블록(trace)은 삭제했다: 같은 열에 시간순으로 놓이면 무엇을
       어떤 순서로 했는지가 그 자체로 읽히고, 완료 후 접으면 이미 읽고 지나간 내용이
       중간에서 사라지며 아래 본문이 위로 점프한다. */
    .flow { display: flex; flex-direction: column; gap: 6px; }
    .step {
      font-size: 12.5px; color: var(--muted); display: flex; align-items: flex-start; gap: 6px;
      line-height: 1.5; animation: fadein 0.3s ease; padding: 0 6px;
    }
    .step .ico { flex: 0 0 auto; width: 15px; text-align: center; }
    /* 긴 멀티쿼리 검색어(각도 수 상한 없음)는 가로 스크롤이 아니라 줄바꿈으로 흡수한다 —
       의도된 가로 스크롤러는 .sources·.md-table-wrap 둘뿐이다(스크롤 계약). */
    .step .step-label { min-width: 0; overflow-wrap: anywhere; }
    .step.done .ico { color: var(--accent); }        /* 완료 단계는 체크 강조색 */
    .step.active .ico { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    /* 턴 마감 메타(소요·모델·출처 수) — 접힌 trace 헤더가 담던 정보의 새 자리. */
    .meta { font-size: 12px; color: var(--muted); padding: 0 6px; }
    .meta:empty { display: none; }
    .sources { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .sources:empty { display: none; }
    .card {
      flex: 0 0 auto; max-width: 210px; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: row; gap: 8px;
    }
    /* 본문 열(제목·저자·가격). 표지가 있으면 그 오른쪽, 없으면 카드 전체를 채운다. */
    .card .card-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 auto; }
    /* 좌측 표지 썸네일(검색결과 image_url). 실패 시 JS가 제거해 본문만 남는다. */
    .card .cover {
      flex: 0 0 auto; width: 38px; height: 54px; object-fit: cover; border-radius: 4px;
      background: var(--border);
    }
    .card:hover { border-color: var(--accent); }
    /* 최종 인용 출처 카드를 강조한다. */
    .card.cited { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .card.web.cited { border-color: var(--web); box-shadow: 0 0 0 1px var(--web); }
    .card.flash { animation: flash 1s ease; }
    @keyframes flash {
      0% { background: var(--accent-soft); border-color: var(--accent); }
      100% { background: var(--card-bg); }
    }
    .card .top { display: flex; align-items: center; gap: 6px; }
    .card .num {
      font-size: 11px; font-weight: 700; color: #fff; background: var(--accent);
      border-radius: 5px; min-width: 18px; height: 18px; display: inline-flex;
      align-items: center; justify-content: center; padding: 0 4px;
    }
    .card .type { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
    /* 외부 웹 출처: Yes24 파랑과 대비되는 주황 계열 + 왼쪽 강조선으로 즉시 구분 */
    .card.web { border-left: 3px solid var(--web); }
    .card.web:hover { border-color: var(--web); }
    .card.web .num { background: var(--web); }
    .card.web .type { color: var(--web); border-color: var(--web); }
    .card .title {
      font-size: 12.5px; color: var(--text); line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    /* 상품 카드 저자·가격(비웹). 저자는 흐리게, 가격은 강조색으로 스캔되게. */
    .card .info { font-size: 11.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .info.author { color: var(--muted); }
    .card .info.price { color: var(--accent); font-weight: 600; }
    /* 인용 마커 — 인접·그룹 마커([48][49][50] / [2, 3, 4])가 한 숫자로 뭉쳐 보이지 않게
       개별 칩(옅은 배경·라운드)으로 분리한다(간격만으론 위첨자 숫자가 붙어 읽힘).
       여백은 왼쪽에만 준다: 오른쪽 여백이 있으면 뒤따르는 구두점(., 등)이 칩에서 떨어져
       "…입니다 ¹ ." 처럼 읽힌다. 칩끼리 이어질 때만 아래 인접 규칙으로 간격을 넣는다. */
    /* url을 아는 마커는 <a>, 모르는 마커는 <sup> 칩이다 — 태그로 셀렉터를 가르지 않고
       .marker 하나로 둔다(둘의 생김새가 갈라지면 같은 문장에서 크기가 튄다). */
    .marker {
      display: inline-block; vertical-align: super; line-height: 1;
      color: var(--accent); font-weight: 700; font-size: 0.66em; cursor: pointer;
      background: var(--accent-soft); border-radius: 4px; padding: 1px 3px;
      margin: 0 0 0 1px; text-decoration: none;
    }
    .marker:hover { background: var(--accent); color: #fff; text-decoration: none; }
    .marker + .marker { margin-left: 3px; }
    /* 키보드 포커스 가시성(a11y) — 클릭 가능한 것은 탭으로도 닿고 링이 보인다(matrix와 동일 계약). */
    .marker:focus-visible, .card:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* 마크다운 헤더(###/####) — 문서 헤딩 태그 대신 본문 대비 소폭 큰 볼드 블록(축소 스타일). */
    .bubble .md-h { font-weight: 700; margin: 10px 0 2px; line-height: 1.4; }
    .bubble .md-h.l3 { font-size: 15.5px; }
    .bubble .md-h.l4 { font-size: 14.5px; }
    /* 불릿·번호 리스트 — 줄머리 마커를 <li>가 담당(리터럴 */- 노출 방지). 기본 마진은 과해서
       절제한다(본문과 같은 리듬). 중첩 없이 한 단계만(파서가 평면 리스트만 만든다). */
    .bubble .md-list { margin: 6px 0; padding-left: 1.5em; }
    .bubble .md-list li { margin: 2px 0; }
    /* 파이프 테이블 — 말풍선 폭을 넘으면 표만 가로 스크롤(말풍선/페이지는 안 넘침).
       말풍선의 pre-wrap을 표 안에서는 해제한다(셀 텍스트가 원문 공백대로 새지 않게). */
    .bubble .md-table-wrap { overflow-x: auto; white-space: normal; margin: 8px 0; }
    /* 표는 말풍선 폭을 채우고 셀은 줄바꿈한다 — nowrap이면 열이 옆으로 밀려 "주요 특징" 같은
       핵심 칸이 잘리고 가로 스크롤로만 읽혔다(도그푸딩). 넘칠 때의 가로 스크롤은 래퍼가 유지. */
    .bubble .md-table { border-collapse: collapse; font-size: 13px; width: 100%; }
    .bubble .md-table th, .bubble .md-table td {
      border: 1px solid var(--border); padding: 5px 9px; text-align: left; vertical-align: top;
    }
    .bubble .md-table th { background: var(--bg); font-weight: 700; }
    /* 코드 — 인라인 `코드`와 ``` 블록. 안쪽 텍스트는 리터럴(md.js가 배지·볼드 미승격).
       블록은 넘칠 때만 그 안에서 가로 스크롤(말풍선·페이지는 안 넘침, 표와 같은 결). */
    .bubble code.md-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em;
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
    }
    .bubble pre.md-pre {
      margin: 8px 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; overflow-x: auto;
    }
    .bubble pre.md-pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
      white-space: pre; background: none; border: none; padding: 0;
    }

    .composer {
      flex: 0 0 auto; border: 0; border-top: 1px solid var(--border); padding: 12px;
      background: var(--panel); display: flex; gap: 8px; align-items: flex-end;
      /* 대화가 입력창 아래로 흘러드는 층위감(은은한 위쪽 그림자). */
      box-shadow: 0 -10px 20px -14px rgba(0, 0, 0, 0.18);
      /* 랜딩(중앙) ↔ 대화(하단) 전환: 위치는 JS가 FLIP으로 transform 보정하고,
         테두리·라운드·여백은 같은 시간 동안 함께 전이된다. */
      transition:
        transform var(--landing-shift-ms) ease,
        margin var(--landing-shift-ms) ease,
        padding var(--landing-shift-ms) ease,
        border-radius var(--landing-shift-ms) ease,
        box-shadow var(--landing-shift-ms) ease;
    }
    .composer textarea {
      flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 12px; font-size: 14.5px; font-family: inherit; background: var(--bg);
      color: var(--text); max-height: var(--composer-max-h); line-height: 1.5;
      /* 긴 URL 등은 가로 스크롤이 아니라 줄바꿈으로 흘린다. 세로는 max-height에 닿을 때만 스크롤. */
      overflow-x: hidden; overflow-y: auto;
      transition: border-color 0.13s ease, box-shadow 0.13s ease;
    }
    .composer textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .composer textarea:disabled { opacity: 0.55; cursor: not-allowed; }
    .composer button {
      border: none; border-radius: 12px; padding: 0 16px; height: 42px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: filter 0.13s ease, opacity 0.13s ease;
    }
    .btn-send { background: var(--accent); color: #fff; }
    .btn-send:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-send:disabled { opacity: 0.4; cursor: default; }
    /* 위로 스크롤해 자동추적이 꺼진 동안만 뜨는 "↓ 최신" 버튼(컴포저 위 중앙). 클릭 시 하단 복귀. */
    .jump-latest {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 78px; z-index: 5;
      background: var(--accent); color: #fff; border: none; border-radius: 999px;
      padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .jump-latest[hidden] { display: none; }
    .btn-stop { background: transparent; color: var(--error-text); border: 1px solid var(--border) !important; }
    .btn-stop:disabled { display: none; }

    /* ── 랜딩(빈 대화) 상태 ──
       메시지가 하나도 없는 동안엔 컴포저를 하단이 아니라 화면 중앙에 띄운다:
       [대화영역(인사, 아래정렬)] + [컴포저] + [예시 칩] + [스페이서]로, 대화영역과 스페이서가
       남는 높이를 나눠 가지며 인사·컴포저·칩 묶음이 세로 중앙에 놓인다. 스크롤은 없다.
       상태 판정은 "대화에 메시지가 있는가" 하나뿐이라(js: hasMessages), 첫 메시지가 붙거나
       히스토리가 복원되면 이 클래스가 떨어지며 하단 고정 대화 레이아웃으로 돌아간다. */
    .app.landing #conversation {
      overflow: hidden; justify-content: flex-end; align-items: center; padding-bottom: 0;
    }
    .app.landing .composer {
      border: 1px solid var(--border); border-radius: var(--composer-radius-landing);
      margin: 0 18px; padding: 8px 8px 8px 14px;
      box-shadow: 0 10px 30px -20px rgba(0, 0, 0, 0.45);
    }
    .app.landing .composer textarea {
      border-color: transparent; background: transparent; padding: 11px 4px; min-height: 44px;
    }
    .app.landing .composer textarea:focus { border-color: transparent; box-shadow: none; }
    .app.landing .btn-send { border-radius: 999px; }
    .landing-extras { flex: 0 0 auto; padding: var(--landing-gap) 18px 0; }
    .landing-spacer { flex: 1 1 auto; }
    /* 대화 상태에선 랜딩 전용 요소만 감춘다(레이아웃은 기존 그대로). */
    .app:not(.landing) .landing-extras,
    .app:not(.landing) .landing-spacer { display: none; }

    /* ── 독서 성향(RBTI) 페르소나 배지 + 선택 팝오버 ──
       헤더의 배지를 누르면 4축 이지선다 팝오버가 열린다. 미선택 시엔 배지가 회색
       "독서 성향"이고, 적용 시 4글자 코드(예: CADI)를 강조색으로 표시한다. */
    .persona-badge {
      display: inline-flex; align-items: center; gap: 5px;
    }
    .persona-badge .pb-ico { font-size: 13px; }
    .persona-badge.active {
      color: var(--accent); border-color: var(--accent); background: var(--accent-soft);
      font-weight: 700; letter-spacing: 0.08em;
    }

    /* 팝오버 바깥을 덮는 투명 백드롭 — 클릭 시 닫힘 */
    .persona-backdrop { position: fixed; inset: 0; z-index: 40; background: transparent; }
    .persona-backdrop[hidden] { display: none; }

    .persona-pop {
      position: absolute; z-index: 50; top: 56px; right: 12px;
      width: min(320px, calc(100vw - 24px));
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }
    .persona-pop[hidden] { display: none; }
    .pp-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .pp-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

    .pp-axis { display: flex; flex-direction: column; gap: 5px; }
    .pp-axis-label { font-size: 11px; font-weight: 600; color: var(--muted); }
    .pp-opts { display: flex; gap: 6px; }
    .pp-opt {
      flex: 1 1 0; text-align: left; background: var(--bg); border: 1px solid var(--border);
      border-radius: 9px; padding: 7px 9px; cursor: pointer; color: var(--text);
      display: flex; flex-direction: column; gap: 1px; font-family: inherit;
    }
    .pp-opt:hover { border-color: var(--accent); }
    .pp-opt.sel { border-color: var(--accent); background: var(--accent-soft); }
    .pp-opt .ot { font-size: 12.5px; font-weight: 600; }
    .pp-opt .od { font-size: 10.5px; color: var(--muted); }

    .pp-code {
      text-align: center; font-size: 15px; font-weight: 700; letter-spacing: 0.35em;
      color: var(--accent); padding: 1px 0 1px 0.35em;
    }
    .pp-code.partial { color: var(--muted); }
    /* 코드가 뭘 뜻하는지 그 자리에서 풀어 준다(4글자만 봐선 모른다는 도그푸딩 지적). */
    .pp-code-label { text-align: center; font-size: 11px; color: var(--muted); margin-top: -7px; }
    .pp-code-label:empty { display: none; }

    .pp-actions { display: flex; gap: 8px; }
    .pp-actions button {
      flex: 1 1 0; border-radius: 10px; padding: 8px 0; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .pp-clear { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .pp-clear:hover { color: var(--text); }
    .pp-apply { background: var(--accent); border: none; color: #fff; }
    .pp-apply:disabled { opacity: 0.4; cursor: default; }

    /* 적용된 성향 알림줄 — 켜져 있을 때만 컴포저 바로 위에 상시 표시한다. 헤더 배지만으론
       적용 여부를 못 알아챘다는 도그푸딩 지적에 대한 피드백 면이고, 여기서 바로 해제된다. */
    .persona-active {
      flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
      margin: 0 12px 8px; padding: 6px 10px; font-size: 12px;
      background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 9px;
    }
    .persona-active[hidden] { display: none; }
    .persona-active .pa-code { font-weight: 700; letter-spacing: 0.08em; color: var(--accent); }
    .persona-active .pa-label { flex: 1 1 auto; color: var(--muted); }
    .persona-active .pa-clear {
      flex: 0 0 auto; background: transparent; border: 1px solid var(--border);
      border-radius: 7px; padding: 3px 8px; font-size: 11.5px; color: var(--muted);
      cursor: pointer; font-family: inherit;
    }
    .persona-active .pa-clear:hover { color: var(--text); border-color: var(--accent); }

    /* 모션 민감 사용자 존중 — 애니메이션/전이 무력화(최종 상태 유지). */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important; animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app landing" id="app">
    <header>
      <span class="logo">📚</span>
      <h1>Yes24 AI 어시스턴트</h1>
      <span class="spacer"></span>
      <a id="matrix-navlink" class="navlink" href="/matrix" title="한 질문을 16가지 독서 성향으로 비교해 보기" hidden>🧭 16유형 비교</a>
      <button id="persona-badge" class="persona-badge" aria-haspopup="dialog" aria-expanded="false">
        <span class="pb-ico">📖</span><span id="persona-label">독서 성향</span>
      </button>
      <button id="new-chat">새 대화</button>
    </header>

    <div class="persona-backdrop" id="persona-backdrop" hidden></div>
    <div class="persona-pop" id="persona-pop" role="dialog" aria-label="독서 성향 선택" hidden>
      <div>
        <div class="pp-title">독서 성향 (RBTI)</div>
        <div class="pp-sub">네 축을 하나씩 고르면 4글자 코드(예: SEBF)가 만들어지고, 그 취향에 맞춰 답해드려요. 미선택 시 기존과 동일해요.</div>
      </div>
      <div class="pp-axes" id="pp-axes"></div>
      <div class="pp-code partial" id="pp-code">· · · ·</div>
      <div class="pp-code-label" id="pp-code-label"></div>
      <div class="pp-actions">
        <button class="pp-clear" id="pp-clear">해제</button>
        <button class="pp-apply" id="pp-apply" disabled>적용</button>
      </div>
    </div>

    <!-- 인사(intro)는 JS가 상수(LANDING_GREETING/LANDING_SUBTITLE)로 그린다 — 문구 단일 출처. -->
    <div id="conversation"></div>

    <button id="jump-latest" class="jump-latest" hidden>↓ 최신</button>

    <!-- 성향이 적용된 동안에만 뜨는 알림줄(코드 + 한글 축 라벨 + 즉시 해제). -->
    <div class="persona-active" id="persona-active" hidden>
      <span aria-hidden="true">📖</span>
      <span class="pa-code" id="pa-code"></span>
      <span class="pa-label" id="pa-label"></span>
      <button class="pa-clear" id="pa-clear">해제</button>
    </div>

    <div class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요…  (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
      <button class="btn-stop" id="stop" disabled>중지</button>
      <button class="btn-send" id="send">전송</button>
    </div>

    <!-- 랜딩 전용: 컴포저 아래 예시 칩 + 중앙 정렬용 스페이서(대화 상태에선 숨김). -->
    <div class="landing-extras" id="landing-extras">
      <div class="chips" id="chips"></div>
    </div>
    <div class="landing-spacer"></div>
  </div>

  <script type="module">
    // 공용 모듈(단일 사본) — 마크다운·인용 렌더, SSE, RBTI 축 정의, 출처 유틸.
    // ?v=1은 **일회성** 캐시 탈출구다: no-cache 헤더가 붙기 전 구버전을 heuristic-freshness로
    // 붙든 브라우저가 무쿼리 URL을 재요청하지 않는 문제를, 한 번도 캐시된 적 없는 새 URL로 우회한다.
    // 이후 모듈이 바뀌어도 이 숫자를 올릴 필요 없다 — 서버 no-cache가 매번 재검증하니까(자라지 않음).
    import { renderBody as renderMarkdown } from "/static/lib/md.js?v=1";
    import { readEventStream } from "/static/lib/sse.js?v=1";
    import {
      AXES as RBTI_AXES, parseCode as parseRbtiCode, deriveCode, deriveAxisLabel,
      RBTI_STORAGE_KEY, MATRIX_HANDOFF_KEY,
    } from "/static/lib/rbti.js?v=1";
    import { WEB_TYPES, coverUrl, isSafeUrl, safeOpen } from "/static/lib/sources.js?v=1";

    // 16유형 비교(/matrix) 네비 링크는 서버 배포 게이팅(matrix_enabled)을 따라간다.
    // 기본 hidden(fail-closed: 프로드 숨김)이고, /matrix가 살아 있을 때만(200) 노출한다.
    // 서버 플래그가 단일 진실 — 프론트는 라우트 존재 여부만 확인한다.
    (function revealMatrixLinkIfEnabled() {
      const link = document.getElementById("matrix-navlink");
      if (!link) return;
      fetch("/matrix", { method: "HEAD" })
        .then((res) => { if (res.ok) link.hidden = false; })
        .catch(() => { /* 실패 시 숨김 유지(fail-closed) */ });
    })();

    // 랜딩(빈 대화) 인사 — 문구는 여기 한 곳에서만 정의한다.
    const LANDING_GREETING = "무엇을 도와드릴까요?";
    const LANDING_SUBTITLE = "무엇이든 물어보세요. 책과 상품은 Yes24 실시간 근거로 더 정확하게 답해드려요.";

    const EXAMPLES = [
      "요즘 인기 에세이 추천해줘",
      "YES24 단순 변심 반품 조건 알려줘",
      "오늘 주요 경제 뉴스 요약해줘",
      "이 문장을 더 따뜻하게 다듬어줘",
    ];
    const STATUS_ICON = {
      thinking: "💭", searching: "🔎", searching_web: "🌐", reading: "📖",
      reading_web: "📄", browsing: "📚", notice: "⚠️", found: "✅",
    };
    const TYPE_LABEL = {
      search_result: "검색결과", book_detail: "상세",
      notice: "공지", browse: "코너", web: "웹",
    };
    const app = document.getElementById("app");
    const composer = document.getElementById("composer");
    const conversation = document.getElementById("conversation");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const stopBtn = document.getElementById("stop");
    const newChatBtn = document.getElementById("new-chat");
    const chipsEl = document.getElementById("chips");

    // 채팅↔매트릭스 왕복(전체 페이지 네비게이션)에도 세션이 이어지도록 sessionId를
    // sessionStorage에 영속한다(페이지별 키 분리 — 매트릭스는 별도 키). 서버가 세션 히스토리를
    // DB에 갖고 있어 같은 sessionId로 이어 물으면 맥락이 유지된다. 과거 버블 복원은 스코프 밖.
    const CHAT_SESSION_KEY = "yes24_chat_session_id";
    let sessionId = null;
    try { sessionId = sessionStorage.getItem(CHAT_SESSION_KEY) || null; } catch (e) {}
    let controller = null;
    let sending = false;

    // ── 독서 성향(RBTI) 페르소나 ── 축 정의·코드 파싱은 공용 모듈(rbti.js)이 단일 출처.
    // (백엔드 계약 "축 순서 = 코드 자릿수"를 두 페이지가 각자 들고 있던 이원화를 제거)

    const personaBadge = document.getElementById("persona-badge");
    const personaLabel = document.getElementById("persona-label");
    const personaPop = document.getElementById("persona-pop");
    const personaBackdrop = document.getElementById("persona-backdrop");
    const ppAxes = document.getElementById("pp-axes");
    const ppCode = document.getElementById("pp-code");
    const ppCodeLabel = document.getElementById("pp-code-label");
    const personaActive = document.getElementById("persona-active");
    const paCode = document.getElementById("pa-code");
    const paLabel = document.getElementById("pa-label");
    const paClear = document.getElementById("pa-clear");
    const ppApply = document.getElementById("pp-apply");
    const ppClear = document.getElementById("pp-clear");

    let rbtiCode = null;              // 적용된 코드(요청 body에 실림) 또는 null
    let pendingSel = {};              // 팝오버 진행 중 축별 선택 { pattern:"C", ... }

    // 헤더 배지 + 컴포저 위 알림줄을 함께 갱신한다(적용 상태의 단일 갱신 지점).
    // 알림줄은 코드와 한글 축 라벨을 같이 보여 4글자가 뭘 뜻하는지 바로 읽히게 한다.
    function updateBadge() {
      if (rbtiCode) {
        personaLabel.textContent = rbtiCode;
        personaBadge.classList.add("active");
        paCode.textContent = rbtiCode;
        paLabel.textContent = deriveAxisLabel(rbtiCode) + " 성향으로 답해요";
        personaActive.hidden = false;
      } else {
        personaLabel.textContent = "독서 성향";
        personaBadge.classList.remove("active");
        personaActive.hidden = true;
      }
    }

    // 팝오버 내부(축 버튼·코드 프리뷰·적용 버튼 상태)를 pendingSel 기준으로 다시 그린다.
    function renderPopover() {
      ppAxes.textContent = "";
      RBTI_AXES.forEach((axis, i) => {
        const wrap = document.createElement("div");
        wrap.className = "pp-axis";
        const label = document.createElement("div");
        label.className = "pp-axis-label";
        label.textContent = (i + 1) + ". " + axis.label;
        const opts = document.createElement("div");
        opts.className = "pp-opts";
        for (const opt of axis.options) {
          const btn = document.createElement("button");
          btn.className = "pp-opt" + (pendingSel[axis.key] === opt.code ? " sel" : "");
          const ot = document.createElement("span");
          ot.className = "ot";
          // 버튼의 대표 단어는 정본 라벨(short = persona.py AXIS_VALUE_LABELS_KO와 같은 단어)을
          // 쓴다 — 에이전트는 "선택"이라 부르는데 UI만 "발췌·탐색"이라 어긋났던 지적 반영.
          ot.textContent = opt.code + " · " + opt.short;
          const od = document.createElement("span");
          od.className = "od";
          od.textContent = opt.title + " — " + opt.desc;
          btn.append(ot, od);
          btn.addEventListener("click", () => {
            pendingSel[axis.key] = opt.code;
            renderPopover();
          });
          opts.append(btn);
        }
        wrap.append(label, opts);
        ppAxes.appendChild(wrap);
      });
      const code = deriveCode(pendingSel);
      if (code) {
        ppCode.textContent = code.split("").join(" ");
        ppCode.classList.remove("partial");
        ppCodeLabel.textContent = deriveAxisLabel(code); // 예: 선택-공감-넓이-재미
      } else {
        // 선택된 축은 글자, 미선택 축은 · 로 표시.
        ppCode.textContent = RBTI_AXES.map((a) => pendingSel[a.key] || "·").join(" ");
        ppCode.classList.add("partial");
        ppCodeLabel.textContent = "";
      }
      ppApply.disabled = !code;
    }

    function openPopover() {
      pendingSel = parseRbtiCode(rbtiCode) || {};
      renderPopover();
      personaPop.hidden = false;
      personaBackdrop.hidden = false;
      personaBadge.setAttribute("aria-expanded", "true");
    }

    function closePopover() {
      personaPop.hidden = true;
      personaBackdrop.hidden = true;
      personaBadge.setAttribute("aria-expanded", "false");
    }

    function applyPersona() {
      const code = deriveCode(pendingSel);
      if (!code) return;
      rbtiCode = code;
      try { localStorage.setItem(RBTI_STORAGE_KEY, code); } catch (e) {}
      updateBadge();
      closePopover();
    }

    function clearPersona() {
      rbtiCode = null;
      pendingSel = {};
      try { localStorage.removeItem(RBTI_STORAGE_KEY); } catch (e) {}
      updateBadge();
      closePopover();
    }

    personaBadge.addEventListener("click", () => {
      if (personaPop.hidden) openPopover(); else closePopover();
    });
    personaBackdrop.addEventListener("click", closePopover);
    ppApply.addEventListener("click", applyPersona);
    ppClear.addEventListener("click", clearPersona);
    paClear.addEventListener("click", clearPersona); // 알림줄에서 바로 해제
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !personaPop.hidden) closePopover();
    });

    // 새로고침·새 대화에도 유지: localStorage에서 복원.
    try {
      const saved = localStorage.getItem(RBTI_STORAGE_KEY);
      if (parseRbtiCode(saved)) rbtiCode = saved;
    } catch (e) {}
    updateBadge();

    function renderChipsInto(target) {
      target.textContent = "";
      for (const ex of EXAMPLES) {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.textContent = ex;
        chip.addEventListener("click", () => { if (!sending) submit(ex); });
        target.appendChild(chip);
      }
    }

    // ── 랜딩 ↔ 대화 전환 ──
    // 랜딩 여부는 파생 상태다: "대화에 메시지가 있는가" 하나로만 판정하고 별도 플래그를 두지
    // 않는다. 덕분에 첫 전송이든, 세션 히스토리 복원이든, "새 대화"든 메시지를 넣고/비우고
    // syncLandingMode()만 부르면 레이아웃이 따라온다(경로별 분기 없음).
    function hasMessages() {
      return !!conversation.querySelector(".msg");
    }

    function ensureIntro() {
      if (document.getElementById("intro")) return;
      const intro = document.createElement("div");
      intro.className = "intro";
      intro.id = "intro";
      const big = document.createElement("div");
      big.className = "big";
      big.textContent = LANDING_GREETING;
      const sub = document.createElement("p");
      sub.textContent = LANDING_SUBTITLE;
      intro.append(big, sub);
      conversation.appendChild(intro);
    }

    function removeIntro() {
      const intro = document.getElementById("intro");
      if (intro) intro.remove();
    }

    // 전환 애니메이션의 기준점 — 레이아웃이 바뀌기 *전*의 컴포저 위치. 랜딩이 아니거나
    // 모션 민감 설정이면 null(= 애니메이션 없이 즉시 전환).
    function captureComposerTop() {
      if (!app.classList.contains("landing")) return null;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return null;
      return composer.getBoundingClientRect().top;
    }

    // fromTop이 있으면 클래스 교체로 생긴 위치 차만큼 컴포저를 역보정했다가 0으로 되돌려
    // 중앙 → 하단으로 미끄러지게 한다(FLIP). 레이아웃 애니메이션이라 transform만 쓴다.
    function syncLandingMode(fromTop) {
      const landing = !hasMessages();
      const changed = landing !== app.classList.contains("landing");
      app.classList.toggle("landing", landing);
      if (landing) ensureIntro(); else removeIntro();
      if (!changed || fromTop == null) return;
      const delta = fromTop - composer.getBoundingClientRect().top;
      if (!delta) return;
      composer.style.transition = "none";
      composer.style.transform = `translateY(${delta}px)`;
      void composer.offsetWidth; // 리플로우 강제 → 시작 상태 확정
      composer.style.transition = "";
      composer.style.transform = "";
    }

    // 오토스크롤 존중: 사용자가 위로 스크롤하면 자동추적을 끄고, 하단 근처로 돌아오면 다시 켠다.
    // 자동추적이 꺼진 동안엔 스트리밍이 뷰포트를 낚아채지 않아 위로 읽을 수 있고, "↓ 최신" 버튼이 뜬다.
    const SCROLL_FOLLOW_THRESHOLD_PX = 80; // 이 거리 이내로 하단에 붙어 있으면 자동추적 유지
    const jumpLatestBtn = document.getElementById("jump-latest");
    let autoFollow = true;

    function isNearBottom() {
      return conversation.scrollHeight - conversation.scrollTop - conversation.clientHeight
        <= SCROLL_FOLLOW_THRESHOLD_PX;
    }

    // force=true(사용자가 방금 메시지 전송 등)면 자동추적을 되켜고 무조건 하단으로 내린다.
    // 그 외엔 자동추적 중일 때만 따라 내려간다(위로 읽는 중이면 방해하지 않음).
    function scrollToBottom(force) {
      if (force) autoFollow = true;
      if (autoFollow) {
        conversation.scrollTop = conversation.scrollHeight;
        jumpLatestBtn.hidden = true;
      }
    }

    // 사용자 스크롤 → 하단 근접 여부로 자동추적 on/off, 버튼 표시 갱신. 프로그램적 스크롤도 이 핸들러를
    // 거치지만 하단 도달 시 near-bottom=true라 자동추적이 유지돼 자기간섭이 없다.
    conversation.addEventListener("scroll", () => {
      const near = isNearBottom();
      autoFollow = near;
      jumpLatestBtn.hidden = near;
    });

    // "↓ 최신" 클릭 — 부드럽게 하단으로(자연스러운 복귀). 자동추적 재개.
    jumpLatestBtn.addEventListener("click", () => {
      autoFollow = true;
      jumpLatestBtn.hidden = true;
      conversation.scrollTo({ top: conversation.scrollHeight, behavior: "smooth" });
    });

    function addUserMessage(text) {
      const msg = document.createElement("div");
      msg.className = "msg user";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      msg.appendChild(bubble);
      conversation.appendChild(msg);
      scrollToBottom(true); // 사용자가 방금 보냈으니 자동추적을 되켜고 하단으로 내린다.
    }

    // 어시스턴트 메시지 컨테이너를 만들고, 조작용 핸들 객체를 반환한다.
    function createAssistantMessage() {
      const msg = document.createElement("div");
      msg.className = "msg assistant";

      // 진행 흐름: 진행 단계 행과 본문 블록이 **도착 순서대로** 이 한 열에 쌓인다.
      const flow = document.createElement("div");
      flow.className = "flow";
      // aria-live는 .flow에 걸지 않는다. 이 컨테이너는 진행 단계와 **본문 블록**을 함께
      // 담으므로, 여기 걸면 토큰이 붙을 때마다 본문 전체가 반복 낭독된다(낭독 폭주).
      // 대신 진행 단계 행 각각에 건다 — 짧고 한 번만 바뀌는 텍스트라 안전하다.

      const sources = document.createElement("div");
      sources.className = "sources";
      const meta = document.createElement("div");
      meta.className = "meta";

      // 첫 델타 전 대기: 정적 "…" 대신 타이핑 인디케이터. 예전엔 본문 버블 안에 두고
      // renderBody의 textContent="" 가 **암묵적으로** 걷어냈는데, 본문이 여러 블록이 된
      // 지금은 그 결합이 성립하지 않는다 — 별도 요소로 두고 명시적으로 제거한다.
      const bubble = document.createElement("div");
      bubble.className = "bubble empty";
      const typing = document.createElement("span");
      typing.className = "typing";
      typing.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
      bubble.appendChild(typing);
      flow.appendChild(bubble);
      function clearTyping() {
        if (bubble.isConnected) bubble.remove();
      }

      // 출처 카드 줄과 메타는 흐름 **끝**에 온다(실제 도착 시점 = 검증 후와 일치).
      msg.append(flow, sources, meta);
      conversation.appendChild(msg);
      scrollToBottom();

      const cardMap = new Map();
      // 스트리밍 중 마커를 렌더하기 위한 최소 정보(id → url). status.refs로 도구 응답
      // 시점에 미리 온다. **카드가 아니다** — cardMap·sources DOM엔 절대 손대지 않는다.
      // 이 분리가 원칙 4(공개 source·done.sources는 최종 인용분만)를 지키는 구조다.
      const hintMap = new Map();
      // 본문 텍스트 블록들. 각 블록이 자기 rawText를 소유하고 독립 재렌더한다.
      // 턴의 rawText = 블록 텍스트의 연결이다(원칙 4b: delta 합계 == done.text).
      const blocks = [];
      let pendingSplit = false; // 마지막 델타 이후 진행 단계가 끼어들었는가
      // 이 턴이 본 출처의 원본 페이로드(id → src). 대화 스냅샷 저장·복원의 재료다.
      const srcById = new Map();
      let citedList = [];      // finalize에서 확정된 인용 id(스냅샷용)
      let elapsedSaved = 0;    // 응답 소요(초) — 스냅샷 복원 시 요약에 재사용
      let modelSaved = "";      // 최종 public model — 스냅샷 복원 시 같은 메타를 표시
      let errorText = "";      // 오류로 끝난 턴의 안내 문구(스냅샷용)
      let firstDelta = false;
      let errored = false;
      let activeStep = null;   // 현재 진행 중(스핀) 단계 요소
      let lastStepKey = null;  // 직전 단계 키(연속 중복 방지)

      // 직전 단계를 완료 처리(스핀 정지 → 체크 아이콘).
      function completeActiveStep() {
        if (!activeStep) return;
        activeStep.classList.remove("active");
        activeStep.classList.add("done");
        const ico = activeStep.querySelector(".ico");
        if (ico) ico.textContent = "✓";
        activeStep = null;
      }

      function highlightSource(id) {
        const card = cardMap.get(String(id));
        if (!card) return;
        card.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
        card.classList.remove("flash");
        void card.offsetWidth; // 리플로우 강제 → 애니메이션 재시작
        card.classList.add("flash");
      }

      // 마커 승격 조건 = "이번 턴에 실재하는 출처 id". 검증 후 카드(cardMap)뿐 아니라
      // 도구 응답 시점의 힌트(hintMap)도 인정한다 — 이게 스트리밍 중 [1]이 생 대괄호로
      // 남아 있다가 done 이후에야 칩이 되던 어색함의 해소다. 검증에서 탈락한 마커는
      // 백엔드가 done.text에서 지우므로 링크째 사라진다(잘못된 링크가 남지 않는다).
      const markerOpts = {
        isCitation: (sid) => cardMap.has(String(sid)) || hintMap.has(String(sid)),
        onMarker: highlightSource,
        // 위험 스킴 차단은 공용 모듈(isSafeUrl)이 소유한다 — md.js는 검증된 url만 받는다.
        // 최종 카드가 있으면 그 url이 정본(힌트 url은 후속 라운드에 갱신될 수 있다).
        citationUrl: (sid) => {
          const key = String(sid);
          const src = srcById.get(key);
          const url = (src && src.url) || hintMap.get(key) || "";
          return isSafeUrl(url) ? url : "";
        },
      };

      // 이 턴의 본문 = 블록 텍스트의 연결. 스냅샷·중지·finalize 대조가 모두 이 한 값을
      // 쓴다(판정을 여러 벌 두면 한 벌만 고치는 실수가 반복된다 — 백엔드 _emit_final_body와
      // 같은 규율). 정상 턴에서 이 값은 delta 합계와 같고, 곧 done.text와 같다(원칙 4b).
      function bodyText() {
        return blocks.map((b) => b.text).join("");
      }

      // 본문 렌더 = 공용 모듈(md.js). 블록 하나를 자기 텍스트로 다시 그린다.
      function renderBlock(block) {
        renderMarkdown(block.el, block.text, markerOpts);
      }
      function renderAll() {
        blocks.forEach(renderBlock);
      }

      // 새 본문 블록을 흐름 끝에 만든다.
      function pushBlock() {
        const el = document.createElement("div");
        el.className = "bubble";
        flow.appendChild(el);
        const block = { el, text: "" };
        blocks.push(block);
        return block;
      }

      // 델타를 받을 블록을 고른다. **문단 경계에서만** 새 블록을 연다 — 표(연속 파이프
      // 라인)·코드펜스(여닫이)가 블록 경계에 걸리면 md.js의 라인 스캐너가 양쪽에서 깨지기
      // 때문이다(닫히지 않은 펜스는 다음 블록 전체를 <pre>에 가둔다). 문단 중간에 진행
      // 단계가 끼어들면 분할하지 않고 현재 블록에 계속 이어 붙인다 — 케이스 분기가 아니라
      // 구조 규칙이고, 백엔드가 도구 호출 앞에 "\n\n"을 넣으므로 예고 경계는 항상 만족한다.
      function blockForDelta() {
        const cur = blocks[blocks.length - 1];
        if (!cur) return pushBlock();
        if (pendingSplit && (!cur.text || /\n\s*\n\s*$/.test(cur.text))) return pushBlock();
        return cur;
      }

      function makeCard(src) {
        const isWeb = WEB_TYPES.has(src.type);
        const card = document.createElement("div");
        card.className = isWeb ? "card web" : "card";

        // 좌측 표지 썸네일(있을 때만). matrix 셀과 같은 결: decoding=async, loading=lazy 금지
        // (스크롤 없는 뷰포트에서 lazy가 로드를 멈추는 Chrome 쿼크 — matrix-ux 실측), 실패 시
        // 이미지를 제거해 깨진 아이콘 대신 본문만 남긴다. 없으면 현행 그대로(표지 없음).
        const url = coverUrl(src);
        if (url) {
          const cover = document.createElement("img");
          cover.className = "cover";
          cover.decoding = "async";
          cover.alt = "";
          cover.addEventListener("error", () => cover.remove());
          card.appendChild(cover);
          cover.src = url; // 핸들러 등록 후 src 설정
        }

        const main = document.createElement("div");
        main.className = "card-main";
        const top = document.createElement("div");
        top.className = "top";
        const num = document.createElement("span");
        num.className = "num";
        num.textContent = src.id;
        const type = document.createElement("span");
        type.className = "type";
        type.textContent = TYPE_LABEL[src.type] || "검색결과";
        top.append(num, type);
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = src.title || "(제목 없음)";
        main.append(top, title);
        // 상품 카드(비웹)엔 저자·가격을 노출한다. 데이터가 오는 형태가 둘이라 관대하게 읽는다:
        // 신규 공개 DTO는 author/price 평면 필드이고, 아래 fallback은 기존 스냅샷 호환 경로다.
        // 값이 없으면 placeholder 없이 그 줄을 생략한다.
        if (!isWeb) {
          const author = src.author || src.snippet;
          const priceRaw = (src.price != null) ? src.price : (src.meta && src.meta.price);
          if (author) {
            const au = document.createElement("div");
            au.className = "info author";
            au.textContent = author;
            main.append(au);
          }
          if (priceRaw != null && priceRaw !== "") {
            const pr = document.createElement("div");
            pr.className = "info price";
            // 숫자면 천단위 콤마+원, 이미 문자열이면 그대로(도구가 문자열 가격을 줄 여지 대비).
            const n = Number(priceRaw);
            pr.textContent = Number.isFinite(n) && n > 0
              ? n.toLocaleString("ko-KR") + "원"
              : String(priceRaw);
            main.append(pr);
          }
        }
        card.appendChild(main);
        // 위험 스킴(javascript:) 차단은 공용 모듈(isSafeUrl/safeOpen)이 소유한다.
        if (isSafeUrl(src.url)) {
          const open = () => safeOpen(src.url);
          // 클릭 가능한 것은 키보드로도 갈 수 있어야 한다(matrix 셀과 동일 계약).
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.addEventListener("click", open);
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
          });
        }
        return card;
      }

      function sourceSnapshot(src) {
        const fields = [
          "id", "title", "url", "type", "author", "price", "image_url", "rating",
          "publisher", "published_at", "last_updated", "checked_at"
        ];
        return Object.fromEntries(
          fields.filter((field) => src[field] !== undefined).map((field) => [field, src[field]])
        );
      }

      // 본문 전체를 done.text 한 덩어리로 다시 그린다. reset(인용 검증이 본문을 바꿈)과
      // finalize(정본 교체)가 **같은 코드**를 쓴다 — reset은 정본이 빈 특수 케이스일 뿐이다.
      function replaceBody(text) {
        blocks.splice(0).forEach((b) => b.el.remove());
        pendingSplit = false;
        if (!text) { firstDelta = false; return; }
        const block = pushBlock();
        block.text = text;
        renderBlock(block);
      }

      return {
        setStatus(stage, detail, refs) {
          // 마커 렌더용 힌트를 먼저 흡수한다. 나중 관측이 정본이다(같은 id의 url이 후속
          // 라운드에 갱신될 수 있다). **카드는 만들지 않는다** — 검증 전 노출 금지선.
          if (Array.isArray(refs)) {
            for (const ref of refs) {
              if (ref && ref.id != null) hintMap.set(String(ref.id), ref.url || "");
            }
            // 이미 흘러간 [n]들을 즉시 칩·링크로 승격시킨다. 힌트 도착 후 델타가 더 오지
            // 않는 경우가 있어 재렌더를 델타에 미룰 수 없다(1회성이라 비용도 여기서 끝난다).
            if (blocks.length) renderAll();
          }
          // 문구가 없으면 보여 줄 단계가 없다(refs만 실은 프레임). 백엔드가 "설명할 진행이
          // 없으면 말하지 않는다"를 기본값으로 두는 것과 같은 규칙의 렌더 쪽 절반이다.
          if (!detail) return;
          // 연속 동일 단계는 중복 추가하지 않는다(같은 도구가 상태만 반복 전송하는 경우).
          // 같은 stage|detail 연속 중복은 접되, found는 제외한다 — 같은 건수를 두 번
          // 찾은 것은 실제로 두 번 일어난 일이라 접으면 단계가 사라진다.
          const key = stage === "found" ? Symbol() : stage + "|" + detail;
          if (key === lastStepKey) return;
          lastStepKey = key;
          // 직전 단계를 완료로 마감하고 새 단계를 흐름에 누적한다(덮어쓰지 않음).
          completeActiveStep();
          const step = document.createElement("div");
          step.className = "step active";
          const ico = document.createElement("span");
          ico.className = "ico";
          ico.textContent = STATUS_ICON[stage] || "•";
          const label = document.createElement("span");
          label.className = "step-label";
          // 진행 단계만 조용히 낭독한다. 짧고 한 번 쓰이면 바뀌지 않아 안전하다
          // (본문 블록에 걸면 토큰마다 전체가 다시 읽힌다).
          label.setAttribute("aria-live", "polite");
          label.textContent = detail;
          step.append(ico, label);
          flow.appendChild(step);
          activeStep = step;
          // 다음 델타는 (문단 경계라면) 이 단계 **아래**의 새 블록에서 이어진다.
          pendingSplit = true;
          scrollToBottom();
        },
        addSource(src) {
          srcById.set(String(src.id), src);
          if (cardMap.has(String(src.id))) return;
          const card = makeCard(src);
          cardMap.set(String(src.id), card);
          sources.appendChild(card);
          scrollToBottom();
        },
        appendDelta(chunk) {
          if (!firstDelta) {
            firstDelta = true;
            clearTyping();
            // 답변 스트리밍 시작 → 진행 중 단계를 완료 처리한다.
            completeActiveStep();
          }
          const block = blockForDelta();
          pendingSplit = false;
          block.text += chunk;
          renderBlock(block);
          scrollToBottom();
        },
        // 백엔드 reset: 흘린 본문을 비우고 정본을 다시 받는다(인용 검증이 본문을 바꾼 경우).
        // 힌트(hintMap)는 **보존한다** — 비우면 재렌더된 본문의 마커가 다시 생 대괄호가 된다.
        resetBody() {
          replaceBody("");
        },
        finalize(payload, elapsedSec) {
          // error로 끝난 턴이면(백엔드가 error 뒤 done을 함께 보냄) 빨간 안내 말풍선을
          // 그대로 두고 "응답 X초" meta를 붙이지 않는다.
          if (errored) return;
          clearTyping();
          // done.text(검증본)로 본문을 교체한다. 이미 같은 텍스트면 다시 그리지 않는다 —
          // 무조건 재렌더는 DOM을 통째로 갈아 스크롤·애니메이션이 튀게 만든다(정상 턴은
          // delta 합계 == done.text라 이 가드가 대부분의 턴에서 재렌더를 없앤다).
          if (typeof payload.text === "string" && payload.text.length
              && payload.text !== bodyText()) {
            replaceBody(payload.text);
          }
          // 출처칩은 최종 답에서 실제로 인용된 출처만 받는다.
          const citedIds = new Set(
            (Array.isArray(payload.cited_ids) ? payload.cited_ids : []).map(String)
          );
          // done.sources로 누락 카드를 보강한다.
          const finalSources = Array.isArray(payload.sources) ? payload.sources : [];
          let gainedId = false;
          for (const src of finalSources) {
            const key = String(src.id);
            if (!cardMap.has(key)) {
              const card = makeCard(src);
              cardMap.set(key, card);
              sources.appendChild(card);
            }
            // 힌트로 못 봤던 id라면 그 마커는 아직 평문이다 — 본문을 한 번 더 그린다.
            if (!hintMap.has(key)) gainedId = true;
            srcById.set(key, src);
            citedIds.add(key);
          }
          if (gainedId) renderAll();
          citedList = [...citedIds];   // 스냅샷 저장용(복원 시 강조 재현)
          elapsedSaved = elapsedSec;
          modelSaved = typeof payload.model === "string" ? payload.model : "";
          // 인용 카드를 강조한다.
          for (const [id, card] of cardMap) {
            card.classList.toggle("cited", citedIds.has(id));
          }
          // 흐름 끝에 마감 메타 한 줄(소요·모델·출처 수). 진행 단계는 접지 않고 그대로
          // 남긴다 — 이미 읽고 지나간 줄이 사라지면 아래 본문이 위로 점프한다.
          completeActiveStep();
          const stepCount = flow.querySelectorAll(".step").length;
          // 출처 0인 턴(파라메트릭 즉답)은 "N단계 탐색"이 근거 있는 검색처럼 읽히는 착시를
          // 만든다 — 중립 표기("응답 X초")로만 적는다. 출처가 있을 때만 탐색·출처 요약.
          if (cardMap.size) {
            const parts = [];
            if (stepCount) parts.push(`${stepCount}단계 탐색`);
            parts.push(`출처 ${cardMap.size}개`);
            parts.push(`${elapsedSec.toFixed(1)}초`);
            if (modelSaved) parts.push(`모델 ${modelSaved}`);
            meta.textContent = "🔍 " + parts.join(" · ");
          } else {
            const parts = [`응답 ${elapsedSec.toFixed(1)}초`];
            if (modelSaved) parts.push(`모델 ${modelSaved}`);
            meta.textContent = parts.join(" · ");
          }
          scrollToBottom();
        },
        showError(message) {
          errored = true;
          errorText = message || "오류가 발생했어요.";
          completeActiveStep();
          clearTyping();
          meta.textContent = "⚠️ 오류로 중단됨";
          const box = document.createElement("div");
          box.className = "bubble error";
          box.textContent = errorText;
          flow.appendChild(box);
          scrollToBottom();
        },
        markStopped() {
          // 중지는 파괴가 아니다 — 이미 스트리밍된 본문은 사용자가 읽고 있던 답이라 지우지
          // 않고 메타만 "중지됨"으로 적는다. 한 글자도 못 받았을 때만 안내로 대체한다.
          if (!bodyText()) { this.showError("응답을 중지했어요."); return; }
          completeActiveStep();
          clearTyping();
          meta.textContent = "⏹ 중지됨";
          scrollToBottom();
        },
        markEmptyIfUntouched() {
          // 에러 말풍선은 그대로 둔다(안내 문구를 덮어쓰지 않는다).
          if (!bodyText() && !errored) {
            clearTyping();
            const box = document.createElement("div");
            box.className = "bubble empty";
            box.textContent = "(응답이 없었어요)";
            flow.appendChild(box);
          }
        },
        // 이 턴을 스냅샷 한 조각으로 — 복원은 addSource + finalize를 그대로 다시 태운다
        // (라이브와 복원이 같은 렌더 경로). 본문도 오류도 없으면 저장할 게 없다(null).
        toSnapshot() {
          if (errored) return { role: "assistant", error: errorText };
          const text = bodyText();
          if (!text) return null;
          return {
            role: "assistant",
            text,
            sources: [...srcById.values()].map(sourceSnapshot),
            cited_ids: citedList,
            elapsed: elapsedSaved,
            model: modelSaved,
          };
        },
      };
    }

    // ── 대화 스냅샷(재방문 복원) ──
    // 불변식: **서버 세션이 살아 있으면 그 대화가 화면에도 있다.** 이전엔 새로고침·매트릭스
    // 왕복 시 session_id만 남고 대화 DOM은 비어, 화면은 새 대화인데 서버는 옛 맥락을 기억하는
    // 불일치가 났다(핸드오프 경로만 세션을 리셋한 건 한 경로짜리 사례 패치였다). 이제 두 축을
    // 함께 유지한다: 턴이 끝날 때마다 스냅샷을 저장하고, 부팅 시 세션이 있으면 복원한다.
    // 반대편도 닫는다 — 세션 없이 남은 기록은 이어질 대화가 없으므로 버린다.
    // 매트릭스(yes24_matrix_snapshot)와 같은 저장소·같은 방식.
    const CHAT_TRANSCRIPT_KEY = "yes24_chat_transcript";
    let transcript = [];

    function saveTranscript() {
      try {
        if (transcript.length) sessionStorage.setItem(CHAT_TRANSCRIPT_KEY, JSON.stringify(transcript));
        else sessionStorage.removeItem(CHAT_TRANSCRIPT_KEY);
      } catch (e) { /* 저장 실패(용량 등)는 복원만 포기 — 진행 중 대화엔 영향 없음 */ }
    }
    function clearTranscript() {
      transcript = [];
      try { sessionStorage.removeItem(CHAT_TRANSCRIPT_KEY); } catch (e) {}
    }
    function restoreTranscript() {
      let saved = null;
      try { saved = JSON.parse(sessionStorage.getItem(CHAT_TRANSCRIPT_KEY) || "null"); } catch (e) {}
      if (!Array.isArray(saved) || !saved.length) return;
      if (!sessionId) { clearTranscript(); return; } // 이어질 세션이 없는 기록은 폐기
      transcript = saved;
      for (const turn of transcript) {
        if (turn.role === "user") { addUserMessage(turn.text || ""); continue; }
        const asst = createAssistantMessage();
        if (turn.error) {
          asst.showError(turn.error);
        } else {
          (Array.isArray(turn.sources) ? turn.sources : []).forEach((s) => asst.addSource(s));
          asst.finalize(
            {
              text: turn.text || "",
              cited_ids: turn.cited_ids || [],
              model: turn.model || "",
            },
            turn.elapsed || 0
          );
        }
      }
    }

    // 전송 버튼 상태: 전송 중이거나 입력이 비면 비활성(보낼 게 없을 때 활성처럼 보이지 않게).
    // textarea 자동 성장 상한의 단일 출처 = CSS 변수(--composer-max-h). JS가 그 값을 읽어 쓴다
    // (두 곳에 140을 적어 두면 한쪽만 바뀌어 스크롤이 어긋난다).
    function composerMaxHeight() {
      const v = getComputedStyle(document.documentElement).getPropertyValue("--composer-max-h");
      return parseFloat(v) || 0;
    }

    function updateSendState() {
      sendBtn.disabled = sending || input.value.trim() === "";
    }

    function setSending(on) {
      sending = on;
      stopBtn.disabled = !on;
      input.disabled = on;
      updateSendState();
      if (!on) input.focus();
    }

    async function submit(text) {
      const message = (text !== undefined ? text : input.value).trim();
      if (!message || sending) return;

      // 첫 메시지가 붙는 순간 랜딩 조건(메시지 0)이 깨진다 — 컴포저는 중앙에서 하단으로.
      const composerTop = captureComposerTop();
      addUserMessage(message);
      transcript.push({ role: "user", text: message });
      syncLandingMode(composerTop);
      input.value = "";
      input.style.height = "auto";

      const asst = createAssistantMessage();
      // 진행 라벨 문구는 서버가 정한다(event_translate.TURN_START_STATUS). 여기서 같은
      // 문자열을 또 만들면 한쪽만 바뀔 때 라벨이 두 번 뜬다 — 제출 직후의 즉시 반응은
      // 타이핑 인디케이터가 이미 담당한다.
      setSending(true);

      controller = new AbortController();
      const started = performance.now();

      try {
        // 페르소나 미선택(rbtiCode=null) 시 rbti 필드를 아예 싣지 않아 기존 UX 100% 무변.
        const payload = { message, session_id: sessionId };
        if (rbtiCode) payload.rbti = rbtiCode;
        const resp = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal,
        });
        await readEventStream(resp, (event, data) => {
          if (event === "status") {
            asst.setStatus(data.stage, data.detail, data.refs);
          } else if (event === "source") {
            asst.addSource(data);
          } else if (event === "delta") {
            asst.appendDelta(data.text || "");
          } else if (event === "reset") {
            asst.resetBody();
          } else if (event === "done") {
            if (data.session_id) {
              sessionId = data.session_id;
              try { sessionStorage.setItem(CHAT_SESSION_KEY, sessionId); } catch (e) {}
            }
            asst.finalize(data, (performance.now() - started) / 1000);
          } else if (event === "error") {
            asst.showError(data.message);
          }
        });
        asst.markEmptyIfUntouched();
      } catch (err) {
        if (err && err.name === "AbortError") {
          asst.markStopped(); // 스트리밍된 본문은 보존(중지는 파괴가 아니다)
        } else {
          asst.showError("연결에 문제가 있었어요. 잠시 후 다시 시도해 주세요.");
        }
      } finally {
        controller = null;
        setSending(false);
        // 턴이 끝날 때마다 화면=세션 불변식을 스토리지에 반영한다(성공·중지·오류 모두).
        const turn = asst.toSnapshot();
        if (turn) transcript.push(turn);
        saveTranscript();
      }
    }

    sendBtn.addEventListener("click", () => submit());
    stopBtn.addEventListener("click", () => { if (controller) controller.abort(); });
    newChatBtn.addEventListener("click", () => {
      if (sending && controller) controller.abort();
      sessionId = null;
      try { sessionStorage.removeItem(CHAT_SESSION_KEY); } catch (e) {}
      clearTranscript(); // 세션과 기록은 함께 산다·함께 죽는다(화면=세션 불변식)
      conversation.textContent = "";
      syncLandingMode(null); // 메시지 0 → 랜딩 복귀(인사 + 중앙 컴포저). 애니메이션 없음.
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submit();
      }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, composerMaxHeight()) + "px";
      updateSendState();
    });

    // 컴포저 밖에서 타이핑 시작 → 포커스만 컴포저로 옮기고 글자 삽입은 브라우저 기본 동작에
    // 맡긴다. 문자를 직접 삽입하는 릴레이는 공백·문장부호·Enter·한글 IME 조합을 흘리므로 금지.
    // Enter·화살표 등 비프린터블은 릴레이하지 않는다(포커스된 버튼의 기본 동작 보존).
    function isEditableTarget(el) {
      return !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
    }
    document.addEventListener("keydown", (e) => {
      if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
      if (isEditableTarget(e.target)) return;
      if (!personaPop.hidden) return; // 팝오버 열림 — 팝오버 키 조작 우선
      if (input.disabled) return;     // 전송 중
      // 프린터블 1글자(공백·문장부호 포함) 또는 IME 조합 키(한글 첫 타, e.key="Process").
      if (e.key.length === 1 || e.key === "Process") input.focus();
    });

    // 매트릭스 "이 성향으로 채팅하기" 핸드오프: 채택한 셀의 {질문, 답변 요지(대표책)}를
    // 컴포저에 *보이는* 프리필로 얹는다 — 숨은 컨텍스트 주입 금지(사용자가 보는 것 = 모델이
    // 받는 것). 1회성: 읽는 즉시 제거해 새로고침 시 반복 프리필을 막는다.
    // 프리필은 진술문이 아니라 '요청문'으로 — 그대로 전송해도 에이전트가 되묻지 않고 한 턴에
    // 완결되게(진술형 "…추천을 받았어요."는 되물어 한 턴 낭비 실측). 사용자가 보고 수정 가능.
    // 저장 키는 공용 모듈(rbti.js)이 단일 출처 — 매트릭스와 계약.
    (function applyMatrixHandoff() {
      let handoff = null;
      try {
        const raw = localStorage.getItem(MATRIX_HANDOFF_KEY);
        if (raw) { handoff = JSON.parse(raw); localStorage.removeItem(MATRIX_HANDOFF_KEY); }
      } catch (e) {}
      if (!handoff || !handoff.question) return;
      // 핸드오프 = 이 성향으로 '새 대화' 시작. UI는 빈 대화인데 sessionStorage에 직전 채팅
      // session_id가 남아 있으면 백엔드가 이전 대화를 기억해 새 질문에 옛 맥락이 누출된다
      // (UI는 빈 화면인데 세션은 옛것 — 상태 불일치). 진입 시 세션을 리셋해 다음 전송에서 서버가
      // 새 session_id를 발급하도록 한다('새 대화' 버튼과 동일 의미). 성향 배지·프리필은 유지.
      sessionId = null;
      try { sessionStorage.removeItem(CHAT_SESSION_KEY); } catch (e) {}
      const persona = handoff.code ? handoff.code + " 성향" : "이 성향";
      input.value = handoff.pick
        ? "방금 \"" + handoff.question + "\" 질문에 " + persona + "으로 『" + handoff.pick +
          "』을 추천받았어요. 이 취향에 맞는 책을 더 추천해줘."
        : "\"" + handoff.question + "\"에 대해 " + persona + " 관점으로 이어서 답해줘.";
      input.setSelectionRange(input.value.length, input.value.length); // 이어서 바로 타이핑/수정
      input.dispatchEvent(new Event("input")); // 높이·전송버튼 상태 갱신
    })();

    renderChipsInto(chipsEl);
    // 재방문 복원: 세션이 살아 있으면 그 대화를 화면에 되살린다. 핸드오프(위)는 세션을 비우므로
    // 여기서 옛 기록이 폐기돼 "새 대화 + 프리필"이 된다 — 경로별 분기 없이 불변식이 처리한다.
    restoreTranscript();
    // 초기 레이아웃 확정: 메시지가 없으면 랜딩(인사 + 중앙 컴포저), 위에서 복원된 메시지가
    // 있으면 랜딩을 건너뛰고 하단 컴포저 대화 상태로 그대로 간다.
    syncLandingMode(null);
    input.focus();
    updateSendState(); // 초기: 입력이 비어 있으니 전송 비활성
  </script>
</body>
</html>
