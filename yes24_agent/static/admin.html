<!doctype html>
<html lang="ko">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>yes24-agent · 어드민</title>
<link rel="stylesheet" href="/static/lib/admin.css" />

<div class="app">
  <!-- 인증 전: 로그인 게이트만 보인다(데이터 요청은 세션 쿠키 없이는 401). -->
  <form class="gate" id="gate" hidden>
    <h1>통합 어드민</h1>
    <input id="username" aria-label="계정명" placeholder="계정명" required autocomplete="username" autocapitalize="none" />
    <input type="password" id="password" aria-label="비밀번호" placeholder="비밀번호" required autocomplete="current-password" />
    <button class="primary" type="submit">로그인</button>
    <div class="error" id="gate-error" hidden></div>
  </form>

  <header hidden id="header">
    <div>
      <h1>통합 어드민</h1>
      <div class="sub" id="last-activity"></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="toolbar" id="toolbar" aria-label="관리 메뉴" hidden>
    <button id="tab-dashboard" aria-pressed="true">대시보드</button>
    <button id="tab-data" aria-pressed="false">데이터 탐색</button>
    <button id="tab-sessions" aria-pressed="false">대화</button>
    <button id="tab-admins" aria-pressed="false" hidden>관리자</button>
    <span class="account" id="account"></span>
    <button id="password-change">비밀번호 변경</button>
    <button id="refresh">새로고침</button>
    <button id="logout">로그아웃</button>
  </nav>
  <div class="error notice" id="app-error" role="alert" hidden></div>
  <main hidden id="main">
    <section class="workspace-pane" id="dashboard-pane">
      <div class="workspace-head"><h2>운영 대시보드</h2><p>비용·대화 품질·사용 시간대를 함께 확인합니다. 모든 기간과 시각은 UTC 기준입니다.</p></div>
      <form id="dashboard-filters" class="analysis-filters">
        <label>시작일 (UTC)<input id="dashboard-since" type="date" required /></label>
        <label>종료일 (UTC)<input id="dashboard-until" type="date" required /></label>
        <span class="presets" role="group" aria-label="기간 빠른 선택"><button type="button" data-days="7">7일</button><button type="button" data-days="30">30일</button><button type="button" data-days="90">90일</button></span>
        <label>앱<select id="dashboard-app"><option value="">전체 앱</option></select></label>
        <button class="primary" type="submit">조회</button>
      </form>
      <div id="dashboard" class="dashboard-content" aria-live="polite"></div>
    </section>
    <section class="workspace-pane" id="data-pane" hidden>
      <div class="workspace-head"><h2>데이터 탐색</h2><p>원본 기록을 조회합니다. 행을 선택하면 전체 필드를 확인하고, 권한이 있으면 회원·초기 질문을 편집할 수 있습니다.</p></div>
      <form id="data-filters" class="analysis-filters">
        <label>데이터<select id="dataset"></select></label>
        <label>검색<input id="data-q" placeholder="검색어" /></label>
        <label>시작일 (UTC)<input id="data-since" type="date" /></label>
        <label>종료일 (UTC)<input id="data-until" type="date" /></label>
        <label>정렬<select id="data-sort"></select></label>
        <label>순서<select id="data-direction"><option value="desc">내림차순</option><option value="asc">오름차순</option></select></label>
        <label id="data-status-label">상태<select id="data-status"></select></label>
        <label id="data-app-label">앱<select id="data-app"><option value="">전체 앱</option></select></label>
        <label id="data-null-label" hidden>종료 상태<select id="data-status-null"><option value="">전체</option><option value="true">미기록 (NULL)</option></select></label>
        <span class="exact-filters" id="data-exact"></span>
        <button class="primary" type="submit">검색</button><button type="reset">초기화</button>
      </form>
      <div class="saved-queries">
        <label>저장된 조회<select id="saved-query"><option value="">선택하세요</option></select></label>
        <button id="saved-load">불러오기</button><button id="saved-delete">삭제</button>
        <label>조회 이름<input id="saved-name" placeholder="이 브라우저에 저장할 이름" /></label><button id="saved-save">적용 조건 저장·덮어쓰기</button>
        <span id="saved-status" role="status">검색 조건만 이 브라우저에 저장합니다.</span>
      </div>
      <div class="data-actions"><span id="data-description"></span><span id="data-tools"></span><button id="csv" disabled>현재 페이지 CSV</button><button id="csv-all" disabled>조건 전체 CSV</button><button id="csv-cancel" hidden>다운로드 취소</button></div>
      <p id="export-status" class="analysis-note" role="status"></p>
      <div id="data" aria-live="polite"></div>
      <div class="pager"><button id="data-prev">‹ 이전</button><span id="data-page-info"></span><button id="data-next">다음 ›</button></div>
    </section>
    <section class="workspace-pane" id="admins-pane" hidden>
      <div class="workspace-head"><h2>관리자 계정</h2><p>계정을 만들고 역할·활성 상태를 바꿉니다. 행을 선택하면 편집과 비밀번호 재설정을 할 수 있습니다.</p></div>
      <form id="admin-create" class="analysis-filters">
        <label>계정명<input id="admin-username" required autocomplete="off" autocapitalize="none" /></label>
        <label>초기 비밀번호<input id="admin-password" type="password" required autocomplete="new-password" /></label>
        <label>역할<select id="admin-role"></select></label>
        <button class="primary" type="submit">계정 생성</button>
      </form>
      <p id="admin-create-status" class="analysis-note" role="status"></p>
      <div id="admins" aria-live="polite"></div>
    </section>
    <section class="list-pane" id="list-pane" hidden>
      <form class="filters" id="filters">
        <input id="q" aria-label="대화 검색" placeholder="세션 id 또는 대화 내용 검색" />
        <div class="row">
          <input id="since" type="date" aria-label="시작일(갱신 시각 기준)" />
          <input id="until" type="date" aria-label="종료일(갱신 시각 기준)" />
          <button class="primary" type="submit">검색</button>
        </div>
        <button type="reset">검색 초기화</button>
      </form>
      <div class="sessions" id="sessions" aria-live="polite"></div>
      <div class="pager">
        <button id="prev">‹ 이전</button>
        <span id="page-info"></span>
        <button id="next">다음 ›</button>
      </div>
    </section>
    <section class="detail-pane" id="detail" hidden>
      <div class="placeholder">목록에서 대화를 선택하세요.</div>
    </section>
  </main>
</div>
<dialog id="record-dialog" aria-labelledby="record-title">
  <div class="dialog-head"><h2 id="record-title">기록 상세</h2><button id="record-conversation" hidden>대화 열기</button><button id="record-copy">JSON 복사</button><button id="record-close">닫기</button></div>
  <div id="record-actions"></div>
  <p id="copy-status" role="status"></p><pre id="record-json"></pre>
</dialog>

<!-- 정확 일치 필터 한 칸 — 데이터셋 메타데이터(exact_filters)의 키마다 복제한다. -->
<template id="exact-template"><label><span></span><input placeholder="정확히 일치하는 값" /></label></template>
<!-- 차트 SVG 뿌리 — admin_charts.js가 복제하고 네임스페이스를 여기서 파생한다(URL 리터럴 없이). -->
<template id="chart-template"><svg class="chart"></svg></template>

<script type="module" src="/static/lib/admin.js"></script>
</html>
