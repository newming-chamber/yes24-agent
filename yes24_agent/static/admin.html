<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>yes24-agent · 운영 데이터</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e5e5e8;
    --text: #1a1a1e;
    --muted: #8a8a92;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --web: #ea580c;
    --error-bg: #fee2e2;
    --error-text: #b91c1c;
    --radius: 10px;
    --gap: 14px;
    --list-w: 380px;      /* 세션 목록 열 너비 */
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  /* 페이지(body)는 스크롤하지 않는다 — 스크롤은 목록·상세 두 패널 내부 몫이다. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
      "Noto Sans KR", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }

  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: var(--gap);
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex: none;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }

  /* 개요 지표 줄 */
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 5px 10px;
    line-height: 1.3;
  }
  .stat b { display: block; font-size: 13px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 11px; }

  main { flex: 1; display: flex; min-height: 0; }

  /* 왼쪽: 세션 목록 (자체 스크롤러) */
  .list-pane {
    width: var(--list-w);
    flex: none;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--panel);
    min-height: 0;
  }
  .filters { padding: 10px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
  .filters .row { display: flex; gap: 8px; }
  input {
    font: inherit;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    width: 100%;
    box-sizing: border-box;
  }
  input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  button {
    font: inherit;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: var(--bg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }

  .sessions { flex: 1; overflow-y: auto; min-height: 0; }
  .session {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .session:hover { background: var(--bg); }
  .session[aria-selected="true"] { background: var(--accent-soft); }
  .session .preview {
    font-weight: 500;
    /* 미리보기는 두 줄까지만 — 목록의 행 높이를 고르게 유지한다. */
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .session .preview.empty { color: var(--muted); font-weight: 400; }
  .session .meta {
    color: var(--muted);
    font-size: 11px;
    margin-top: 4px;
    display: flex;
    gap: 8px;
    justify-content: space-between;
  }
  .session .sid { font-family: var(--mono); }

  .pager {
    display: flex; align-items: center; gap: 8px; justify-content: center;
    padding: 8px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px;
  }

  /* 오른쪽: 세션 상세 (자체 스크롤러) */
  .detail-pane { flex: 1; overflow-y: auto; min-height: 0; padding: 16px 20px; }
  .placeholder { color: var(--muted); text-align: center; margin-top: 15vh; }

  .detail-head { margin-bottom: var(--gap); }
  .detail-head h2 { font-size: 14px; margin: 0 0 6px; font-family: var(--mono); word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 9px;
  }

  .event {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .event.user { border-color: var(--accent); background: var(--accent-soft); }
  .event > .who {
    font-size: 11px; color: var(--muted); margin-bottom: 6px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .event .body { white-space: pre-wrap; word-break: break-word; }

  /* 도구 호출·결과는 접어 둔다 — 타임라인의 주인공은 대화 본문이다. */
  details.part { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }
  details.part > summary { cursor: pointer; font-size: 12px; color: var(--web); }
  details.part[data-kind="result"] > summary { color: var(--muted); }
  details.part pre {
    margin: 8px 0 0;
    font-family: var(--mono);
    font-size: 11.5px;
    background: var(--bg);
    border-radius: 8px;
    padding: 8px;
    /* 넓은 JSON은 이 박스 안에서만 가로 스크롤한다(페이지는 넘치지 않는다). */
    overflow-x: auto;
    max-height: 320px;
    overflow-y: auto;
  }
  .truncated { color: var(--error-text); font-size: 11px; }

  .sources { display: grid; gap: 6px; }
  .sources a { color: var(--accent); text-decoration: none; word-break: break-all; }
  .sources a:hover { text-decoration: underline; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }

  /* 로그인 게이트 */
  .gate { margin: auto; max-width: 300px; text-align: center; display: grid; gap: 10px; }
  .error { color: var(--error-text); background: var(--error-bg); border-radius: 8px; padding: 8px; }
  [hidden] { display: none !important; }
</style>

<div class="app">
  <!-- 인증 전: 비밀번호 게이트만 보인다(데이터 요청은 쿠키 없이는 401). -->
  <form class="gate" id="gate">
    <h1>운영 데이터 조회</h1>
    <input type="password" id="password" placeholder="admin 비밀번호" autocomplete="current-password" />
    <button class="primary" type="submit">열기</button>
    <div class="error" id="gate-error" hidden></div>
  </form>

  <header hidden id="header">
    <div>
      <h1>운영 데이터 조회</h1>
      <div class="sub" id="last-activity"></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <main hidden id="main">
    <section class="list-pane">
      <form class="filters" id="filters">
        <input id="q" placeholder="세션 id 또는 대화 내용 검색" />
        <div class="row">
          <input id="since" type="date" title="시작일(갱신 시각 기준)" />
          <input id="until" type="date" title="종료일(갱신 시각 기준)" />
          <button class="primary" type="submit">검색</button>
        </div>
      </form>
      <div class="sessions" id="sessions"></div>
      <div class="pager">
        <button id="prev">‹ 이전</button>
        <span id="page-info"></span>
        <button id="next">다음 ›</button>
      </div>
    </section>
    <section class="detail-pane" id="detail">
      <div class="placeholder">왼쪽에서 세션을 선택하세요.</div>
    </section>
  </main>
</div>

<script type="module">
  import { isSafeUrl } from "/static/lib/sources.js?v=1";

  const $ = (id) => document.getElementById(id);
  const state = { page: 0, total: 0, pageSize: 0, selected: null };

  /** 텍스트를 노드로 넣어 항상 이스케이프한다(대화 본문에 마크업이 섞여도 안전). */
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const num = (n) => (n ?? 0).toLocaleString('ko-KR');
  const bytes = (b) => {
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0, v = b || 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${v.toFixed(i ? 1 : 0)} ${units[i]}`;
  };
  /** epoch 초 → 로컬 시각 문자열. */
  const clock = (ts) => (ts ? new Date(ts * 1000).toLocaleString('ko-KR') : '');

  async function api(path) {
    const res = await fetch(path, { credentials: 'same-origin' });
    if (res.status === 401) { showGate(); throw new Error('unauthorized'); }
    if (!res.ok) throw new Error(`${res.status}`);
    return res.json();
  }

  function showGate(message) {
    $('gate').hidden = false;
    $('header').hidden = $('main').hidden = true;
    $('gate-error').hidden = !message;
    $('gate-error').textContent = message || '';
  }

  function showApp() {
    $('gate').hidden = true;
    $('header').hidden = $('main').hidden = false;
  }

  // ── 개요 ────────────────────────────────────────────────────────────────
  async function loadOverview() {
    const o = await api('/admin/api/overview');
    const apps = o.apps.map((a) => `${a.app_name} ${num(a.count)}`).join(' · ');
    const stats = [
      ['세션', num(o.sessions)],
      ['이벤트', num(o.events)],
      ['DB 크기', bytes(o.db_bytes)],
      ['앱', apps || '-'],
    ];
    $('stats').replaceChildren(...stats.map(([label, value]) => {
      const box = el('div', 'stat');
      box.append(el('b', null, value), el('span', null, label));
      return box;
    }));
    $('last-activity').textContent = o.last_activity ? `최근 활동 ${o.last_activity}` : '';
  }

  // ── 세션 목록 ───────────────────────────────────────────────────────────
  async function loadSessions() {
    const params = new URLSearchParams({
      q: $('q').value.trim(), since: $('since').value, until: $('until').value, page: state.page,
    });
    const data = await api(`/admin/api/sessions?${params}`);
    state.total = data.total;
    state.pageSize = data.page_size;

    $('sessions').replaceChildren(...data.items.map((s) => {
      const row = el('div', 'session');
      row.setAttribute('aria-selected', String(s.id === state.selected));
      row.onclick = () => selectSession(s.id);

      const preview = el('div', `preview${s.preview ? '' : ' empty'}`, s.preview || '(사용자 발화 없음)');
      const meta = el('div', 'meta');
      meta.append(el('span', 'sid', s.id.slice(0, 12)), el('span', null, `${num(s.event_count)} 이벤트 · ${s.update_time?.slice(0, 16) ?? ''}`));
      row.append(preview, meta);
      return row;
    }));

    if (!data.items.length) {
      $('sessions').replaceChildren(el('div', 'placeholder', '조건에 맞는 세션이 없습니다.'));
    }

    const pages = Math.max(1, Math.ceil(state.total / state.pageSize));
    $('page-info').textContent = `${state.page + 1} / ${pages} · 총 ${num(state.total)}건`;
    $('prev').disabled = state.page <= 0;
    $('next').disabled = state.page + 1 >= pages;
    $('sessions').scrollTop = 0;
  }

  // ── 세션 상세 ───────────────────────────────────────────────────────────
  function renderPart(part) {
    if (part.kind === 'text') {
      const body = el('div', 'body', part.text);
      return part.truncated ? [body, el('div', 'truncated', `… ${num(part.total_chars)}자 중 일부`)] : [body];
    }
    const box = el('details', 'part');
    box.dataset.kind = part.kind;
    const label = part.kind === 'call' ? '도구 호출' : '도구 결과';
    box.append(el('summary', null, `${label} · ${part.name}${part.truncated ? ` (${num(part.total_chars)}자 중 일부)` : ''}`));
    box.append(el('pre', null, part.text));
    return [box];
  }

  function renderEvent(ev) {
    const isUser = ev.author === 'user';
    const box = el('div', `event${isUser ? ' user' : ''}`);
    const who = el('div', 'who');
    who.append(el('span', null, ev.author));
    if (ev.model) who.append(el('span', null, ev.model));
    if (ev.total_tokens) who.append(el('span', null, `${num(ev.total_tokens)} tok`));
    if (ev.timestamp) who.append(el('span', null, clock(ev.timestamp)));
    box.append(who);
    if (ev.parse_error) box.append(el('div', 'truncated', '이벤트를 읽을 수 없습니다(JSON 파싱 실패).'));
    for (const part of ev.parts) box.append(...renderPart(part));
    return box;
  }

  async function selectSession(id) {
    state.selected = id;
    for (const row of $('sessions').children) {
      if (row.classList.contains('session')) row.setAttribute('aria-selected', String(false));
    }
    const d = await api(`/admin/api/sessions/${encodeURIComponent(id)}`);
    // 선택 표시는 응답 후 다시 칠한다(그 사이 목록이 바뀌었을 수 있다).
    for (const row of $('sessions').children) {
      const sid = row.querySelector?.('.sid')?.textContent;
      if (sid && id.startsWith(sid)) row.setAttribute('aria-selected', 'true');
    }

    const out = [];
    const head = el('div', 'detail-head');
    head.append(el('h2', null, d.session.id));
    const chips = el('div', 'chips');
    const m = d.metrics;
    chips.append(
      el('span', 'chip', `${d.session.app_name} / ${d.session.user_id}`),
      el('span', 'chip', `생성 ${d.session.create_time?.slice(0, 19) ?? ''}`),
      el('span', 'chip', `갱신 ${d.session.update_time?.slice(0, 19) ?? ''}`),
      el('span', 'chip', `${num(m.turns)}턴`),
    );
    if (m.avg_turn_seconds !== null) chips.append(el('span', 'chip', `턴당 평균 ${m.avg_turn_seconds}s`));
    for (const [name, count] of Object.entries(m.tool_counts)) {
      chips.append(el('span', 'chip', `${name} ×${count}`));
    }
    head.append(chips);
    out.push(head);

    if (d.truncated) out.push(el('div', 'truncated', '이벤트가 많아 앞부분만 표시합니다.'));
    out.push(el('h3', null, '대화 타임라인'));
    out.push(...d.events.map(renderEvent));

    if (d.sources.length) {
      out.push(el('h3', null, `인용 출처 ${d.sources.length}건`));
      const list = el('div', 'sources');
      for (const s of d.sources) {
        const line = el('div');
        const link = el('a', null, `[${s.id}] ${s.title || s.url}`);
        // 출처 URL은 웹 검색 결과에서 온 비신뢰 데이터다. scheme을 http/https로 한정하지 않으면
        // `javascript:` URI가 섞였을 때 운영자 클릭이 admin 오리진에서 스크립트를 실행한다.
        link.href = isSafeUrl(s.url) ? s.url : '#';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        line.append(link);
        list.append(line);
      }
      out.push(list);
    }
    $('detail').replaceChildren(...out);
    $('detail').scrollTop = 0;
  }

  // ── 배선 ────────────────────────────────────────────────────────────────
  $('gate').onsubmit = async (e) => {
    e.preventDefault();
    const res = await fetch('/admin/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ password: $('password').value }),
    });
    if (!res.ok) return showGate('비밀번호가 올바르지 않습니다.');
    $('password').value = '';
    await start();
  };

  $('filters').onsubmit = (e) => { e.preventDefault(); state.page = 0; loadSessions(); };
  $('prev').onclick = () => { if (state.page > 0) { state.page--; loadSessions(); } };
  $('next').onclick = () => { state.page++; loadSessions(); };

  async function start() {
    showApp();
    await Promise.all([loadOverview(), loadSessions()]);
  }

  // 쿠키가 이미 있으면 바로 데이터로, 없으면 401 → 게이트.
  start().catch(() => {});
</script>
