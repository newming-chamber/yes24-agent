[project]
name = "yes24-agent"
version = "0.1.0"
description = "Yes24 AI 에이전트 — Yes24를 라이브 소스로 쓰는 인용 기반 대화 어시스턴트"
requires-python = ">=3.10"
dependencies = [
    # 2.3.0 핀 고정: crema-ai에서 검증된 버전 (floating 시 라우터 silent 404 이력)
    "google-adk[db]==2.3.0",
    # LiteLLM 경로(selectable_models "openai/*") 모델용. 범위는 ADK 2.3.0의
    # extensions extra가 검증한 구간 — extra 전체(crewai·k8s 등)는 과해서 단독 추가.
    "litellm>=1.83.7,<=1.83.14",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic-settings>=2.4",
    # async SQLAlchemy 필수 런타임 의존성 — google-adk[db]가 안 끌어오는 환경(macOS arm) 대비 명시
    "greenlet>=3.0",
    "aiosqlite>=0.20",
    # MySQL async 드라이버. google-adk[db]의 extra에는 없어 배포용 SESSION_DB_URL
    # (mysql+aiomysql://…)을 쓰려면 별도 추가가 필요하다 — 로컬 sqlite 기본은 무영향.
    "aiomysql>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 빌드 시스템 없는 virtual 프로젝트라 uv sync로 패키지 자체는 설치되지 않음 —
# tests/에 __init__.py가 없어 pytest가 프로젝트 루트를 sys.path에 넣지 않으므로 명시.
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# rbti/persona.py는 스프레드시트 "유형별 코멘트" 16유형 원문(강점·함정·처방 서술문)을
# 콘텐츠 데이터로 그대로 보유한다. 원문 충실성상 문장을 줄바꿈으로 쪼갤 수 없어(공백·문장이
# 바뀔 위험) 이 데이터 모듈에 한해 E501(줄 길이)만 면제한다. 다른 파일엔 영향 없다.
"yes24_agent/rbti/persona.py" = ["E501"]
# agent.py의 긴 줄은 전부 프롬프트 문자열이다 — 프롬프트는 바이트 계약이라(줄바꿈 삽입이
# 곧 프롬프트 변경) 랩할 수 없고, 삼중따옴표 내부 줄엔 noqa 주석도 못 붙는다(본문 오염).
"yes24_agent/agent.py" = ["E501"]
